<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Гарант — безопасные сделки | Топовый дизайн</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* Новая тёмная премиум‑тема */
        :root {
            --bg-page: #0E0E12;
            --surface: #1A1C21;
            --card-bg: #1F2229;
            --border: #2A2D35;
            --text-primary: #FFFFFF;
            --text-secondary: #A0A3AF;
            --accent-cyan: #00E5FF;
            --accent-purple: #B942FF;
            --accent-green: #00E676;
            --accent-orange: #FFB74D;
            --danger: #FF4D4D;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-md: 0 8px 20px rgba(0,0,0,0.4);
            --radius-card: 28px;
            --radius-element: 20px;
            --transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        body {
            background: var(--bg-page);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* убираем стрелки у number */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 16px 90px;
        }

        /* карточки с градиентным бордером */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            opacity: 0.6;
        }

        /* кнопки */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            background: var(--surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .btn-primary {
            background: linear-gradient(95deg, var(--accent-cyan), var(--accent-purple));
            border: none;
            color: #000;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0,229,255,0.3);
        }
        .btn-primary:active {
            transform: scale(0.96);
            opacity: 0.9;
        }
        .btn-secondary {
            background: var(--surface);
        }
        .btn-secondary:active {
            transform: scale(0.96);
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,229,255,0.12);
            border-radius: 40px;
            padding: 6px 14px;
            font-size: 12px;
            color: var(--accent-cyan);
            backdrop-filter: blur(4px);
        }

        /* статистика */
        .stats-row {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat-item {
            background: var(--surface);
            border-radius: 24px;
            padding: 14px 8px;
            text-align: center;
            flex: 1;
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
        }
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, var(--accent-cyan));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* фильтры */
        .filter-row {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-chip {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 60px;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }
        .filter-chip.active {
            background: linear-gradient(95deg, var(--accent-cyan), var(--accent-purple));
            border-color: transparent;
            color: #000;
        }

        /* карточки сделок */
        .deal-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .deal-card {
            background: var(--surface);
            border-radius: var(--radius-element);
            padding: 16px;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid var(--border);
            position: relative;
        }
        .deal-card:active {
            transform: scale(0.98);
        }
        .deal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .deal-title {
            font-weight: 700;
            font-size: 16px;
        }
        .deal-price {
            font-weight: 700;
            color: var(--accent-cyan);
        }
        .deal-seller {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        .status-badge {
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
        }
        .status-waiting { background: rgba(255,180,77,0.15); color: var(--accent-orange); }
        .status-paid { background: rgba(0,229,255,0.15); color: var(--accent-cyan); }
        .status-sent { background: rgba(185,66,255,0.15); color: var(--accent-purple); }
        .status-completed { background: rgba(0,230,118,0.15); color: var(--accent-green); }

        /* модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--card-bg);
            border-radius: 40px;
            max-width: 400px;
            width: 100%;
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
        }
        .modal-input, .modal-textarea {
            width: 100%;
            padding: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 28px;
            color: white;
            margin-bottom: 16px;
            font-size: 15px;
        }
        .modal-input:focus, .modal-textarea:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        /* нижняя навигация */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(20,22,28,0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 16px env(safe-area-inset-bottom);
            max-width: 500px;
            margin: 0 auto;
        }
        .nav-btn {
            background: transparent;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
            font-size: 10px;
            padding: 8px 12px;
            border-radius: 40px;
            transition: var(--transition);
        }
        .nav-btn i { font-size: 22px; }
        .nav-btn.active {
            color: var(--accent-cyan);
            background: rgba(0,229,255,0.12);
        }

        /* чат */
        .chat-messages {
            max-height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 24px;
            background: var(--surface);
            align-self: flex-start;
            border: 1px solid var(--border);
        }
        .message.my {
            align-self: flex-end;
            background: linear-gradient(95deg, var(--accent-cyan), var(--accent-purple));
            color: #000;
            border: none;
        }
        .message-name { font-size: 12px; font-weight: 600; margin-bottom: 4px; opacity: 0.8; }
        .chat-input-area {
            display: flex;
            gap: 8px;
            background: var(--surface);
            border-radius: 60px;
            padding: 6px;
            border: 1px solid var(--border);
        }
        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 16px;
            color: white;
        }

        /* аватарки */
        .avatar-selector {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 16px 0;
        }
        .avatar-option {
            font-size: 44px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            background: var(--surface);
            transition: var(--transition);
        }
        .avatar-option.selected { background: rgba(0,229,255,0.2); transform: scale(1.05); }
        .current-avatar { font-size: 72px; text-align: center; margin-bottom: 12px; }
        .review-card {
            background: var(--surface);
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }

        /* анимация появления */
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card, .deal-card, .stat-item, .filter-chip {
            animation: fadeSlide 0.3s ease forwards;
        }
    </style>
</head>
<body>
<div class="container" id="app"></div>
<div class="bottom-nav">
    <button class="nav-btn active" data-tab="deals"><i class="fas fa-handshake"></i><span>Сделки</span></button>
    <button class="nav-btn" data-tab="chat"><i class="fas fa-comments"></i><span>Чат</span></button>
    <button class="nav-btn" data-tab="profile"><i class="fas fa-user"></i><span>Профиль</span></button>
    <button class="nav-btn" id="adminTabBtn" style="display: none;"><i class="fas fa-shield-alt"></i><span>Админ</span></button>
</div>
<div class="modal" id="globalModal"><div class="modal-content" id="modalContent"></div></div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.enableClosingConfirmation();
    tg.ready();

    const user = tg.initDataUnsafe?.user;
    const userName = user ? `${user.first_name} ${user.last_name || ''}` : 'Криптотрейдер';
    const userId = user ? user.id : Math.floor(Math.random() * 1000000);
    
    // Админ (замените на свой ID)
    const ADMIN_IDS = [8993992293];
    const isAdmin = ADMIN_IDS.includes(userId);

    let currency = "RUB";
    const TON_TO_RUB = 350;
    let userBalanceRUB = 15230;
    let allDeals = [];
    let chatMessages = [];
    let reviews = [];
    let usersData = {};
    let withdrawalRequests = [];
    let pendingInvoices = [];

    const avatarList = [
        '<i class="fas fa-user-astronaut"></i>', '<i class="fas fa-dragon"></i>', '<i class="fas fa-fox"></i>',
        '<i class="fas fa-robot"></i>', '<i class="fas fa-ghost"></i>', '<i class="fas fa-hat-wizard"></i>'
    ];

    function loadData() {
        const saved = localStorage.getItem('guarantee_top_design');
        if (saved) {
            const data = JSON.parse(saved);
            allDeals = data.allDeals || [];
            chatMessages = data.chatMessages || [];
            reviews = data.reviews || [];
            userBalanceRUB = data.userBalanceRUB ?? 15230;
            currency = data.currency || "RUB";
            usersData = data.usersData || {};
            withdrawalRequests = data.withdrawalRequests || [];
            pendingInvoices = data.pendingInvoices || [];
        } else {
            const demoDeal = {
                id: Date.now(),
                title: "iPhone 15 Pro",
                description: "Идеальное состояние",
                terms: "Полная проверка, гарантия",
                priceRUB: 55000,
                sellerId: userId,
                sellerName: userName,
                buyerId: null,
                buyerName: null,
                status: "waiting_payment",
                commissionRUB: 2750,
                createdAt: new Date().toISOString()
            };
            allDeals = [demoDeal];
            chatMessages = [
                { id: 1, userName: "CryptoBot", text: "Оплата через Crypto Bot — безопасно и быстро!", time: new Date().toLocaleTimeString(), userId: 777, likes: [] }
            ];
            usersData[userId] = { avatar: avatarList[0], balanceRUB: userBalanceRUB, name: userName };
        }
        if (!usersData[userId]) usersData[userId] = { avatar: avatarList[0], balanceRUB: userBalanceRUB, name: userName };
        else usersData[userId].balanceRUB = userBalanceRUB;
    }
    function saveData() {
        localStorage.setItem('guarantee_top_design', JSON.stringify({
            allDeals, chatMessages, reviews, userBalanceRUB, currency, usersData, withdrawalRequests, pendingInvoices
        }));
    }
    loadData();

    function formatPrice(priceRUB) {
        if (currency === "RUB") return `${priceRUB.toFixed(2)} ₽`;
        return `${(priceRUB / TON_TO_RUB).toFixed(4)} TON`;
    }

    function generateCryptoBotInvoice(deal) {
        const invoiceId = Date.now() + Math.random() * 1000;
        const payLink = `https://t.me/cryptobot?start=invoice_${invoiceId}`;
        pendingInvoices.push({ id: invoiceId, dealId: deal.id, amountRUB: deal.priceRUB, buyerId: userId, status: "pending", createdAt: new Date().toISOString() });
        saveData();
        return { invoiceId, payLink };
    }

    function confirmPaymentForDeal(deal) {
        if (userBalanceRUB < deal.priceRUB) {
            tg.showAlert(`❌ Недостаточно средств. Нужно ${formatPrice(deal.priceRUB)}`);
            return false;
        }
        userBalanceRUB -= deal.priceRUB;
        usersData[userId].balanceRUB = userBalanceRUB;
        deal.buyerId = userId;
        deal.buyerName = userName;
        deal.status = "paid";
        const inv = pendingInvoices.find(i => i.dealId === deal.id);
        if (inv) inv.status = "completed";
        saveData();
        tg.showAlert(`✅ Оплата произведена через Crypto Bot!`);
        renderCurrentTab();
        return true;
    }

    function sellerConfirmSent(deal) {
        if (deal.sellerId !== userId) { tg.showAlert("❌ Вы не продавец"); return; }
        if (deal.status !== "paid") { tg.showAlert("❌ Сделка не оплачена"); return; }
        deal.status = "seller_sent";
        saveData();
        tg.showAlert("📦 Вы подтвердили передачу товара.");
        renderCurrentTab();
    }

    function buyerConfirmReceived(deal) {
        if (deal.buyerId !== userId) { tg.showAlert("❌ Вы не покупатель"); return; }
        if (deal.status !== "seller_sent") { tg.showAlert("❌ Продавец ещё не подтвердил отправку"); return; }
        const sellerEarn = deal.priceRUB - deal.commissionRUB;
        if (deal.sellerId === userId) {
            userBalanceRUB += sellerEarn;
            usersData[userId].balanceRUB = userBalanceRUB;
        } else {
            if (!usersData[deal.sellerId]) usersData[deal.sellerId] = { avatar: avatarList[0], balanceRUB: 0, name: deal.sellerName };
            usersData[deal.sellerId].balanceRUB += sellerEarn;
        }
        deal.status = "completed";
        saveData();
        tg.showAlert(`✅ Сделка завершена! Продавец получил ${formatPrice(sellerEarn)} (комиссия 5%).`);
        setTimeout(() => showReviewModal(deal.sellerId, deal.sellerName, deal.id), 500);
        renderCurrentTab();
    }

    function createDeal(title, desc, terms, priceRUB) {
        const newDeal = {
            id: Date.now(),
            title, description: desc, terms,
            priceRUB: parseFloat(priceRUB),
            sellerId: userId, sellerName: userName,
            buyerId: null, buyerName: null,
            status: "waiting_payment",
            commissionRUB: parseFloat(priceRUB) * 0.05,
            createdAt: new Date().toISOString()
        };
        allDeals.push(newDeal);
        saveData();
        tg.showAlert(`✅ Сделка "${title}" создана!`);
        renderCurrentTab();
    }

    function startPayment(deal) {
        const invoice = generateCryptoBotInvoice(deal);
        const payMessage = `💳 Счёт на оплату "${deal.title}"\n💰 ${formatPrice(deal.priceRUB)}\n🔗 ${invoice.payLink}\nПосле оплаты нажмите "Я оплатил".`;
        chatMessages.push({ id: Date.now(), userName: "Crypto Bot", text: payMessage, time: new Date().toLocaleTimeString(), userId: 777, likes: [] });
        saveData();
        tg.showAlert(`💸 Счёт создан. Перейдите в чат и оплатите.`);
        showPaymentConfirmation(deal);
    }

    function showPaymentConfirmation(deal) {
        document.getElementById('modalContent').innerHTML = `
            <h3 style="margin-bottom:12px;"><i class="fas fa-credit-card"></i> Подтверждение оплаты</h3>
            <p>Оплатили счёт в Crypto Bot? Нажмите кнопку.</p>
            <button class="btn btn-primary" style="width:100%; margin:16px 0;" onclick="confirmPaymentAndClose(${deal.id})"><i class="fas fa-check-circle"></i> Я оплатил</button>
            <button class="btn btn-secondary" style="width:100%;" onclick="closeModal()">Отмена</button>
        `;
        document.getElementById('globalModal').classList.add('active');
    }

    function confirmPaymentAndClose(dealId) {
        const deal = allDeals.find(d => d.id === dealId);
        if (deal && confirmPaymentForDeal(deal)) closeModal();
        else closeModal();
        renderCurrentTab();
    }

    function requestWithdrawal(amountRUB) {
        if (amountRUB <= 0 || amountRUB > userBalanceRUB) { tg.showAlert("❌ Некорректная сумма"); return; }
        withdrawalRequests.push({ id: Date.now(), userId, userName, amountRUB, status: "pending", createdAt: new Date().toISOString() });
        userBalanceRUB -= amountRUB;
        usersData[userId].balanceRUB = userBalanceRUB;
        saveData();
        tg.showAlert(`📤 Заявка на вывод ${formatPrice(amountRUB)} отправлена.`);
        renderCurrentTab();
    }

    function adminApproveWithdrawal(reqId) {
        const req = withdrawalRequests.find(r => r.id === reqId);
        if (req && req.status === "pending") {
            req.status = "completed";
            tg.showAlert(`✅ Вывод ${formatPrice(req.amountRUB)} для ${req.userName} подтверждён.`);
            saveData();
            renderAdminPanel();
        }
    }

    function renderAdminPanel() {
        if (!isAdmin) return "";
        const pending = withdrawalRequests.filter(r => r.status === "pending");
        return `
            <div class="card" style="margin-top: 16px;">
                <div style="font-weight:700; margin-bottom:12px;"><i class="fas fa-tools"></i> Админ-панель</div>
                <div style="margin-bottom:12px;">Заявки на вывод (${pending.length})</div>
                ${pending.map(req => `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding: 12px 0; border-top:1px solid var(--border);">
                        <div>${req.userName}<br><span class="badge" style="background:none; padding:0;">${formatPrice(req.amountRUB)}</span></div>
                        <button class="btn" style="padding:6px 12px;" onclick="adminApproveWithdrawal(${req.id})">✅ Подтвердить</button>
                    </div>
                `).join('')}
                ${pending.length === 0 ? '<div class="badge">Нет заявок</div>' : ''}
            </div>
        `;
    }

    function addReview(toUserId, toUserName, dealId, rating, comment) {
        reviews.push({ id: Date.now(), fromUserId: userId, fromUserName: userName, toUserId, toUserName, dealId, rating, comment, createdAt: new Date().toISOString() });
        saveData();
        tg.showAlert("⭐ Отзыв сохранён!");
    }

    function showReviewModal(sellerId, sellerName, dealId) {
        if (reviews.some(r => r.dealId === dealId && r.fromUserId === userId)) return;
        document.getElementById('modalContent').innerHTML = `
            <h3>Отзыв о ${sellerName}</h3>
            <div id="starRating" style="display:flex; gap:8px; margin:16px 0;">
                ${[1,2,3,4,5].map(s => `<i class="far fa-star" data-star="${s}" style="font-size:28px; cursor:pointer; color:#FFB74D;"></i>`).join('')}
            </div>
            <textarea id="reviewComment" class="modal-textarea" placeholder="Ваш комментарий"></textarea>
            <button class="btn btn-primary" id="submitReviewBtn" style="width:100%;">Отправить отзыв</button>
            <button class="btn btn-secondary" style="width:100%; margin-top:12px;" onclick="closeModal()">Позже</button>
        `;
        document.getElementById('globalModal').classList.add('active');
        let selectedRating = 0;
        document.querySelectorAll('#starRating i').forEach(star => {
            star.onclick = () => {
                selectedRating = parseInt(star.getAttribute('data-star'));
                document.querySelectorAll('#starRating i').forEach((s, idx) => {
                    s.className = idx < selectedRating ? "fas fa-star" : "far fa-star";
                });
            };
        });
        document.getElementById('submitReviewBtn').onclick = () => {
            if (selectedRating === 0) { tg.showAlert("Выберите оценку"); return; }
            const comment = document.getElementById('reviewComment').value;
            addReview(sellerId, sellerName, dealId, selectedRating, comment);
            closeModal();
            renderCurrentTab();
        };
    }

    function sendMessage() {
        const input = document.getElementById('chatInput');
        const text = input?.value.trim();
        if (!text) return;
        chatMessages.push({ id: Date.now(), userName, text, time: new Date().toLocaleTimeString(), userId, likes: [] });
        saveData();
        input.value = '';
        renderChat();
        setTimeout(() => { const msgs = document.querySelector('.chat-messages'); if(msgs) msgs.scrollTop = msgs.scrollHeight; }, 50);
    }

    function likeMessage(msgId) {
        const msg = chatMessages.find(m => m.id === msgId);
        if (!msg) return;
        if (!msg.likes) msg.likes = [];
        if (msg.likes.includes(userId)) msg.likes = msg.likes.filter(id => id !== userId);
        else msg.likes.push(userId);
        saveData();
        renderChat();
    }

    function renderChat() {
        const messagesHtml = chatMessages.map(msg => `
            <div class="message ${msg.userId === userId ? 'my' : ''}">
                <div class="message-name">${msg.userName}</div>
                <div>${msg.text}</div>
                <div style="display:flex; justify-content:space-between; margin-top:6px;">
                    <span style="font-size:10px;">${msg.time}</span>
                    <button class="like-btn" onclick="likeMessage(${msg.id})" style="background:none; border:none; color:var(--accent-cyan);">
                        <i class="fa-${msg.likes && msg.likes.includes(userId) ? 'solid' : 'regular'} fa-heart"></i> ${msg.likes?.length || 0}
                    </button>
                </div>
            </div>
        `).join('');
        return `
            <div class="card">
                <h3 style="margin-bottom:16px;"><i class="fas fa-comments"></i> Общий чат</h3>
                <div class="chat-messages" id="chatMessagesList">${messagesHtml}</div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" class="chat-input" placeholder="Сообщение...">
                    <button class="btn btn-primary" style="padding: 10px 18px;" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        `;
    }

    function renderProfile() {
        const uData = usersData[userId];
        const dealsAsSeller = allDeals.filter(d => d.sellerId === userId);
        const dealsAsBuyer = allDeals.filter(d => d.buyerId === userId);
        const completedSeller = dealsAsSeller.filter(d => d.status === "completed");
        const earned = completedSeller.reduce((s, d) => s + (d.priceRUB - d.commissionRUB), 0);
        const spent = dealsAsBuyer.filter(d => d.status !== "waiting_payment").reduce((s, d) => s + d.priceRUB, 0);
        const myReviews = reviews.filter(r => r.toUserId === userId);
        const avgRating = myReviews.length ? (myReviews.reduce((s, r) => s + r.rating, 0) / myReviews.length).toFixed(1) : "—";
        const reviewsHtml = myReviews.map(r => `
            <div class="review-card">
                <div><strong>${r.fromUserName}</strong> <span>${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span></div>
                <div style="margin-top:4px;">${r.comment}</div>
                <div style="font-size:10px; color:var(--text-secondary); margin-top:6px;">${new Date(r.createdAt).toLocaleDateString()}</div>
            </div>
        `).join('');
        return `
            <div class="card" style="text-align:center;">
                <div class="current-avatar">${uData.avatar}</div>
                <h3>${userName}</h3>
                <div class="badge" style="margin-top:6px;"><i class="fas fa-id-card"></i> ID: ${userId}</div>
                <div class="stats-row" style="margin-top:20px;">
                    <div class="stat-item"><div class="stat-value">${formatPrice(userBalanceRUB)}</div><div class="stat-label">Баланс</div></div>
                    <div class="stat-item"><div class="stat-value">${dealsAsSeller.length}</div><div class="stat-label">Продаж</div></div>
                    <div class="stat-item"><div class="stat-value">${dealsAsBuyer.length}</div><div class="stat-label">Покупок</div></div>
                </div>
                <div style="background:rgba(255,255,255,0.05); border-radius:24px; padding:16px; margin:12px 0;">
                    <div><i class="fas fa-chart-line"></i> Заработано: ${formatPrice(earned)}</div>
                    <div><i class="fas fa-credit-card"></i> Потрачено: ${formatPrice(spent)}</div>
                    <div><i class="fas fa-star"></i> Рейтинг: ${avgRating} / 5 (${myReviews.length} отзывов)</div>
                </div>
                <div class="filter-row" style="justify-content:center;">
                    <div class="filter-chip ${currency === 'RUB' ? 'active' : ''}" onclick="setCurrency('RUB')">RUB</div>
                    <div class="filter-chip ${currency === 'TON' ? 'active' : ''}" onclick="setCurrency('TON')">TON</div>
                </div>
                <button class="btn btn-secondary" style="margin-top:8px;" onclick="showWithdrawalModal()"><i class="fas fa-money-bill-wave"></i> Вывести средства</button>
                <button class="btn btn-primary" style="margin-top:8px;" onclick="showCreateDealModal()"><i class="fas fa-plus"></i> Создать сделку</button>
                <button class="btn btn-secondary" style="margin-top:8px;" onclick="showAvatarSelector()"><i class="fas fa-user-edit"></i> Сменить аватар</button>
            </div>
            <div class="card">
                <h3><i class="fas fa-pen-alt"></i> Отзывы обо мне</h3>
                ${reviewsHtml || '<div class="badge" style="margin-top:8px;">Пока нет отзывов</div>'}
            </div>
        `;
    }

    let activeFilter = "all";
    function getFilteredDeals() {
        let filtered = allDeals;
        if (activeFilter === "as_seller") filtered = filtered.filter(d => d.sellerId === userId);
        if (activeFilter === "as_buyer") filtered = filtered.filter(d => d.buyerId === userId);
        return filtered;
    }

    function renderDealsPage() {
        const filtered = getFilteredDeals();
        const dealsHtml = filtered.map(deal => {
            let statusText = "", statusClass = "";
            switch (deal.status) {
                case "waiting_payment": statusText = "Ожидает оплаты"; statusClass = "status-waiting"; break;
                case "paid": statusText = "Оплачено"; statusClass = "status-paid"; break;
                case "seller_sent": statusText = "Товар передан"; statusClass = "status-sent"; break;
                case "completed": statusText = "Завершено"; statusClass = "status-completed"; break;
            }
            return `
                <div class="deal-card" onclick="showDealDetail(${deal.id})">
                    <div class="deal-header">
                        <span class="deal-title">${deal.title}</span>
                        <span class="deal-price">${formatPrice(deal.priceRUB)}</span>
                    </div>
                    <div class="deal-seller"><i class="fas fa-user"></i> ${deal.sellerName}</div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                        <span class="status-badge ${statusClass}">${statusText}</span>
                        ${deal.status === "waiting_payment" && deal.sellerId !== userId ? `<button class="btn btn-primary" style="padding:4px 12px;" onclick="event.stopPropagation(); startPaymentAndShow(${deal.id})">Купить</button>` : ''}
                    </div>
                </div>
            `;
        }).join('');
        return `
            <div style="margin-bottom:20px;">
                <h1 style="font-size:32px; font-weight:800; background:linear-gradient(135deg,#fff,var(--accent-cyan)); -webkit-background-clip:text; background-clip:text; color:transparent;">Гарант</h1>
                <div class="badge" style="margin-top:6px;"><i class="fas fa-bolt"></i> 5% комиссия | Оплата через Crypto Bot</div>
            </div>
            <div class="stats-row">
                <div class="stat-item"><div class="stat-value">${formatPrice(userBalanceRUB)}</div><div class="stat-label">Баланс</div></div>
                <div class="stat-item"><div class="stat-value">${allDeals.length}</div><div class="stat-label">сделок</div></div>
            </div>
            <div class="filter-row">
                <div class="filter-chip ${activeFilter === 'all' ? 'active' : ''}" data-filter="all">Все</div>
                <div class="filter-chip ${activeFilter === 'as_seller' ? 'active' : ''}" data-filter="as_seller">Я продавец</div>
                <div class="filter-chip ${activeFilter === 'as_buyer' ? 'active' : ''}" data-filter="as_buyer">Я покупатель</div>
            </div>
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                    <h3><i class="fas fa-list"></i> Сделки</h3>
                    <button class="btn btn-secondary" style="padding:6px 14px;" onclick="showCreateDealModal()"><i class="fas fa-plus"></i> Новая</button>
                </div>
                <div class="deal-list">${dealsHtml || '<div class="badge">Нет сделок</div>'}</div>
            </div>
            ${isAdmin ? renderAdminPanel() : ''}
        `;
    }

    function showDealDetail(dealId) {
        const deal = allDeals.find(d => d.id === dealId);
        if (!deal) return;
        let actionBtns = "";
        const isSeller = deal.sellerId === userId;
        const isBuyer = deal.buyerId === userId;
        if (deal.status === "waiting_payment" && !isSeller) {
            actionBtns = `<button class="btn btn-primary" style="width:100%; margin-top:12px;" onclick="startPaymentAndShow(${deal.id})"><i class="fas fa-credit-card"></i> Оплатить через Crypto Bot</button>`;
        } else if (deal.status === "paid" && isSeller) {
            actionBtns = `<button class="btn btn-secondary" style="width:100%; margin-top:12px;" onclick="sellerConfirmSentById(${deal.id})"><i class="fas fa-box"></i> Подтвердить передачу</button>`;
        } else if (deal.status === "seller_sent" && isBuyer) {
            actionBtns = `<button class="btn btn-primary" style="width:100%; margin-top:12px;" onclick="buyerConfirmReceivedById(${deal.id})"><i class="fas fa-check-circle"></i> Подтвердить получение</button>`;
        }
        document.getElementById('modalContent').innerHTML = `
            <h3>${deal.title}</h3>
            <p><strong>Описание:</strong> ${deal.description || "—"}</p>
            <p><strong>Условия:</strong> ${deal.terms || "Стандартные"}</p>
            <div style="background:rgba(255,255,255,0.05); border-radius:20px; padding:12px; margin:16px 0;">
                <div><i class="fas fa-tag"></i> Цена: ${formatPrice(deal.priceRUB)}</div>
                <div><i class="fas fa-percent"></i> Комиссия (5%): ${formatPrice(deal.commissionRUB)}</div>
                <div><i class="fas fa-user"></i> Продавец: ${deal.sellerName}</div>
                <div><i class="fas fa-user-check"></i> Покупатель: ${deal.buyerName || "—"}</div>
            </div>
            ${actionBtns}
            <button class="btn btn-secondary" onclick="closeModal()">Закрыть</button>
        `;
        document.getElementById('globalModal').classList.add('active');
    }

    function startPaymentAndShow(dealId) {
        const deal = allDeals.find(d => d.id === dealId);
        if (deal) startPayment(deal);
        closeModal();
    }

    function showCreateDealModal() {
        document.getElementById('modalContent').innerHTML = `
            <h3 style="margin-bottom:16px;"><i class="fas fa-plus-circle"></i> Новая сделка</h3>
            <input id="dealTitle" class="modal-input" placeholder="Название товара">
            <textarea id="dealDesc" class="modal-textarea" placeholder="Описание"></textarea>
            <textarea id="dealTerms" class="modal-textarea" placeholder="Условия сделки (доставка, гарантии)"></textarea>
            <input id="dealPrice" type="number" class="modal-input" placeholder="Цена в рублях" step="1">
            <div class="badge" style="margin-bottom:12px;">Комиссия сервиса: 5%</div>
            <button class="btn btn-primary" onclick="createDealFromModal()">Создать</button>
            <button class="btn btn-secondary" style="margin-top:12px;" onclick="closeModal()">Отмена</button>
        `;
        document.getElementById('globalModal').classList.add('active');
    }

    window.createDealFromModal = () => {
        const title = document.getElementById('dealTitle').value.trim();
        const desc = document.getElementById('dealDesc').value.trim();
        const terms = document.getElementById('dealTerms').value.trim();
        const price = parseFloat(document.getElementById('dealPrice').value);
        if (!title || !price || price <= 0) { tg.showAlert("❌ Заполните название и цену"); return; }
        createDeal(title, desc, terms, price);
        closeModal();
    };
    window.confirmPaymentAndClose = confirmPaymentAndClose;
    window.startPaymentAndShow = startPaymentAndShow;
    window.sellerConfirmSentById = (id) => { const d = allDeals.find(dd => dd.id === id); if(d) sellerConfirmSent(d); closeModal(); renderCurrentTab(); };
    window.buyerConfirmReceivedById = (id) => { const d = allDeals.find(dd => dd.id === id); if(d) buyerConfirmReceived(d); closeModal(); renderCurrentTab(); };
    window.setCurrency = (c) => { currency = c; saveData(); renderCurrentTab(); };
    window.changeAvatar = (av) => { usersData[userId].avatar = av; saveData(); renderProfile(); };
    window.submitWithdrawal = () => { const amount = parseFloat(document.getElementById('withdrawAmount')?.value); if(amount>0) requestWithdrawal(amount); closeModal(); };
    window.adminApproveWithdrawal = adminApproveWithdrawal;
    window.closeModal = () => document.getElementById('globalModal').classList.remove('active');
    window.sendMessage = sendMessage;
    window.likeMessage = likeMessage;

    function showWithdrawalModal() {
        document.getElementById('modalContent').innerHTML = `
            <h3><i class="fas fa-money-bill-wave"></i> Вывод средств в Crypto Bot</h3>
            <p style="margin:8px 0;">Средства поступят после проверки администратором.</p>
            <input type="number" id="withdrawAmount" class="modal-input" placeholder="Сумма в рублях">
            <button class="btn btn-primary" onclick="submitWithdrawal()">Запросить вывод</button>
            <button class="btn btn-secondary" style="margin-top:12px;" onclick="closeModal()">Отмена</button>
        `;
        document.getElementById('globalModal').classList.add('active');
    }

    function showAvatarSelector() {
        document.getElementById('modalContent').innerHTML = `
            <h3><i class="fas fa-image"></i> Выберите аватар</h3>
            <div class="avatar-selector">
                ${avatarList.map(av => `<div class="avatar-option" onclick="changeAvatar('${av.replace(/[']/g, "\\'")}')">${av}</div>`).join('')}
            </div>
            <button class="btn btn-secondary" onclick="closeModal()">Закрыть</button>
        `;
        document.getElementById('globalModal').classList.add('active');
    }

    let activeTab = "deals";
    function renderCurrentTab() {
        const appDiv = document.getElementById('app');
        if (activeTab === "deals") appDiv.innerHTML = renderDealsPage();
        else if (activeTab === "chat") appDiv.innerHTML = renderChat();
        else if (activeTab === "profile") appDiv.innerHTML = renderProfile();
        document.querySelectorAll('.nav-btn').forEach(btn => {
            if (btn.getAttribute('data-tab') === activeTab) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        if (activeTab === "deals") {
            document.querySelectorAll('.filter-chip[data-filter]').forEach(chip => {
                chip.onclick = () => {
                    activeFilter = chip.getAttribute('data-filter');
                    renderCurrentTab();
                };
            });
        }
        if (activeTab === "chat") {
            setTimeout(() => {
                const msgs = document.querySelector('.chat-messages');
                if (msgs) msgs.scrollTop = msgs.scrollHeight;
            }, 50);
        }
    }

    if (isAdmin) document.getElementById('adminTabBtn').style.display = 'flex';
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            activeTab = btn.getAttribute('data-tab');
            renderCurrentTab();
        });
    });
    renderCurrentTab();
</script>
</body>
</html>
