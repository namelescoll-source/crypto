<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Crypto Bot Mini App</title>
    
    <!-- Подключаем иконки Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Подключаем Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* Используем переменные Telegram для автоматической темы */
        body {
            background-color: var(--tg-theme-bg-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--tg-theme-text-color, #ffffff);
        }

        /* Основной контент с отступом для панели */
        .content {
            padding: 20px;
            padding-bottom: 80px; /* Отступ, чтобы контент не уходил под панель */
            min-height: 100vh;
        }

        /* Карточка с балансом */
        .balance-card {
            background: var(--tg-theme-secondary-bg-color, #1c1c1e);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .balance-amount {
            font-size: 36px;
            font-weight: bold;
            margin: 10px 0;
        }

        /* Кнопка */
        .action-button {
            background: #34c759;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
        }

        /* Список операций */
        .transaction-list {
            background: var(--tg-theme-secondary-bg-color, #1c1c1e);
            border-radius: 16px;
            overflow: hidden;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            padding: 16px;
            border-bottom: 1px solid var(--tg-theme-hint-color, #2c2c2e);
        }

        .transaction-amount {
            color: #34c759;
            font-weight: 600;
        }

        /* ===== НИЖНЯЯ ПАНЕЛЬ ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--tg-theme-bottom-bar-bg-color, #1c1c1e);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); /* Учитываем "чёлку" iPhone */
            border-top: 0.5px solid var(--tg-theme-hint-color, #2c2c2e);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            color: var(--tg-theme-hint-color, #8e8e93);
            font-size: 10px;
            font-weight: 500;
            transition: color 0.2s;
            padding: 8px 0;
            background: transparent;
            border: none;
            font-family: inherit;
        }

        .nav-item i {
            font-size: 24px;
        }

        .nav-item.active {
            color: #34c759; /* Зеленый как в Crypto Bot */
        }
    </style>
</head>
<body>

    <div class="content" id="app">
        <!-- Контент будет меняться динамически -->
    </div>

    <div class="bottom-nav">
        <button class="nav-item active" data-tab="wallet">
            <i class="fas fa-wallet"></i>
            <span>Кошелёк</span>
        </button>
        <button class="nav-item" data-tab="exchange">
            <i class="fas fa-chart-line"></i>
            <span>Биржа</span>
        </button>
        <button class="nav-item" data-tab="swap">
            <i class="fas fa-exchange-alt"></i>
            <span>Обмен</span>
        </button>
        <button class="nav-item" data-tab="more">
            <i class="fas fa-ellipsis-h"></i>
            <span>Ещё</span>
        </button>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        
        // 1. Расширяем приложение на весь экран (убираем BottomSheet) [citation:1]
        tg.expand();
        
        // 2. Отключаем стандартную кнопку "Назад" (управляем сами)
        tg.BackButton.hide();
        
        // 3. Включаем возможность закрытия свайпом
        tg.enableClosingConfirmation();
        
        // 4. Настраиваем цвет нижней панели [citation:6]
        tg.setBottomBarColor('#1c1c1e');
        
        // 5. Отправляем событие, что приложение готово
        tg.ready();

        // Данные для разных вкладок
        const tabsData = {
            wallet: `
                <div class="balance-card">
                    <i class="fas fa-wallet" style="font-size: 32px; color: #34c759;"></i>
                    <div class="balance-amount">1,234.56 TON</div>
                    <div>≈ $5,678.90 USD</div>
                </div>
                <button class="action-button" id="topupBtn">
                    <i class="fas fa-plus"></i> Пополнить
                </button>
                
                <h3 style="margin: 20px 0 10px;">Последние операции</h3>
                <div class="transaction-list">
                    <div class="transaction-item">
                        <span>Получено от User123</span>
                        <span class="transaction-amount">+10 TON</span>
                    </div>
                    <div class="transaction-item">
                        <span>Отправлено на биржу</span>
                        <span class="transaction-amount" style="color: #ff3b30;">-5 TON</span>
                    </div>
                    <div class="transaction-item">
                        <span>Награда за реферала</span>
                        <span class="transaction-amount">+2.5 TON</span>
                    </div>
                </div>
            `,
            exchange: `
                <h2 style="margin-bottom: 20px;">📊 Рынки</h2>
                <div class="transaction-list">
                    <div class="transaction-item">
                        <div><strong>TON/USDT</strong><br><span style="font-size: 12px;">+2.34%</span></div>
                        <div style="text-align: right;"><strong>$5.67</strong><br><span style="font-size: 12px; color: #34c759;">▲ 0.13</span></div>
                    </div>
                    <div class="transaction-item">
                        <div><strong>BTC/USDT</strong><br><span style="font-size: 12px; color: #34c759;">+1.23%</span></div>
                        <div style="text-align: right;"><strong>$67,890</strong><br><span style="font-size: 12px; color: #34c759;">▲ 823</span></div>
                    </div>
                    <div class="transaction-item">
                        <div><strong>ETH/USDT</strong><br><span style="font-size: 12px; color: #ff3b30;">-0.56%</span></div>
                        <div style="text-align: right;"><strong>$3,456</strong><br><span style="font-size: 12px; color: #ff3b30;">▼ 19</span></div>
                    </div>
                </div>
                <button class="action-button" style="margin-top: 20px;">
                    <i class="fas fa-chart-simple"></i> Перейти к торговле
                </button>
            `,
            swap: `
                <h2 style="margin-bottom: 20px;">🔄 Обмен валют</h2>
                <div class="balance-card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <span>Отправляете</span>
                        <span>Баланс: 1,234 TON</span>
                    </div>
                    <div style="background: var(--tg-theme-bg-color, #000); border-radius: 12px; padding: 16px;">
                        <input type="number" placeholder="0" id="fromAmount" style="background: transparent; border: none; font-size: 24px; width: 100%; color: white; outline: none;">
                        <div style="display: flex; justify-content: space-between; margin-top: 10px;">
                            <span>💎 TON</span>
                            <span>≈ $0.00</span>
                        </div>
                    </div>
                    
                    <div style="text-align: center; margin: 15px 0;">
                        <i class="fas fa-arrow-down" style="background: #34c759; padding: 8px 12px; border-radius: 50%;"></i>
                    </div>
                    
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <span>Получаете</span>
                    </div>
                    <div style="background: var(--tg-theme-bg-color, #000); border-radius: 12px; padding: 16px;">
                        <input type="text" placeholder="0" id="toAmount" readonly style="background: transparent; border: none; font-size: 24px; width: 100%; color: white; outline: none;">
                        <div style="display: flex; justify-content: space-between; margin-top: 10px;">
                            <span>💰 USDT</span>
                            <span>≈ $0.00</span>
                        </div>
                    </div>
                </div>
                <button class="action-button" id="swapBtn">Обменять</button>
            `,
            more: `
                <h2 style="margin-bottom: 20px;">⚙️ Настройки</h2>
                <div class="transaction-list">
                    <div class="transaction-item" id="referralBtn" style="cursor: pointer;">
                        <span><i class="fas fa-users"></i> Реферальная программа</span>
                        <span style="color: #34c759;">→</span>
                    </div>
                    <div class="transaction-item" id="themeBtn" style="cursor: pointer;">
                        <span><i class="fas fa-palette"></i> Тема оформления</span>
                        <span style="color: #34c759;">→</span>
                    </div>
                    <div class="transaction-item" id="supportBtn" style="cursor: pointer;">
                        <span><i class="fas fa-headset"></i> Поддержка</span>
                        <span style="color: #34c759;">→</span>
                    </div>
                    <div class="transaction-item" id="closeBtn" style="cursor: pointer;">
                        <span><i class="fas fa-times-circle"></i> Закрыть приложение</span>
                        <span style="color: #ff3b30;">→</span>
                    </div>
                </div>
                <div style="margin-top: 20px; text-align: center; font-size: 12px; color: var(--tg-theme-hint-color);">
                    Версия 1.0.0
                </div>
            `
        };

        // Функция для смены вкладки
        function switchTab(tabName, activeElement) {
            // Обновляем контент
            document.getElementById('app').innerHTML = tabsData[tabName];
            
            // Обновляем активный класс у кнопок
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.classList.remove('active');
            });
            activeElement.classList.add('active');
            
            // После смены контента навешиваем обработчики (если нужны)
            attachTabHandlers(tabName);
        }
        
        // Дополнительные обработчики для каждой вкладки
        function attachTabHandlers(tabName) {
            if (tabName === 'wallet') {
                const topupBtn = document.getElementById('topupBtn');
                if (topupBtn) {
                    topupBtn.onclick = () => {
                        tg.showAlert('Пополнение через TON Wallet будет доступно в следующем обновлении!');
                    };
                }
            }
            
            if (tabName === 'swap') {
                const fromAmount = document.getElementById('fromAmount');
                const toAmount = document.getElementById('toAmount');
                const swapBtn = document.getElementById('swapBtn');
                
                if (fromAmount) {
                    fromAmount.oninput = () => {
                        const value = parseFloat(fromAmount.value) || 0;
                        toAmount.value = (value * 5.67).toFixed(2); // Курс 1 TON = 5.67 USDT
                    };
                }
                
                if (swapBtn) {
                    swapBtn.onclick = () => {
                        const amount = parseFloat(fromAmount.value) || 0;
                        if (amount <= 0) {
                            tg.showAlert('Введите сумму для обмена');
                        } else {
                            tg.showConfirm(`Обменять ${amount} TON на ${amount * 5.67} USDT?`, (confirmed) => {
                                if (confirmed) {
                                    tg.showAlert('✅ Обмен выполнен! (демо-режим)');
                                    fromAmount.value = '';
                                    toAmount.value = '';
                                }
                            });
                        }
                    };
                }
            }
            
            if (tabName === 'more') {
                const referralBtn = document.getElementById('referralBtn');
                const themeBtn = document.getElementById('themeBtn');
                const supportBtn = document.getElementById('supportBtn');
                const closeBtn = document.getElementById('closeBtn');
                
                if (referralBtn) {
                    referralBtn.onclick = () => {
                        tg.showAlert('Ваша реферальная ссылка:\nt.me/ваш_бот?start=ref_123456');
                    };
                }
                
                if (themeBtn) {
                    themeBtn.onclick = () => {
                        // Меняем цвет панели для демонстрации [citation:6]
                        const currentColor = tg.bottomBarColor;
                        const newColor = currentColor === '#1c1c1e' ? '#2c2c3e' : '#1c1c1e';
                        tg.setBottomBarColor(newColor);
                        tg.showAlert('Цвет панели изменён!');
                    };
                }
                
                if (supportBtn) {
                    supportBtn.onclick = () => {
                        tg.openTelegramLink('https://t.me/durov');
                    };
                }
                
                if (closeBtn) {
                    closeBtn.onclick = () => {
                        tg.close();
                    };
                }
            }
        }
        
        // Навешиваем обработчики на кнопки навигации
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', () => {
                const tabName = btn.getAttribute('data-tab');
                switchTab(tabName, btn);
            });
        });
        
        // Загружаем начальную вкладку
        const initialBtn = document.querySelector('.nav-item.active');
        if (initialBtn) {
            switchTab('wallet', initialBtn);
        }
        
        // Получаем параметр реферала из Telegram (если есть) [citation:2]
        const initData = tg.initDataUnsafe;
        if (initData && initData.start_param) {
            console.log('Referral param:', initData.start_param);
            // Здесь можно отправить реферала на сервер
        }
        
        // Показываем приветствие для новых пользователей
        if (!initData || !initData.user) {
            console.log('Mini App opened');
        } else {
            console.log(`Welcome, ${initData.user.first_name}!`);
        }
    </script>
</body>
</html>
