<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Crypto Bot - Универсальная биржа</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        :root {
            --bg-dark: #0a0a0c;
            --bg-card: rgba(19, 21, 26, 0.9);
            --green-primary: #00d47e;
            --green-glow: rgba(0, 212, 126, 0.4);
            --red: #ff4757;
            --blue: #3b82f6;
            --orange: #ff9800;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --border: rgba(28, 31, 38, 0.8);
        }

        body {
            background: var(--bg-dark);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .content {
            padding: 20px;
            padding-bottom: 90px;
            position: relative;
            z-index: 1;
        }

        /* ========== ХЕДЕР ========== */
        .wallet-header {
            background: linear-gradient(135deg, rgba(0, 212, 126, 0.2), rgba(59, 130, 246, 0.15));
            border-radius: 48px;
            padding: 28px;
            margin-bottom: 24px;
            border: 1px solid rgba(0, 212, 126, 0.4);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .wallet-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, var(--green-glow) 0%, transparent 70%);
            animation: rotateGlow 8s linear infinite;
            pointer-events: none;
        }

        @keyframes rotateGlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .balance-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 2;
        }

        .wallet-balance-label {
            font-size: 14px;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }

        .wallet-balance {
            font-size: 48px;
            font-weight: 800;
            margin: 8px 0;
            background: linear-gradient(135deg, #fff, var(--green-primary), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* Анимированное кольцо */
        .ring-container {
            position: relative;
            width: 80px;
            height: 80px;
            flex-shrink: 0;
        }

        .ring-progress {
            transform: rotate(-90deg);
            width: 80px;
            height: 80px;
        }

        .ring-progress circle {
            fill: none;
            stroke-width: 6;
            stroke-linecap: round;
        }

        .ring-bg {
            stroke: rgba(255, 255, 255, 0.1);
        }

        .ring-fill {
            stroke: url(#ringGradient);
            stroke-dasharray: 226.2;
            stroke-dashoffset: 226.2;
        }

        .ring-percent {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
            text-align: center;
        }

        .ring-label {
            font-size: 9px;
            margin-top: 2px;
            color: var(--text-secondary);
        }

        /* Волна */
        .wave-container {
            position: relative;
            height: 30px;
            margin-top: 16px;
            overflow: hidden;
            z-index: 2;
        }

        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 20px;
            background: repeating-linear-gradient(90deg, transparent, transparent 15px, rgba(0, 212, 126, 0.2) 15px, rgba(0, 212, 126, 0.2) 30px);
            animation: waveMove 2s linear infinite;
        }

        .wave:nth-child(2) {
            bottom: 5px;
            opacity: 0.5;
            animation: waveMove 2.5s linear infinite reverse;
        }

        @keyframes waveMove {
            from { transform: translateX(0); }
            to { transform: translateX(30px); }
        }

        .currency-selector {
            background: rgba(10, 10, 12, 0.8);
            border: 1px solid rgba(0, 212, 126, 0.4);
            border-radius: 60px;
            padding: 10px 20px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
            margin-top: 12px;
        }

        .currency-selector:hover {
            border-color: var(--green-primary);
            transform: scale(1.02);
            box-shadow: 0 0 20px var(--green-glow);
        }

        /* ========== НИЖНЯЯ НАВИГАЦИЯ ========== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 17, 21, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 20px constant(safe-area-inset-bottom);
            padding: 8px 20px env(safe-area-inset-bottom);
            border-top: 1px solid var(--border);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
            padding: 8px 20px;
            background: transparent;
            border: none;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 40px;
        }

        .nav-item i {
            font-size: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-item:hover {
            transform: translateY(-3px);
        }

        .nav-item:hover i {
            transform: translateY(-4px) scale(1.1);
            text-shadow: 0 0 8px var(--green-glow);
        }

        .nav-item.active {
            color: var(--green-primary);
        }

        .nav-item.active i {
            transform: translateY(-3px) scale(1.08);
            text-shadow: 0 0 12px var(--green-glow);
            animation: iconPulse 0.5s ease;
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 3px;
            background: linear-gradient(90deg, var(--green-primary), var(--blue));
            border-radius: 3px;
            animation: underlineSlide 0.3s ease;
        }

        @keyframes underlineSlide {
            from { width: 0; opacity: 0; }
            to { width: 28px; opacity: 1; }
        }

        @keyframes iconPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1.08); }
        }

        .nav-item:active {
            transform: scale(0.92);
        }

        /* ========== КАРТОЧКИ АКТИВОВ ========== */
        .assets-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .asset-card {
            background: rgba(19, 21, 26, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 16px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .asset-card:hover {
            transform: translateY(-3px);
            border-color: var(--green-primary);
        }

        .asset-card:active {
            transform: scale(0.98);
        }

        /* ========== ДЕТАЛЬНАЯ КАРТОЧКА АКТИВА ========== */
        .detail-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .detail-modal.active {
            display: flex;
            animation: fadeInUp 0.3s ease;
        }

        .detail-card {
            background: linear-gradient(145deg, #1a1d24, #0d0f14);
            border-radius: 56px;
            padding: 32px;
            width: 100%;
            max-width: 380px;
            border: 1px solid rgba(0, 212, 126, 0.4);
            text-align: center;
            animation: modalPop 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
        }

        @keyframes modalPop {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .detail-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .detail-name {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .detail-balance {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, var(--green-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 16px 0;
        }

        .detail-usd {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .detail-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .detail-btn {
            flex: 1;
            padding: 14px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .detail-btn.send {
            background: linear-gradient(135deg, var(--blue), #2563eb);
            color: white;
        }

        .detail-btn.receive {
            background: linear-gradient(135deg, var(--green-primary), #00995a);
            color: white;
        }

        .detail-btn.close {
            background: rgba(28, 31, 38, 0.8);
            color: var(--text-secondary);
            margin-top: 12px;
        }

        .detail-btn:active {
            transform: scale(0.96);
        }

        /* ========== 3D КНОПКИ ДЕЙСТВИЙ ========== */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
            perspective: 800px;
        }

        .action-btn {
            background: rgba(19, 21, 26, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            animation: btn3DEnter 0.5s cubic-bezier(0.34, 1.2, 0.64, 1) backwards;
        }

        .action-btn:nth-child(1) { animation-delay: 0.05s; }
        .action-btn:nth-child(2) { animation-delay: 0.1s; }
        .action-btn:nth-child(3) { animation-delay: 0.15s; }
        .action-btn:nth-child(4) { animation-delay: 0.2s; }

        @keyframes btn3DEnter {
            0% {
                opacity: 0;
                transform: rotateX(-30deg) rotateY(-15deg) translateY(60px) scale(0.8);
            }
            100% {
                opacity: 1;
                transform: rotateX(0deg) rotateY(0deg) translateY(0) scale(1);
            }
        }

        .action-btn:hover {
            transform: translateY(-5px) rotateX(5deg);
            border-color: var(--green-primary);
            box-shadow: 0 15px 30px -10px rgba(0, 212, 126, 0.3);
        }

        .action-btn:active {
            transform: translateY(2px) rotateX(-3deg) scale(0.96);
        }

        .action-icon {
            font-size: 24px;
            margin-bottom: 6px;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .action-btn:hover .action-icon {
            transform: translateY(-3px) scale(1.1);
        }

        .action-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* ========== УНИВЕРСАЛЬНАЯ БИРЖА ========== */
        .trade-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .trade-btn {
            flex: 1;
            padding: 16px;
            border-radius: 40px;
            border: none;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .trade-btn.buy {
            background: linear-gradient(135deg, var(--green-primary), #00995a);
            color: white;
        }

        .trade-btn.sell {
            background: linear-gradient(135deg, var(--red), #cc3b4a);
            color: white;
        }

        .trade-btn:active {
            transform: scale(0.96);
        }

        .percentage-buttons {
            display: flex;
            gap: 8px;
            margin: 16px 0;
        }

        .perc-btn {
            flex: 1;
            padding: 12px;
            background: rgba(10, 10, 12, 0.8);
            border: 1px solid var(--border);
            border-radius: 24px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .perc-btn:active {
            transform: scale(0.95);
            background: var(--green-primary);
            color: white;
        }

        .pair-selector {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .pair-currency {
            background: rgba(10, 10, 12, 0.8);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pair-currency:hover {
            border-color: var(--green-primary);
        }

        /* ========== МОДАЛЬНЫЕ ОКНА ========== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(145deg, rgba(25, 28, 35, 0.95), rgba(15, 17, 22, 0.98));
            border-radius: 56px;
            padding: 28px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(0, 212, 126, 0.3);
            animation: modal3DEnter 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
            max-height: 85vh;
            overflow-y: auto;
        }

        @keyframes modal3DEnter {
            from {
                opacity: 0;
                transform: rotateX(-15deg) translateY(50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: rotateX(0deg) translateY(0) scale(1);
            }
        }

        .modal-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, var(--green-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal-input {
            width: 100%;
            padding: 16px;
            background: rgba(10, 10, 12, 0.8);
            border: 1px solid var(--border);
            border-radius: 28px;
            color: white;
            font-size: 16px;
            margin-bottom: 16px;
        }

        .modal-input:focus {
            outline: none;
            border-color: var(--green-primary);
            box-shadow: 0 0 15px var(--green-glow);
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 14px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-btn.confirm {
            background: linear-gradient(135deg, var(--green-primary), #00995a);
            color: white;
        }

        .modal-btn.cancel {
            background: rgba(28, 31, 38, 0.8);
            color: var(--text-secondary);
        }

        .modal-btn.danger {
            background: linear-gradient(135deg, var(--red), #cc3b4a);
            color: white;
        }

        .dropzone {
            border: 2px dashed var(--border);
            border-radius: 28px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            margin: 16px 0;
            transition: all 0.3s;
        }

        .dropzone:hover {
            border-color: var(--green-primary);
            background: rgba(0, 212, 126, 0.05);
        }

        .payment-method {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            background: rgba(10, 10, 12, 0.6);
            border: 1px solid var(--border);
            border-radius: 28px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .payment-method:hover {
            border-color: var(--green-primary);
            transform: translateX(5px);
        }

        .payment-method.selected {
            border-color: var(--green-primary);
            background: rgba(0, 212, 126, 0.1);
        }

        .requisites-info {
            background: rgba(0, 212, 126, 0.1);
            border-radius: 24px;
            padding: 16px;
            margin: 16px 0;
        }

        .pending-card {
            background: rgba(10, 10, 12, 0.6);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pending-card:hover {
            border-color: var(--orange);
            transform: translateX(5px);
        }

        .status-pending {
            background: var(--orange);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-approved {
            background: var(--green-primary);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        /* Кастомный грид выбора валюты */
        .currency-grid-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .currency-grid-modal.active {
            display: flex;
            animation: fadeInUp 0.3s ease;
        }

        .currency-grid-container {
            background: linear-gradient(135deg, #13151a, #0d0f14);
            border-radius: 48px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(0, 212, 126, 0.3);
            position: relative;
        }

        .currency-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 20px;
        }

        .currency-option {
            background: rgba(10, 10, 12, 0.6);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .currency-option:hover {
            border-color: var(--green-primary);
            transform: translateY(-3px);
            background: rgba(0, 212, 126, 0.1);
        }

        .currency-option.selected {
            border-color: var(--green-primary);
            background: rgba(0, 212, 126, 0.15);
        }
    </style>
</head>
<body>
    <div class="content" id="app"></div>

    <div class="bottom-nav">
        <button class="nav-item active" data-tab="wallet"><i class="fas fa-wallet"></i><span>Кошелёк</span></button>
        <button class="nav-item" data-tab="exchange"><i class="fas fa-chart-line"></i><span>Биржа</span></button>
        <button class="nav-item" data-tab="profile"><i class="fas fa-user"></i><span>Профиль</span></button>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <div class="modal" id="adminModal" style="display:none;">
        <div class="modal-content" id="adminModalContent"></div>
    </div>

    <div class="currency-grid-modal" id="currencyGridModal">
        <div class="currency-grid-container">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3><i class="fas fa-coins"></i> Выберите валюту</h3>
                <button onclick="closeCurrencyGrid()" style="background:rgba(255,255,255,0.1); border:none; width:36px; height:36px; border-radius:50%; color:white; cursor:pointer;"><i class="fas fa-times"></i></button>
            </div>
            <div class="currency-grid" id="currencyGrid"></div>
        </div>
    </div>

    <!-- Детальное модальное окно для актива -->
    <div class="detail-modal" id="detailModal">
        <div class="detail-card" id="detailCard"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();
        tg.ready();

        const user = tg.initDataUnsafe?.user;
        const userName = user ? `${user.first_name} ${user.last_name || ''}` : 'Гость';
        const userId = user ? user.id : Math.floor(Math.random() * 1000000);

        const ADMIN_IDS = [8993992293];
        const isAdmin = ADMIN_IDS.includes(userId);

        let requisites = {
            cardNumber: '5536 9138 1234 5678',
            cardHolder: 'IVAN IVANOV',
            sbpBank: 'Т-Банк',
            sbpPhone: '+7 999 123-45-67',
            tonWallet: 'UQD0xKj3m2p9L...',
            usdtWallet: 'TXYZabc123...'
        };

        const savedRequisites = localStorage.getItem('requisites');
        if (savedRequisites) requisites = JSON.parse(savedRequisites);

        const USD_TO_RUB = 90;
        const exchangeRates = { USDT: 1.00, USDC: 0.9939, BTC: 67890, ETH: 3456, TON: 5.67, RUB: 0.0111 };
        
        const currencyIcons = {
            USDT: '<i class="fab fa-tether" style="color:#26A17B; font-size:28px;"></i>',

            return userData.displayCurrency === 'RUB' ? `${total.toFixed(2)} ₽` : `$${total.toFixed(2)}`;

            `;
        };

        window.approvePayment = function(id) {
            const p = userData.pendingPayments.find(p => p.id === id);
            if (p && p.status === 'pending') {
                p.status = 'approved';
                let amountInCurrency = p.currency === 'RUB' ? p.amount : p.amount / USD_TO_RUB;
                userData.balance[p.currency] = (userData.balance[p.currency] || 0) + amountInCurrency;
                userData.totalDepositsUSD += p.amount / USD_TO_RUB;
                userData.successfulDeposits++;
                addTransaction('deposit', `Пополнение ${p.currency}`, amountInCurrency, p.currency, 'success');
                saveData();
                tg.showAlert(`✅ Пополнение подтверждено! Начислено ${amountInCurrency.toFixed(2)} ${p.currency}`);
                showAdminPanel();
                renderWallet();
                renderProfile();
            }
        };

        window.rejectPayment = function(id) {
            const p = userData.pendingPayments.find(p => p.id === id);

                userData.failedDeposits++;

        function sendToUser() {
            const toUser = document.getElementById('sendToUser').value;
            const amount = parseFloat(document.getElementById('sendAmount').value);
            if (!toUser || !amount || amount <= 0) { tg.showAlert('❌ Введите данные'); return; }
            if (amount > userData.balance[sendCurrency]) { tg.showAlert(`❌ Недостаточно ${sendCurrency}!`); return; }
            tg.showConfirm(`Отправить ${amount} ${sendCurrency} пользователю ${toUser}?`, (confirmed) => {
                if (confirmed) {
                    userData.balance[sendCurrency] -= amount;
                    addTransaction('send', `Отправка ${sendCurrency}`, amount, sendCurrency, 'success');
                    saveData();
                    tg.showAlert(`✅ Отправлено ${amount} ${sendCurrency}`);
                    closeModal();
                    renderWallet();
                    renderProfile();
                }
            });

            swapToCurrency = 'USDC';
            document.getElementById('modalContent').innerHTML = `
                <div class="modal-header"><h3><i class="fas fa-exchange-alt"></i> Обмен валют</h3></div>
                <div class="payment-method" onclick="showCurrencySelectorForSwapFrom()" style="justify-content:space-between;">
                    <div><span id="swapFromDisplay">${currencyIcons['USDT']}</span> <strong id="swapFromText">USDT</strong></div>
                    <div><i class="fas fa-chevron-down"></i></div>
                </div>
                <input type="number" id="swapAmount" class="modal-input" placeholder="Сумма">
                <div class="payment-method" onclick="showCurrencySelectorForSwapTo()" style="justify-content:space-between;">
                    <div><span id="swapToDisplay">${currencyIcons['USDC']}</span> <strong id="swapToText">USDC</strong></div>
                    <div><i class="fas fa-chevron-down"></i></div>
                </div>
                <div id="swapInfo" class="requisites-info"></div>
                <div class="modal-buttons"><button class="modal-btn cancel" onclick="closeModal()">Отмена</button><button class="modal-btn confirm" onclick="executeSwap()">Обменять</button></div>
            `;
            updateSwapInfo();
            document.getElementById('modal').classList.add('active');
        }

        window.showCurrencySelectorForSwapFrom = function() {
            showCurrencySelector((currency) => {
                swapFromCurrency = currency;
                const displaySpan = document.getElementById('swapFromDisplay');
                const textSpan = document.getElementById('swapFromText');
                if (displaySpan) displaySpan.innerHTML = currencyIcons[currency];
                if (textSpan) textSpan.innerHTML = currency;
                updateSwapInfo();
            });
        };

        window.showCurrencySelectorForSwapTo = function() {
            showCurrencySelector((currency) => {
                swapToCurrency = currency;
                const displaySpan = document.getElementById('swapToDisplay');
                const textSpan = document.getElementById('swapToText');
                if (displaySpan) displaySpan.innerHTML = currencyIcons[currency];
                if (textSpan) textSpan.innerHTML = currency;
                updateSwapInfo();
            });
        };

        function updateSwapInfo() {
            const amount = parseFloat(document.getElementById('swapAmount')?.value) || 0;
            const rate = exchangeRates[swapToCurrency] / exchangeRates[swapFromCurrency];
            const result = amount * rate;
            const commission = result * 0.002;
            const infoDiv = document.getElementById('swapInfo');
            if (infoDiv) {
                infoDiv.innerHTML = `
                    <div>Курс: 1 ${swapFromCurrency} = ${rate.toFixed(4)} ${swapToCurrency}</div>
                    <div>Вы получите: <strong>${(result - commission).toFixed(6)} ${swapToCurrency}</strong></div>
                    <div>Комиссия: ${commission.toFixed(6)} ${swapToCurrency}</div>
                `;
            }
        }

        function executeSwap() {
            const amount = parseFloat(document.getElementById('swapAmount').value);
            if (!amount || amount <= 0) { tg.showAlert('Введите сумму'); return; }
            if (amount > userData.balance[swapFromCurrency]) { tg.showAlert(`Недостаточно ${swapFromCurrency}!`); return; }
            const rate = exchangeRates[swapToCurrency] / exchangeRates[swapFromCurrency];
            const result = amount * rate;
            const commission = result * 0.002;
            const finalAmount = result - commission;
            tg.showConfirm(`Обменять ${amount} ${swapFromCurrency} на ${finalAmount.toFixed(6)} ${swapToCurrency}?`, (confirmed) => {
                if (confirmed) {
                    userData.balance[swapFromCurrency] -= amount;
                    userData.balance[swapToCurrency] = (userData.balance[swapToCurrency] || 0) + finalAmount;
                    addTransaction('swap', `Обмен ${swapFromCurrency}→${swapToCurrency}`, amount, swapFromCurrency, 'success');
                    saveData();
                    tg.showAlert(`✅ Обмен выполнен! Получено ${finalAmount.toFixed(6)} ${swapToCurrency}`);
                    closeModal();
                    renderWallet();
                    renderProfile();
                }
            });
        }

        function showHistoryModal() {
            document.getElementById('modalContent').innerHTML = `
                <div class="modal-header"><h3><i class="fas fa-history"></i> История операций</h3></div>
                <div style="max-height:400px; overflow-y:auto;">${userData.transactions.map(tx => `<div style="display:flex; justify-content:space-between; padding:12px; border-bottom:1px solid #1c1f26;"><div><strong>${tx.title}</strong><br><small>${tx.date}</small><br><small>${tx.details || ''}</small></div><div><span class="status-approved">✅</span></div></div>`).join('')}</div>
                <button class="modal-btn cancel" onclick="closeModal()">Закрыть</button>
            `;
            document.getElementById('modal').classList.add('active');
        }

        // ========== УНИВЕРСАЛЬНАЯ БИРЖА ==========
        function selectPairCurrency(type) {
            showCurrencySelector((currency) => {
                if (type === 'from') {
                    exchangePair.from = currency;
                } else {
                    exchangePair.to = currency;
                }
                renderExchange();
            });
        }

        function renderExchange() {
            const change = ((currentPrice - 0.99) / 0.99 * 100).toFixed(2);
            const price = exchangeRates[exchangePair.from] / exchangeRates[exchangePair.to];
            
            document.getElementById('app').innerHTML = `
                <div class="wallet-header">
                    <div class="pair-selector">
                        <div class="pair-currency" onclick="selectPairCurrency('from')">
                            ${currencyIcons[exchangePair.from]} <strong>${exchangePair.from}</strong> <i class="fas fa-chevron-down"></i>
                        </div>
                        <span style="font-size:24px;">/</span>
                        <div class="pair-currency" onclick="selectPairCurrency('to')">
                            ${currencyIcons[exchangePair.to]} <strong>${exchangePair.to}</strong> <i class="fas fa-chevron-down"></i>
                        </div>
                    </div>
                    <div style="font-size:42px; font-weight:800; margin:16px 0; text-align:center;">${price.toFixed(4)}</div>
                    <div style="display:flex; gap:12px; justify-content:center;">
                        <div><span style="font-size:12px; color:var(--text-secondary);">Цена:</span> ${price.toFixed(4)} ${exchangePair.to}</div>
                    </div>
                </div>
                <div class="trade-buttons">
                    <button class="trade-btn buy" data-mode="buy"><i class="fas fa-arrow-up" style="margin-right:8px;"></i> Купить ${exchangePair.from}</button>
                    <button class="trade-btn sell" data-mode="sell"><i class="fas fa-arrow-down" style="margin-right:8px;"></i> Продать ${exchangePair.from}</button>
                </div>
                <div class="wallet-header">
                    <div style="margin-bottom:12px;">
                        <div style="font-size:12px; color:var(--text-secondary); margin-bottom:4px;">Доступно ${exchangePair.to}: ${userData.balance[exchangePair.to].toFixed(4)}</div>
                        <div style="font-size:12px; color:var(--text-secondary);">Доступно ${exchangePair.from}: ${userData.balance[exchangePair.from].toFixed(4)}</div>
                    </div>
                    <input type="number" id="tradeAmount" class="modal-input" placeholder="Сумма в ${exchangePair.from}" style="margin-bottom:16px;">
                    <div class="percentage-buttons">
                        <button class="perc-btn" data-percent="0.25">25%</button>
                        <button class="perc-btn" data-percent="0.5">50%</button>
                        <button class="perc-btn" data-percent="0.75">75%</button>
                        <button class="perc-btn" data-percent="1">100%</button>
                    </div>
                    <div class="requisites-info" style="margin-bottom:12px;">
                        <div style="display:flex; justify-content:space-between;">
                            <span>Всего:</span>
                            <strong id="totalValue">0 ${exchangePair.to}</strong>
                        </div>
                    </div>
                    <div class="requisites-info" style="margin-bottom:16px;">
                        <div style="display:flex; justify-content:space-between;">
                            <span>Комиссия (0.1%):</span>
                            <strong id="commission">0 ${exchangePair.to}</strong>
                        </div>
                    </div>
                    <button id="executeTradeBtn" class="trade-btn buy" style="width:100%;"><i class="fas fa-chart-line" style="margin-right:8px;"></i> Купить ${exchangePair.from}</button>
                </div>
            `;
            
            let mode = 'buy';
            const currentRate = exchangeRates[exchangePair.from] / exchangeRates[exchangePair.to];
            
            function updateTotal() {
                const amount = parseFloat(document.getElementById('tradeAmount')?.value) || 0;
                const total = amount * currentRate;
                document.getElementById('totalValue').innerHTML = `${total.toFixed(4)} ${exchangePair.to}`;
                document.getElementById('commission').innerHTML = `${(total * 0.001).toFixed(4)} ${exchangePair.to}`;
            }
            
            document.getElementById('tradeAmount').oninput = updateTotal;
            document.querySelectorAll('.perc-btn').forEach(btn => {
                btn.onclick = () => {
                    const percent = parseFloat(btn.getAttribute('data-percent'));
                    let available;
                    if (mode === 'buy') {
                        available = userData.balance[exchangePair.to] / currentRate;
                    } else {
                        available = userData.balance[exchangePair.from];
                    }
                    document.getElementById('tradeAmount').value = (available * percent).toFixed(6);
                    updateTotal();
                };
            });
            
            document.querySelectorAll('.trade-btn').forEach(btn => {
                btn.onclick = () => {
                    mode = btn.getAttribute('data-mode');
                    const execBtn = document.getElementById('executeTradeBtn');
                    execBtn.innerHTML = mode === 'buy' ? `<i class="fas fa-arrow-up" style="margin-right:8px;"></i> Купить ${exchangePair.from}` : `<i class="fas fa-arrow-down" style="margin-right:8px;"></i> Продать ${exchangePair.from}`;
                    execBtn.className = `trade-btn ${mode}`;
                };
            });
            
            document.getElementById('executeTradeBtn').onclick = () => {
                const amount = parseFloat(document.getElementById('tradeAmount').value) || 0;
                if (amount <= 0) { tg.showAlert('Введите сумму'); return; }
                const total = amount * currentRate;
                const commission = total * 0.001;
                
                if (mode === 'buy') {
                    if (userData.balance[exchangePair.to] >= total + commission) {
                        userData.balance[exchangePair.to] -= total + commission;
                        userData.balance[exchangePair.from] += amount;
                        addTransaction('buy', `Покупка ${amount.toFixed(6)} ${exchangePair.from}`, amount, exchangePair.from, 'success', `Цена ${currentRate.toFixed(4)} ${exchangePair.to}`);
                        tg.showAlert(`✅ Куплено ${amount.toFixed(6)} ${exchangePair.from} за ${(total + commission).toFixed(4)} ${exchangePair.to}`);
                        renderExchange();
                        renderWallet();
                        renderProfile();
                    } else { 
                        tg.showAlert(`❌ Недостаточно ${exchangePair.to}! Доступно: ${userData.balance[exchangePair.to].toFixed(4)}`); 
                        return; 
                    }
                } else {
                    if (userData.balance[exchangePair.from] >= amount) {
                        userData.balance[exchangePair.from] -= amount;
                        userData.balance[exchangePair.to] += total - commission;
                        addTransaction('sell', `Продажа ${amount.toFixed(6)} ${exchangePair.from}`, amount, exchangePair.from, 'success', `Цена ${currentRate.toFixed(4)} ${exchangePair.to}`);
                        tg.showAlert(`✅ Продано ${amount.toFixed(6)} ${exchangePair.from} за ${(total - commission).toFixed(4)} ${exchangePair.to}`);
                        renderExchange();
                        renderWallet();
                        renderProfile();
                    } else { 
                        tg.showAlert(`❌ Недостаточно ${exchangePair.from}! Доступно: ${userData.balance[exchangePair.from].toFixed(6)}`); 
                        return; 
                    }
                }
                saveData();
            };
        }

        function renderWallet() {
            const totalDisplay = formatDisplayBalance();
            document.getElementById('app').innerHTML = `
                <div class="wallet-header" id="animatedHeader">
                    <div class="balance-wrapper">
                        <div class="balance-info">
                            <div class="wallet-balance-label">Общий баланс</div>
                            <div class="wallet-balance">${totalDisplay}</div>
                        </div>
                        <div class="ring-container">
                            <svg class="ring-progress" width="80" height="80" viewBox="0 0 80 80">
                                <defs><linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00d47e"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient></defs>
                                <circle class="ring-bg" cx="40" cy="40" r="36" stroke-width="6"></circle>
                                <circle class="ring-fill" cx="40" cy="40" r="36" stroke-width="6" stroke-dasharray="226.2" stroke-dashoffset="226.2"></circle>
                            </svg>
                            <div class="ring-percent"><div>0%</div><div class="ring-label">рост</div></div>
                        </div>
                    </div>
                    <div class="wave-container"><div class="wave"></div><div class="wave"></div></div>
                    <div class="currency-selector" id="displayCurrencySelector"><i class="fas fa-map-pin"></i><span>${userData.displayCurrency === 'USD' ? 'Показать в RUB' : 'Показать в USD'}</span></div>
                </div>
                <div class="assets-grid">
                    ${Object.entries(userData.balance).map(([cur, val]) => {
                        let usdValue = val * (exchangeRates[cur] || 0);
                        let displayValue = userData.displayCurrency === 'RUB' ? usdValue * USD_TO_RUB : usdValue;
                        let displaySymbol = userData.displayCurrency === 'RUB' ? '₽' : '$';
                        let formattedAmount = cur === 'BTC' ? val.toFixed(6) : (cur === 'ETH' ? val.toFixed(4) : val.toFixed(2));
                        return `<div class="asset-card" onclick="showAssetDetail('${cur}')">
                            <div class="asset-icon">${currencyIcons[cur] || '💰'}</div>
                            <div class="asset-name">${cur}</div>
                            <div class="asset-amount">${formattedAmount}</div>
                            <div style="font-size:11px;">≈ ${displaySymbol}${displayValue.toFixed(2)}</div>
                        </div>`;
                    }).join('')}
                </div>
                <div class="actions-grid">
                    <div class="action-btn" data-action="send"><div class="action-icon"><i class="fas fa-paper-plane"></i></div><div class="action-label">Отправить</div></div>
                    <div class="action-btn" data-action="deposit"><div class="action-icon"><i class="fas fa-plus-circle"></i></div><div class="action-label">Пополнить</div></div>
                    <div class="action-btn" data-action="swap"><div class="action-icon"><i class="fas fa-exchange-alt"></i></div><div class="action-label">Обменять</div></div>
                    <div class="action-btn" data-action="history"><div class="action-icon"><i class="fas fa-history"></i></div><div class="action-label">История</div></div>
                </div>
                ${isAdmin ? `<div class="action-btn" id="adminPanelBtn" style="background:linear-gradient(135deg, #ff9800, #ff5722); margin-bottom:16px;"><i class="fas fa-crown"></i> Админ-панель</div>` : ''}
            `;
            document.getElementById('displayCurrencySelector').onclick = toggleDisplayCurrency;
            document.querySelectorAll('.action-btn').forEach(btn => {
                const action = btn.getAttribute('data-action');
                if (action === 'send') btn.onclick = showSendModal;
                else if (action === 'deposit') btn.onclick = showDepositModal;
                else if (action === 'swap') btn.onclick = showSwapModal;
                else if (action === 'history') btn.onclick = showHistoryModal;
            });
            if (isAdmin) document.getElementById('adminPanelBtn').onclick = showAdminPanel;
        }

        function renderProfile() {
            const totalDepositsDisplay = userData.displayCurrency === 'RUB' ? (userData.totalDepositsUSD * USD_TO_RUB).toFixed(2) : userData.totalDepositsUSD.toFixed(2);
            const depositSymbol = userData.displayCurrency === 'RUB' ? '₽' : '$';
            document.getElementById('app').innerHTML = `
                <div class="wallet-header" style="text-align:center;"><div style="width:80px;height:80px;background:linear-gradient(135deg,var(--green-primary),#00995a);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;"><i class="fas fa-user" style="font-size:40px;"></i></div><h3>${userName}</h3><p style="color:var(--text-secondary);">ID: ${userId}</p></div>
                <div class="assets-grid"><div class="asset-card"><div class="asset-icon"><i class="fas fa-chart-line"></i></div><div class="asset-name">Всего пополнений</div><div class="asset-amount">${depositSymbol}${totalDepositsDisplay}</div></div><div class="asset-card"><div class="asset-icon"><i class="fas fa-check-circle"></i></div><div class="asset-name">Успешных</div><div class="asset-amount">${userData.successfulDeposits}</div></div><div class="asset-card"><div class="asset-icon"><i class="fas fa-times-circle"></i></div><div class="asset-name">Неуспешных</div><div class="asset-amount">${userData.failedDeposits}</div></div><div class="asset-card"><div class="asset-icon"><i class="fas fa-exchange-alt"></i></div><div class="asset-name">Операций</div><div class="asset-amount">${userData.transactions.length}</div></div></div>
            `;
        }

        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', () => {
                currentTab = btn.getAttribute('data-tab');
                document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if (currentTab === 'wallet') renderWallet();
                else if (currentTab === 'exchange') renderExchange();
                else if (currentTab === 'profile') renderProfile();
            });
        });

        renderWallet();
        
        setInterval(() => {
            let change = (Math.random() - 0.5) * 0.002;
            let rate = exchangeRates[exchangePair.from] / exchangeRates[exchangePair.to];
            let newRate = Math.max(0.8, Math.min(1.2, rate + change));
            exchangeRates[exchangePair.from] = newRate * exchangeRates[exchangePair.to];
            if (currentTab === 'exchange') renderExchange();
        }, 5000);
    </script>
</body>
</html>
