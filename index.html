<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Crypto Bot - Анимированная биржа</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-dark: #0a0a0c;
            --bg-card: rgba(19, 21, 26, 0.9);
            --green-primary: #00d47e;
            --green-glow: rgba(0, 212, 126, 0.3);
            --red: #ff4757;
            --blue: #3b82f6;
            --orange: #ff9800;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --border: rgba(28, 31, 38, 0.8);
        }

        body {
            background: var(--bg-dark);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, var(--green-primary), transparent);
            border-radius: 50%;
            opacity: 0;
            animation: floatParticle 8s infinite;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-100vh) scale(1); opacity: 0; }
        }

        .content {
            padding: 20px;
            padding-bottom: 85px;
            position: relative;
            z-index: 1;
        }

        .fade-enter {
            animation: fadeSlideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .wallet-header {
            background: linear-gradient(135deg, rgba(0, 212, 126, 0.15), rgba(59, 130, 246, 0.1));
            border-radius: 40px;
            padding: 28px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 212, 126, 0.3);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .wallet-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, var(--green-glow) 0%, transparent 70%);
            animation: rotateGlow 8s linear infinite;
        }

        @keyframes rotateGlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .wallet-balance-label {
            font-size: 14px;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }

        .wallet-balance {
            font-size: 52px;
            font-weight: 800;
            margin: 12px 0;
            background: linear-gradient(135deg, #fff, var(--green-primary), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .currency-selector {
            background: rgba(10, 10, 12, 0.8);
            border: 1px solid rgba(0, 212, 126, 0.3);
            border-radius: 50px;
            padding: 10px 20px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .currency-selector:hover {
            border-color: var(--green-primary);
            transform: scale(1.02);
            box-shadow: 0 0 20px var(--green-glow);
        }

        .assets-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .asset-card {
            background: rgba(19, 21, 26, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 16px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            animation: fadeSlideUp 0.4s ease backwards;
        }

        .asset-card:hover {
            transform: translateY(-3px);
            border-color: var(--green-primary);
        }

        .asset-icon {
            font-size: 28px;
            margin-bottom: 8px;
            display: inline-block;
        }

        .asset-name {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .asset-amount {
            font-size: 20px;
            font-weight: 700;
            margin-top: 8px;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .action-btn {
            background: rgba(19, 21, 26, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(0, 212, 126, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
        }

        .action-btn:active::before {
            width: 200px;
            height: 200px;
        }

        .action-btn:active {
            transform: scale(0.96);
        }

        .action-icon {
            font-size: 24px;
            margin-bottom: 6px;
            display: inline-block;
            transition: transform 0.2s ease;
        }

        .action-btn:hover .action-icon {
            transform: translateY(-3px) scale(1.1);
        }

        .action-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .price-card {
            background: linear-gradient(135deg, var(--bg-card), rgba(13, 15, 20, 0.9));
            border-radius: 32px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 212, 126, 0.2);
            backdrop-filter: blur(10px);
        }

        .price-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-pair {
            font-size: 20px;
            font-weight: 700;
        }

        .price-change {
            font-size: 14px;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .price-change.up { background: rgba(0, 212, 126, 0.15); color: var(--green-primary); }
        .price-change.down { background: rgba(255, 71, 87, 0.15); color: var(--red); }

        .price-main {
            font-size: 42px;
            font-weight: 800;
            margin: 16px 0;
        }

        .trade-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .trade-btn {
            flex: 1;
            padding: 16px;
            border-radius: 28px;
            border: none;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .trade-btn.buy { background: linear-gradient(135deg, var(--green-primary), #00995a); color: white; }
        .trade-btn.sell { background: linear-gradient(135deg, var(--red), #cc3b4a); color: white; }
        .trade-btn:active { transform: scale(0.96); }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 17, 21, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 20px calc(12px + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid var(--border);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 11px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 8px 24px;
            border-radius: 40px;
            background: transparent;
            border: none;
        }

        .nav-item i {
            font-size: 24px;
            transition: all 0.3s ease;
        }

        .nav-item:hover i {
            transform: translateY(-3px);
        }

        .nav-item.active {
            color: var(--green-primary);
        }

        .nav-item.active i {
            transform: translateY(-2px);
            text-shadow: 0 0 10px var(--green-glow);
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 3px;
            background: var(--green-primary);
            border-radius: 3px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { width: 0; opacity: 0; }
            to { width: 30px; opacity: 1; }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(16px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-content {
            background: linear-gradient(135deg, #13151a, #0d0f14);
            border-radius: 48px;
            padding: 28px;
            width: 100%;
            max-width: 380px;
            border: 1px solid rgba(0, 212, 126, 0.3);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
        }

        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-content h3 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 24px;
        }

        .modal-input {
            width: 100%;
            padding: 16px;
            background: rgba(10, 10, 12, 0.8);
            border: 1px solid var(--border);
            border-radius: 24px;
            color: white;
            font-size: 16px;
            margin-bottom: 16px;
            transition: all 0.2s ease;
        }

        .modal-input:focus {
            outline: none;
            border-color: var(--green-primary);
            transform: scale(1.01);
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .modal-btn {
            flex: 1;
            padding: 16px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-btn.confirm {
            background: linear-gradient(135deg, var(--green-primary), #00995a);
            color: white;
        }

        .modal-btn.cancel {
            background: rgba(28, 31, 38, 0.8);
            color: var(--text-secondary);
        }

        .modal-btn:active {
            transform: scale(0.96);
        }

        .dropzone {
            border: 2px dashed var(--border);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 16px 0;
        }

        .dropzone:hover {
            border-color: var(--green-primary);
            background: rgba(0, 212, 126, 0.05);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
        }
        .status-pending { background: var(--orange); color: #000; }
        .status-approved { background: var(--green-primary); color: #000; }
        .status-rejected { background: var(--red); color: #fff; }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
        }

        .transactions-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .transaction-item {
            background: rgba(19, 21, 26, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }

        .transaction-item:hover {
            border-color: var(--green-primary);
            transform: translateX(4px);
        }

        .transaction-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .transaction-icon {
            width: 44px;
            height: 44px;
            background: var(--bg-dark);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .address-text {
            background: rgba(10, 10, 12, 0.8);
            padding: 14px;
            border-radius: 20px;
            font-size: 13px;
            word-break: break-all;
            margin: 12px 0;
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="content" id="app"></div>

    <div class="bottom-nav">
        <button class="nav-item active" data-tab="wallet"><i class="fas fa-wallet"></i><span>Кошелёк</span></button>
        <button class="nav-item" data-tab="exchange"><i class="fas fa-chart-line"></i><span>Биржа</span></button>
        <button class="nav-item" data-tab="profile"><i class="fas fa-user"></i><span>Профиль</span></button>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <div class="currency-grid-modal" id="currencyGridModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.95); backdrop-filter:blur(20px); z-index:3000; align-items:center; justify-content:center; padding:20px;">
        <div style="background:linear-gradient(135deg,#13151a,#0d0f14); border-radius:48px; padding:24px; max-width:450px; width:100%; border:1px solid rgba(0,212,126,0.3);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3><i class="fas fa-coins"></i> Выберите валюту</h3>
                <button onclick="closeCurrencyGrid()" style="background:rgba(255,255,255,0.1); border:none; width:36px; height:36px; border-radius:50%; color:white; cursor:pointer;"><i class="fas fa-times"></i></button>
            </div>
            <div class="currency-grid" id="currencyGrid" style="display:grid; grid-template-columns:repeat(3,1fr); gap:12px;"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();
        tg.ready();

        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.width = p.style.height = Math.random() * 5 + 2 + 'px';
                p.style.animationDelay = Math.random() * 8 + 's';
                p.style.animationDuration = Math.random() * 6 + 4 + 's';
                container.appendChild(p);
            }
        }
        createParticles();

        const user = tg.initDataUnsafe?.user;
        const userName = user ? `${user.first_name} ${user.last_name || ''}` : 'Гость';
        const userId = user ? user.id : Math.floor(Math.random() * 1000000);

        // ========== НАСТРОЙКИ АДМИНИСТРАТОРА ==========
		// Укажите здесь свои Telegram ID (можно несколько через запятую)
		const ADMIN_IDS = [8993992293];  // ВСТАВЬТЕ СВОЙ ID ВМЕСТО 123456789

		const isAdmin = ADMIN_IDS.includes(userId) || localStorage.getItem('isAdminMode') === 'true';

        // Курс USD к RUB
        const USD_TO_RUB = 90;
        
        // Курсы валют в USD
        const exchangeRates = { USDT: 1.00, USDC: 0.9939, BTC: 67890, ETH: 3456, TON: 5.67, RUB: 0.0111 };
        
        // Красивые иконки (Font Awesome, не эмодзи)
        const currencyIcons = {
            USDT: '<i class="fab fa-tether" style="color:#26A17B; font-size:28px;"></i>',
            USDC: '<i class="fas fa-dollar-sign" style="color:#2775CA; font-size:28px;"></i>',
            BTC: '<i class="fab fa-bitcoin" style="color:#F7931A; font-size:28px;"></i>',
            ETH: '<i class="fab fa-ethereum" style="color:#627EEA; font-size:28px;"></i>',
            TON: '<i class="fab fa-telegram" style="color:#0098EA; font-size:28px;"></i>',
            RUB: '<i class="fas fa-ruble-sign" style="color:#00d47e; font-size:28px;"></i>'
        };

        // Данные пользователя с RUB
        let userData = {
            balance: { USDT: 1250.50, USDC: 0, BTC: 0.0015, ETH: 0.05, TON: 100, RUB: 0 },
            displayCurrency: 'USD', // 'USD' или 'RUB'
            transactions: [],
            pendingPayments: [],
            totalDepositsUSD: 1250.50,
            successfulDeposits: 3,
            failedDeposits: 0
        };

        let currentTab = 'wallet';
        let currentPair = { from: 'USDC', to: 'USDT' };
        let currentPrice = 0.9939;

        function saveData() { localStorage.setItem('cryptoUserData', JSON.stringify(userData)); }
        function closeModal() { document.getElementById('modal').classList.remove('active'); }
        function closeCurrencyGrid() { document.getElementById('currencyGridModal').style.display = 'none'; }

        // Получение общего баланса в выбранной валюте отображения
        function getTotalBalanceInDisplayCurrency() {
            let totalUSD = 0;
            for (const [cur, val] of Object.entries(userData.balance)) {
                totalUSD += val * (exchangeRates[cur] || 0);
            }
            if (userData.displayCurrency === 'RUB') {
                return totalUSD * USD_TO_RUB;
            }
            return totalUSD;
        }

        function formatDisplayBalance() {
            const total = getTotalBalanceInDisplayCurrency();
            if (userData.displayCurrency === 'RUB') {
                return `${total.toFixed(2)} ₽`;
            }
            return `$${total.toFixed(2)}`;
        }

        function addTransaction(type, title, amount, currency, status = 'success', details = '') {
            userData.transactions.unshift({ 
                id: Date.now(), type, title, amount, currency, status, details, 
                date: new Date().toLocaleString() 
            });
            if (userData.transactions.length > 50) userData.transactions.pop();
            saveData();
        }

        // Переключение валюты отображения
        function toggleDisplayCurrency() {
            userData.displayCurrency = userData.displayCurrency === 'USD' ? 'RUB' : 'USD';
            saveData();
            renderWallet();
            tg.showAlert(`Баланс отображается в ${userData.displayCurrency === 'USD' ? 'USD' : 'RUB'}`);
        }

        // ========== ВЫБОР ВАЛЮТЫ ==========
        function showCurrencyGrid() {
            const grid = document.getElementById('currencyGrid');
            const currencies = Object.keys(exchangeRates);
            grid.innerHTML = currencies.map(curr => `
                <div class="currency-item" data-currency="${curr}" style="background:rgba(10,10,12,0.6); border:1px solid var(--border); border-radius:20px; padding:14px; text-align:center; cursor:pointer; transition:all 0.2s;">
                    <div style="font-size:32px;">${currencyIcons[curr] || '💰'}</div>
                    <div style="font-weight:600; margin-top:4px;">${curr}</div>
                    <div style="font-size:11px; color:var(--text-secondary);">${curr === 'RUB' ? `${USD_TO_RUB} ₽/USD` : `$${exchangeRates[curr]}`}</div>
                </div>
            `).join('');
            document.querySelectorAll('.currency-item').forEach(card => {
                card.onclick = () => {
                    closeCurrencyGrid();
                    renderWallet();
                    tg.showAlert(`Валюта выбрана`);
                };
            });
            document.getElementById('currencyGridModal').style.display = 'flex';
        }

        // ========== ОТПРАВКА ==========
        function showSendModal() {
            document.getElementById('modalContent').innerHTML = `
                <h3><i class="fas fa-paper-plane"></i> Отправить</h3>
                <select id="sendCurrency" class="modal-input" style="background:rgba(10,10,12,0.8); border:1px solid var(--border); border-radius:24px; padding:16px; color:white;">
                    ${Object.keys(userData.balance).map(c => `<option value="${c}">${c} (${userData.balance[c].toFixed(4)})</option>`).join('')}
                </select>
                <input type="text" id="sendToUser" class="modal-input" placeholder="👤 ID получателя или @username">
                <input type="number" id="sendAmount" class="modal-input" placeholder="💸 Сумма">
                <div class="modal-buttons">
                    <button class="modal-btn cancel" onclick="closeModal()">Отмена</button>
                    <button class="modal-btn confirm" onclick="sendToUser()">Отправить</button>
                </div>
            `;
            document.getElementById('modal').classList.add('active');
        }

        function sendToUser() {
            const currency = document.getElementById('sendCurrency').value;
            const toUser = document.getElementById('sendToUser').value;
            const amount = parseFloat(document.getElementById('sendAmount').value);
            if (!toUser || !amount || amount <= 0) { tg.showAlert('❌ Введите данные'); return; }
            if (amount > userData.balance[currency]) { tg.showAlert(`❌ Недостаточно ${currency}!`); return; }
            tg.showConfirm(`Отправить ${amount} ${currency} пользователю ${toUser}?`, (confirmed) => {
                if (confirmed) {
                    userData.balance[currency] -= amount;
                    addTransaction('send', `Отправка ${currency}`, amount, currency, 'success', `Пользователю: ${toUser}`);
                    saveData();
                    tg.showAlert(`✅ Отправлено ${amount} ${currency}`);
                    closeModal();
                    renderWallet();
                    renderProfile();
                }
            });
        }

        // ========== ПОПОЛНЕНИЕ ==========
        function showDepositModal() {
            document.getElementById('modalContent').innerHTML = `
                <h3><i class="fas fa-plus-circle"></i> Пополнение</h3>
                <select id="depositCurrency" class="modal-input">
                    <option value="USDT">USDT</option><option value="USDC">USDC</option>
                    <option value="BTC">BTC</option><option value="ETH">ETH</option>
                    <option value="TON">TON</option><option value="RUB">RUB</option>
                </select>
                <input type="number" id="depositAmount" class="modal-input" placeholder="Сумма в USD">
                <div class="dropzone" id="dropzone" style="border:2px dashed var(--border); border-radius:24px; padding:25px; text-align:center; cursor:pointer;">
                    <i class="fas fa-cloud-upload-alt" style="font-size:36px;"></i>
                    <p>Нажмите для загрузки чека</p>
                    <input type="file" id="screenshotInput" accept="image/*" style="display:none;">
                </div>
                <div id="screenshotPreview"></div>
                <div class="modal-buttons">
                    <button class="modal-btn cancel" onclick="closeModal()">Отмена</button>
                    <button class="modal-btn confirm" onclick="submitDeposit()">Отправить</button>
                </div>
            `;
            const dropzone = document.getElementById('dropzone');
            const fileInput = document.getElementById('screenshotInput');
            dropzone.onclick = () => fileInput.click();
            fileInput.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        document.getElementById('screenshotPreview').innerHTML = `<div style="margin-top:12px; text-align:center;"><img src="${ev.target.result}" style="max-width:100%; border-radius:16px;"><p style="color:var(--green-primary); margin-top:8px;">✅ Чек загружен</p></div>`;
                        dropzone.style.display = 'none';
                    };
                    reader.readAsDataURL(file);
                }
            };
            document.getElementById('modal').classList.add('active');
        }

        function submitDeposit() {
            const currency = document.getElementById('depositCurrency').value;
            const amount = parseFloat(document.getElementById('depositAmount').value);
            if (!amount || amount < 10) { tg.showAlert('❌ Введите сумму от 10 USD'); return; }
            
            let depositAmountInCurrency = amount;
            if (currency === 'RUB') {
                depositAmountInCurrency = amount * USD_TO_RUB;
            }
            
            userData.balance[currency] = (userData.balance[currency] || 0) + depositAmountInCurrency;
            userData.totalDepositsUSD += amount;
            userData.successfulDeposits++;
            addTransaction('deposit', `Пополнение ${currency}`, depositAmountInCurrency, currency, 'success', `Сумма: ${amount} USD`);
            saveData();
            tg.showAlert(`✅ Баланс пополнен на ${depositAmountInCurrency} ${currency}`);
            closeModal();
            renderWallet();
            renderProfile();
        }

        // ========== ОБМЕН ==========
        function showSwapModal() {
            document.getElementById('modalContent').innerHTML = `
                <h3><i class="fas fa-exchange-alt"></i> Обмен</h3>
                <select id="swapFrom" class="modal-input">${Object.keys(userData.balance).map(c => `<option value="${c}">${c} (${userData.balance[c].toFixed(4)})</option>`).join('')}</select>
                <input type="number" id="swapAmount" class="modal-input" placeholder="Сумма">
                <select id="swapTo" class="modal-input">
                    <option value="USDT">USDT</option><option value="USDC">USDC</option>
                    <option value="BTC">BTC</option><option value="ETH">ETH</option>
                    <option value="TON">TON</option><option value="RUB">RUB</option>
                </select>
                <div id="swapInfo" style="background:rgba(10,10,12,0.8); border-radius:20px; padding:16px; margin:12px 0;"></div>
                <div class="modal-buttons">
                    <button class="modal-btn cancel" onclick="closeModal()">Отмена</button>
                    <button class="modal-btn confirm" onclick="executeSwap()">Обменять</button>
                </div>
            `;
            function updateSwap() {
                const from = document.getElementById('swapFrom').value;
                const to = document.getElementById('swapTo').value;
                const amount = parseFloat(document.getElementById('swapAmount').value) || 0;
                const rate = exchangeRates[to] / exchangeRates[from];
                const result = amount * rate;
                const commission = result * 0.002;
                document.getElementById('swapInfo').innerHTML = `
                    <div style="display:flex; justify-content:space-between;"><span>Курс</span><span>1 ${from} = ${rate.toFixed(4)} ${to}</span></div>
                    <div style="display:flex; justify-content:space-between; margin-top:8px;"><span>Вы получите</span><span style="color:var(--green-primary);">${(result - commission).toFixed(6)} ${to}</span></div>
                    <div style="display:flex; justify-content:space-between;"><span>Комиссия (0.2%)</span><span>${commission.toFixed(6)} ${to}</span></div>
                `;
            }
            document.getElementById('swapFrom').onchange = updateSwap;
            document.getElementById('swapTo').onchange = updateSwap;
            document.getElementById('swapAmount').oninput = updateSwap;
            updateSwap();
            document.getElementById('modal').classList.add('active');
        }

        function executeSwap() {
            const from = document.getElementById('swapFrom').value;
            const to = document.getElementById('swapTo').value;
            const amount = parseFloat(document.getElementById('swapAmount').value);
            if (!amount || amount <= 0) { tg.showAlert('Введите сумму'); return; }
            if (amount > userData.balance[from]) { tg.showAlert(`Недостаточно ${from}!`); return; }
            const rate = exchangeRates[to] / exchangeRates[from];
            const result = amount * rate;
            const commission = result * 0.002;
            const finalAmount = result - commission;
            tg.showConfirm(`Обменять ${amount} ${from} на ${finalAmount.toFixed(6)} ${to}?`, (confirmed) => {
                if (confirmed) {
                    userData.balance[from] -= amount;
                    userData.balance[to] = (userData.balance[to] || 0) + finalAmount;
                    addTransaction('swap', `Обмен ${from}→${to}`, amount, from, 'success', `Получено ${finalAmount.toFixed(6)} ${to}`);
                    saveData();
                    tg.showAlert(`✅ Обмен выполнен! Получено ${finalAmount.toFixed(6)} ${to}`);
                    closeModal();
                    renderWallet();
                }
            });
        }

        function showHistoryModal() {
            document.getElementById('modalContent').innerHTML = `
                <h3><i class="fas fa-history"></i> История</h3>
                <div style="max-height:400px; overflow-y:auto;">
                    ${userData.transactions.map(tx => `<div style="display:flex; justify-content:space-between; padding:12px; border-bottom:1px solid var(--border);"><div><strong>${tx.title}</strong><br><small>${tx.date}</small><br><small>${tx.details || ''}</small></div><div><span class="status-badge ${tx.status === 'success' ? 'status-approved' : 'status-pending'}">${tx.status === 'success' ? '✅' : '⏳'}</span></div></div>`).join('')}
                </div>
                <button class="modal-btn cancel" onclick="closeModal()">Закрыть</button>
            `;
            document.getElementById('modal').classList.add('active');
        }

        // ========== БИРЖА ==========
        function renderExchange() {
            const change = ((currentPrice - 0.99) / 0.99 * 100).toFixed(2);
            document.getElementById('app').innerHTML = `
                <div class="price-card fade-enter">
                    <div class="price-header"><span class="price-pair">${currentPair.from} / ${currentPair.to}</span><span class="price-change ${change >= 0 ? 'up' : 'down'}">${change >= 0 ? `+${change}%` : `${change}%`}</span></div>
                    <div class="price-main">${currentPrice.toFixed(4)}</div>
                    <div class="price-stats" style="display:flex; gap:20px; margin-top:16px;"><div><div style="font-size:11px; color:var(--text-secondary);">Объём 24ч</div><div>22,051 USDT</div></div></div>
                </div>
                <div class="trade-buttons"><button class="trade-btn buy" data-mode="buy">📈 Купить</button><button class="trade-btn sell" data-mode="sell">📉 Продать</button></div>
                <div class="price-card" style="padding:20px;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:12px;"><span>Цена</span><span>${currentPrice.toFixed(4)} USDT</span></div>
                    <input type="number" id="tradeAmount" class="modal-input" placeholder="Сумма в ${currentPair.from}" style="margin-bottom:12px;">
                    <div class="percentage-buttons" style="display:flex; gap:8px; margin-bottom:16px;">
                        <button class="perc-btn" data-percent="0.25" style="flex:1; padding:10px; background:rgba(10,10,12,0.8); border:1px solid var(--border); border-radius:16px;">25%</button>
                        <button class="perc-btn" data-percent="0.5" style="flex:1; padding:10px; background:rgba(10,10,12,0.8); border:1px solid var(--border); border-radius:16px;">50%</button>
                        <button class="perc-btn" data-percent="0.75" style="flex:1; padding:10px; background:rgba(10,10,12,0.8); border:1px solid var(--border); border-radius:16px;">75%</button>
                        <button class="perc-btn" data-percent="1" style="flex:1; padding:10px; background:rgba(10,10,12,0.8); border:1px solid var(--border); border-radius:16px;">100%</button>
                    </div>
                    <div class="total-info" style="background:rgba(10,10,12,0.6); border-radius:16px; padding:12px; margin-bottom:12px;"><span>Всего</span><span id="totalValue">0 USDT</span></div>
                    <div class="total-info" style="background:rgba(10,10,12,0.6); border-radius:16px; padding:12px;"><span>Комиссия (0.1%)</span><span id="commission">0 USDT</span></div>
                    <button id="executeTradeBtn" class="trade-btn buy" style="margin-top:20px; width:100%;">Купить ${currentPair.from}</button>
                </div>
            `;
            let mode = 'buy';
            function updateTotal() {
                const amount = parseFloat(document.getElementById('tradeAmount')?.value) || 0;
                const total = amount * currentPrice;
                document.getElementById('totalValue').innerHTML = `${total.toFixed(2)} USDT`;
                document.getElementById('commission').innerHTML = `${(total * 0.001).toFixed(4)} USDT`;
            }
            document.getElementById('tradeAmount').oninput = updateTotal;
            document.querySelectorAll('.perc-btn').forEach(btn => {
                btn.onclick = () => {
                    const percent = parseFloat(btn.getAttribute('data-percent'));
                    const available = mode === 'buy' ? userData.balance.USDT / currentPrice : userData.balance[currentPair.from];
                    document.getElementById('tradeAmount').value = (available * percent).toFixed(4);
                    updateTotal();
                };
            });
            document.querySelectorAll('.trade-btn').forEach(btn => {
                btn.onclick = () => {
                    mode = btn.getAttribute('data-mode');
                    const execBtn = document.getElementById('executeTradeBtn');
                    execBtn.textContent = mode === 'buy' ? `Купить ${currentPair.from}` : `Продать ${currentPair.from}`;
                    execBtn.className = `trade-btn ${mode}`;
                };
            });
            document.getElementById('executeTradeBtn').onclick = () => {
                const amount = parseFloat(document.getElementById('tradeAmount').value) || 0;
                if (amount <= 0) { tg.showAlert('Введите сумму'); return; }
                const total = amount * currentPrice;
                const commission = total * 0.001;
                if (mode === 'buy') {
                    if (userData.balance.USDT >= total + commission) {
                        userData.balance.USDT -= total + commission;
                        userData.balance[currentPair.from] += amount;
                        addTransaction('buy', `Покупка ${currentPair.from}`, amount, currentPair.from, 'success', `Цена ${currentPrice} USDT`);
                        tg.showAlert(`✅ Куплено ${amount.toFixed(4)} ${currentPair.from}`);
                    } else { tg.showAlert(`❌ Недостаточно USDT!`); return; }
                } else {
                    if (userData.balance[currentPair.from] >= amount) {
                        userData.balance[currentPair.from] -= amount;
                        userData.balance.USDT += total - commission;
                        addTransaction('sell', `Продажа ${currentPair.from}`, amount, currentPair.from, 'success', `Цена ${currentPrice} USDT`);
                        tg.showAlert(`✅ Продано ${amount.toFixed(4)} ${currentPair.from}`);
                    } else { tg.showAlert(`❌ Недостаточно ${currentPair.from}!`); return; }
                }
                saveData();
                renderWallet();
                renderExchange();
            };
        }

        // ========== КОШЕЛЕК ==========
        function renderWallet() {
            const totalDisplay = formatDisplayBalance();
            const totalUSD = getTotalBalanceInDisplayCurrency();
            
            document.getElementById('app').innerHTML = `
                <div class="wallet-header fade-enter">
                    <div class="wallet-balance-label">Общий баланс</div>
                    <div class="wallet-balance">${totalDisplay}</div>
                    <div class="currency-selector" id="displayCurrencySelector">
                        <i class="fas fa-exchange-alt"></i>
                        <span>Показать в ${userData.displayCurrency === 'USD' ? 'RUB' : 'USD'}</span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                    <div class="currency-selector" id="currencySelector" style="margin-top:8px;">
                        <i class="fas fa-coins"></i>
                        <span>Выбрать валюту</span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
                <div class="assets-grid">
                    ${Object.entries(userData.balance).map(([cur, val], i) => {
                        let iconHtml = currencyIcons[cur] || '💰';
                        let usdValue = val * (exchangeRates[cur] || 0);
                        let displayValue = userData.displayCurrency === 'RUB' ? usdValue * USD_TO_RUB : usdValue;
                        let displaySymbol = userData.displayCurrency === 'RUB' ? '₽' : '$';
                        let formattedAmount = cur === 'BTC' ? val.toFixed(6) : (cur === 'ETH' ? val.toFixed(4) : val.toFixed(2));
                        return `
                            <div class="asset-card" style="animation-delay: ${i * 0.05}s">
                                <div class="asset-icon">${iconHtml}</div>
                                <div class="asset-name">${cur}</div>
                                <div class="asset-amount">${formattedAmount}</div>
                                <div style="font-size:11px; color:var(--text-secondary);">≈ ${displaySymbol}${displayValue.toFixed(2)}</div>
                            </div>
                        `;
                    }).join('')}
                </div>
                <div class="actions-grid">
                    <div class="action-btn" data-action="send"><div class="action-icon"><i class="fas fa-paper-plane"></i></div><div class="action-label">Отправить</div></div>
                    <div class="action-btn" data-action="deposit"><div class="action-icon"><i class="fas fa-plus-circle"></i></div><div class="action-label">Пополнить</div></div>
                    <div class="action-btn" data-action="swap"><div class="action-icon"><i class="fas fa-exchange-alt"></i></div><div class="action-label">Обменять</div></div>
                    <div class="action-btn" data-action="history"><div class="action-icon"><i class="fas fa-history"></i></div><div class="action-label">История</div></div>
                </div>
                <div class="section-header"><div class="section-title">Последние операции</div></div>
                <div class="transactions-list">
                    ${userData.transactions.slice(0,5).map(tx => `
                        <div class="transaction-item">
                            <div class="transaction-left">
                                <div class="transaction-icon"><i class="fas ${tx.type === 'deposit' ? 'fa-arrow-down' : (tx.type === 'send' ? 'fa-arrow-up' : 'fa-exchange-alt')}"></i></div>
                                <div class="transaction-info"><h4>${tx.title}</h4><p>${tx.date}</p></div>
                            </div>
                            <div><span class="status-badge status-approved">✅</span></div>
                        </div>
                    `).join('')}
                </div>
            `;
            document.getElementById('currencySelector').onclick = showCurrencyGrid;
            document.getElementById('displayCurrencySelector').onclick = toggleDisplayCurrency;
            document.querySelectorAll('.action-btn').forEach(btn => {
                const action = btn.getAttribute('data-action');
                if (action === 'send') btn.onclick = showSendModal;
                else if (action === 'deposit') btn.onclick = showDepositModal;
                else if (action === 'swap') btn.onclick = showSwapModal;
                else if (action === 'history') btn.onclick = showHistoryModal;
            });
        }

        // ========== ПРОФИЛЬ С КРАСИВЫМИ ИКОНКАМИ ==========
        function renderProfile() {
            const totalDepositsDisplay = userData.displayCurrency === 'RUB' 
                ? (userData.totalDepositsUSD * USD_TO_RUB).toFixed(2) 
                : userData.totalDepositsUSD.toFixed(2);
            const depositSymbol = userData.displayCurrency === 'RUB' ? '₽' : '$';
            
            document.getElementById('app').innerHTML = `
                <div class="wallet-header fade-enter" style="text-align:center;">
                    <div style="width:80px;height:80px;background:linear-gradient(135deg,var(--green-primary),#00995a);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;"><i class="fas fa-user-circle" style="font-size:44px; color:white;"></i></div>
                    <h3><i class="fas fa-user"></i> ${userName}</h3>
                    <p style="color:var(--text-secondary); margin-top:4px;"><i class="fas fa-id-card"></i> ID: ${userId}</p>
                </div>
                <div class="assets-grid" style="grid-template-columns:repeat(2,1fr);">
                    <div class="asset-card"><div class="asset-icon"><i class="fas fa-chart-line" style="font-size:28px; color:var(--green-primary);"></i></div><div class="asset-name">Всего пополнений</div><div class="asset-amount">${depositSymbol}${totalDepositsDisplay}</div></div>
                    <div class="asset-card"><div class="asset-icon"><i class="fas fa-check-circle" style="font-size:28px; color:var(--green-primary);"></i></div><div class="asset-name">Успешных</div><div class="asset-amount">${userData.successfulDeposits}</div></div>
                    <div class="asset-card"><div class="asset-icon"><i class="fas fa-times-circle" style="font-size:28px; color:var(--red);"></i></div><div class="asset-name">Неуспешных</div><div class="asset-amount">${userData.failedDeposits}</div></div>
                    <div class="asset-card"><div class="asset-icon"><i class="fas fa-exchange-alt" style="font-size:28px; color:var(--blue);"></i></div><div class="asset-name">Операций</div><div class="asset-amount">${userData.transactions.length}</div></div>
                </div>
                <div class="section-header"><div class="section-title"><i class="fas fa-clock"></i> Мои заявки</div></div>
                <div class="transactions-list">
                    ${userData.pendingPayments.slice(0,5).map(p => `
                        <div class="transaction-item"><div class="transaction-left"><div class="transaction-icon"><i class="fas fa-clock"></i></div><div class="transaction-info"><h4>Заявка #${p.id}</h4><p>${p.amount} USD | ${p.date}</p></div></div><div><span class="status-badge ${p.status === 'approved' ? 'status-approved' : 'status-pending'}">${p.status === 'approved' ? '✅' : '⏳'}</span></div></div>
                    `).join('')}
                </div>
            `;
        }

        // Навигация
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', () => {
                currentTab = btn.getAttribute('data-tab');
                document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if (currentTab === 'wallet') renderWallet();
                else if (currentTab === 'exchange') renderExchange();
                else if (currentTab === 'profile') renderProfile();
            });
        });

        renderWallet();

        // Обновление цены
        setInterval(() => {
            currentPrice += (Math.random() - 0.5) * 0.0005;
            currentPrice = Math.max(0.98, Math.min(1.01, currentPrice));
            if (currentTab === 'exchange') renderExchange();
        }, 4000);
    </script>
</body>
</html>
