<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Crypto Bot - Анимированный интерфейс</title>
    
    <!-- Font Awesome 6 (иконки) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* Основные переменные */
        :root {
            --bg-dark: #0a0a0c;
            --bg-card: #13151a;
            --bg-nav: #0f1115;
            --green-primary: #00d47e;
            --green-glow: rgba(0, 212, 126, 0.2);
            --red: #ff4757;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --text-tertiary: #5a5a60;
            --border: #1c1f26;
        }

        body {
            background: var(--bg-dark);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Анимированный градиентный фон */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(0, 212, 126, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(0, 100, 255, 0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: -1;
        }

        /* Контентная область */
        .content {
            padding: 20px;
            padding-bottom: 85px;
            animation: fadeInUp 0.4s ease-out;
        }

        /* Анимации */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Карточка баланса */
        .balance-card {
            background: linear-gradient(135deg, var(--bg-card) 0%, #0d0f14 100%);
            border-radius: 32px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .balance-card:hover {
            border-color: var(--green-primary);
            transform: translateY(-2px);
        }

        .balance-label {
            font-size: 14px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        .balance-amount {
            font-size: 48px;
            font-weight: 700;
            margin: 8px 0;
            background: linear-gradient(135deg, #fff 0%, var(--green-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .balance-change {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(0, 212, 126, 0.1);
        }

        .balance-change.positive {
            color: var(--green-primary);
        }

        /* Кнопки действий */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .action-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            transform: translateY(-3px);
            border-color: var(--green-primary);
            box-shadow: 0 5px 20px rgba(0, 212, 126, 0.15);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        .action-icon {
            font-size: 24px;
            margin-bottom: 6px;
            display: inline-block;
        }

        .action-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Статистика */
        .stats-row {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            flex: 1;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 16px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: var(--green-primary);
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            margin-top: 8px;
        }

        /* Секция с транзакциями */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
        }

        .section-link {
            font-size: 13px;
            color: var(--green-primary);
            cursor: pointer;
        }

        .transactions-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .transaction-item {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
            transition: all 0.25s ease;
            cursor: pointer;
            animation: slideIn 0.3s ease backwards;
        }

        .transaction-item:hover {
            border-color: var(--green-primary);
            transform: translateX(4px);
        }

        .transaction-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .transaction-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1d24 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .transaction-info h4 {
            font-size: 15px;
            margin-bottom: 4px;
        }

        .transaction-info p {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .transaction-amount {
            text-align: right;
        }

        .transaction-amount .amount {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .transaction-amount .amount.positive {
            color: var(--green-primary);
        }

        .transaction-amount .amount.negative {
            color: var(--red);
        }

        .transaction-date {
            font-size: 11px;
            color: var(--text-tertiary);
        }

        /* Анимированная нижняя панель */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 17, 21, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 16px calc(12px + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid var(--border);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 10px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 8px 16px;
            border-radius: 30px;
            background: transparent;
            border: none;
            font-family: inherit;
            position: relative;
        }

        .nav-item i {
            font-size: 22px;
            transition: all 0.2s ease;
        }

        .nav-item.active {
            color: var(--green-primary);
        }

        .nav-item.active i {
            transform: translateY(-2px);
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            background: var(--green-primary);
            border-radius: 2px;
            animation: slideIn 0.3s ease;
        }

        .nav-item:active {
            transform: scale(0.95);
        }

        /* Анимированная волна для графика */
        .wave-container {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        canvas {
            width: 100%;
            height: 120px;
        }

        /* Анимация загрузки */
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--green-primary);
            border-radius: 50%;
            animation: rotate 0.6s linear infinite;
        }

        /* Остальные стили */
        .hidden {
            display: none;
        }

        /* Адаптивность */
        @media (max-width: 480px) {
            .content {
                padding: 16px;
                padding-bottom: 80px;
            }
            .balance-amount {
                font-size: 36px;
            }
            .actions-grid {
                gap: 8px;
            }
            .action-btn {
                padding: 10px 6px;
            }
        }
    </style>
</head>
<body>
    <div class="content" id="app">
        <!-- Контент будет загружаться динамически -->
    </div>

    <div class="bottom-nav">
        <button class="nav-item active" data-tab="wallet">
            <i class="fas fa-wallet"></i>
            <span>Кошелёк</span>
        </button>
        <button class="nav-item" data-tab="charts">
            <i class="fas fa-chart-line"></i>
            <span>Графики</span>
        </button>
        <button class="nav-item" data-tab="swap">
            <i class="fas fa-exchange-alt"></i>
            <span>Обмен</span>
        </button>
        <button class="nav-item" data-tab="more">
            <i class="fas fa-user"></i>
            <span>Профиль</span>
        </button>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.enableClosingConfirmation();
            tg.ready();
        }

        // Данные для транзакций
        const transactions = {
            wallet: [
                { id: 1, icon: "fas fa-arrow-up", type: "Отправлено", to: "0x742...3ef", amount: -50.25, date: "Сегодня, 14:32", coin: "TON" },
                { id: 2, icon: "fas fa-arrow-down", type: "Получено", from: "Биржа Bybit", amount: 125.00, date: "Вчера, 09:15", coin: "TON" },
                { id: 3, icon: "fas fa-gift", type: "Бонус", from: "Реферальная программа", amount: 5.00, date: "2 дня назад", coin: "TON" }
            ],
            swap: [
                { id: 4, icon: "fas fa-sync-alt", type: "Обмен", from: "TON", to: "USDT", amount: -100, result: 567.80, date: "3 дня назад" },
                { id: 5, icon: "fas fa-sync-alt", type: "Обмен", from: "BTC", to: "TON", amount: -0.001, result: 45.20, date: "5 дней назад" }
            ]
        };

        // Данные для графиков
        let chartData = [42, 38, 45, 52, 48, 55, 60, 58, 62, 68, 65, 70, 75, 72, 78, 82, 80, 85, 88, 92, 95, 90, 88, 85];
        let chartCanvas = null;

        // Функция для отрисовки графика
        function drawChart() {
            const canvas = document.getElementById('priceChart');
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            
            canvas.width = width;
            canvas.height = height;
            
            const padding = 20;
            const chartWidth = width - padding * 2;
            const chartHeight = height - padding * 2;
            
            const maxValue = Math.max(...chartData);
            const minValue = Math.min(...chartData);
            const range = maxValue - minValue;
            
            ctx.clearRect(0, 0, width, height);
            
            // Рисуем сетку
            ctx.strokeStyle = '#1c1f26';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= 4; i++) {
                const y = padding + (chartHeight / 4) * i;
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(width - padding, y);
                ctx.stroke();
            }
            
            // Рисуем линию графика с градиентом
            ctx.beginPath();
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#00d47e');
            gradient.addColorStop(1, 'rgba(0, 212, 126, 0)');
            
            let firstPoint = true;
            chartData.forEach((value, index) => {
                const x = padding + (chartWidth / (chartData.length - 1)) * index;
                const y = padding + chartHeight - ((value - minValue) / range) * chartHeight;
                
                if (firstPoint) {
                    ctx.moveTo(x, y);
                    firstPoint = false;
                } else {
                    ctx.lineTo(x, y);
                }
            });
            ctx.strokeStyle = '#00d47e';
            ctx.lineWidth = 2.5;
            ctx.stroke();
            
            // Заливка под графиком
            ctx.lineTo(width - padding, height - padding);
            ctx.lineTo(padding, height - padding);
            ctx.fillStyle = gradient;
            ctx.fill();
        }

        // Контент для вкладки "Кошелёк"
        function renderWallet() {
            return `
                <div class="balance-card">
                    <div class="balance-label">Общий баланс</div>
                    <div class="balance-amount">1,284.50 TON</div>
                    <div class="balance-change positive">
                        <i class="fas fa-arrow-up"></i>
                        +12.5% за неделю
                    </div>
                </div>
                
                <div class="actions-grid">
                    <div class="action-btn" data-action="send">
                        <div class="action-icon"><i class="fas fa-paper-plane"></i></div>
                        <div class="action-label">Отправить</div>
                    </div>
                    <div class="action-btn" data-action="receive">
                        <div class="action-icon"><i class="fas fa-qrcode"></i></div>
                        <div class="action-label">Получить</div>
                    </div>
                    <div class="action-btn" data-action="buy">
                        <div class="action-icon"><i class="fas fa-shopping-cart"></i></div>
                        <div class="action-label">Купить</div>
                    </div>
                    <div class="action-btn" data-action="history">
                        <div class="action-icon"><i class="fas fa-history"></i></div>
                        <div class="action-label">История</div>
                    </div>
                </div>
                
                <div class="stats-row">
                    <div class="stat-card">
                        <div><i class="fas fa-chart-simple"></i> В стейкинге</div>
                        <div class="stat-value">350 TON</div>
                    </div>
                    <div class="stat-card">
                        <div><i class="fas fa-coins"></i> Доход</div>
                        <div class="stat-value">+42.5 TON</div>
                    </div>
                </div>
                
                <div class="section-header">
                    <div class="section-title">Последние транзакции</div>
                    <div class="section-link" data-view-all>Все →</div>
                </div>
                
                <div class="transactions-list">
                    ${transactions.wallet.map((tx, index) => `
                        <div class="transaction-item" style="animation-delay: ${index * 0.05}s">
                            <div class="transaction-left">
                                <div class="transaction-icon"><i class="${tx.icon}"></i></div>
                                <div class="transaction-info">
                                    <h4>${tx.type}</h4>
                                    <p>${tx.to || tx.from || ''}</p>
                                </div>
                            </div>
                            <div class="transaction-amount">
                                <div class="amount ${tx.amount > 0 ? 'positive' : 'negative'}">
                                    ${tx.amount > 0 ? '+' : ''}${tx.amount} ${tx.coin || 'TON'}
                                </div>
                                <div class="transaction-date">${tx.date}</div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Контент для вкладки "Графики"
        function renderCharts() {
            setTimeout(() => drawChart(), 50);
            return `
                <div class="section-header">
                    <div class="section-title">TON / USDT</div>
                    <div class="section-link" data-period="week">Неделя</div>
                </div>
                
                <div class="wave-container">
                    <canvas id="priceChart" style="width:100%; height:120px;"></canvas>
                </div>
                
                <div class="stats-row">
                    <div class="stat-card">
                        <div>Цена TON</div>
                        <div class="stat-value">$5.67</div>
                    </div>
                    <div class="stat-card">
                        <div>24ч изменение</div>
                        <div class="stat-value" style="color: #00d47e;">+2.34%</div>
                    </div>
                </div>
                
                <div class="section-header" style="margin-top: 24px;">
                    <div class="section-title">Популярные пары</div>
                </div>
                
                <div class="transactions-list">
                    <div class="transaction-item">
                        <div class="transaction-left">
                            <div class="transaction-icon"><i class="fab fa-bitcoin"></i></div>
                            <div class="transaction-info">
                                <h4>BTC/TON</h4>
                                <p>11,234 TON</p>
                            </div>
                        </div>
                        <div class="transaction-amount">
                            <div class="amount positive">+1.23%</div>
                            <div class="transaction-date">$67,890</div>
                        </div>
                    </div>
                    <div class="transaction-item">
                        <div class="transaction-left">
                            <div class="transaction-icon"><i class="fab fa-ethereum"></i></div>
                            <div class="transaction-info">
                                <h4>ETH/TON</h4>
                                <p>610 TON</p>
                            </div>
                        </div>
                        <div class="transaction-amount">
                            <div class="amount positive">+0.56%</div>
                            <div class="transaction-date">$3,456</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Контент для вкладки "Обмен"
        function renderSwap() {
            return `
                <div class="balance-card">
                    <div style="margin-bottom: 20px;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span>Отправляете</span>
                            <span>Баланс: 1,284.50 TON</span>
                        </div>
                        <div style="background: #0a0a0c; border-radius: 20px; padding: 16px;">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <input type="number" id="fromAmount" placeholder="0" style="background: transparent; border: none; font-size: 28px; color: white; outline: none; width: 60%;">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <i class="fab fa-telegram"></i> TON
                                </div>
                            </div>
                            <div style="color: var(--text-tertiary); margin-top: 8px;">≈ $0.00</div>
                        </div>
                    </div>
                    
                    <div style="text-align: center; margin: -8px 0;">
                        <div style="background: var(--green-primary); width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; cursor: pointer;">
                            <i class="fas fa-arrow-down" style="color: white;"></i>
                        </div>
                    </div>
                    
                    <div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span>Получаете</span>
                        </div>
                        <div style="background: #0a0a0c; border-radius: 20px; padding: 16px;">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <input type="text" id="toAmount" placeholder="0" readonly style="background: transparent; border: none; font-size: 28px; color: white; outline: none; width: 60%;">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <i class="fas fa-dollar-sign"></i> USDT
                                </div>
                            </div>
                            <div style="color: var(--text-tertiary); margin-top: 8px;">≈ $0.00</div>
                        </div>
                    </div>
                </div>
                
                <button class="action-btn" id="swapActionBtn" style="width: 100%; padding: 16px; background: var(--green-primary); color: white; font-weight: 600; border: none; margin-top: 16px;">
                    <i class="fas fa-exchange-alt"></i> Обменять
                </button>
                
                <div class="section-header" style="margin-top: 24px;">
                    <div class="section-title">История обменов</div>
                </div>
                
                <div class="transactions-list">
                    ${transactions.swap.map((tx, index) => `
                        <div class="transaction-item" style="animation-delay: ${index * 0.05}s">
                            <div class="transaction-left">
                                <div class="transaction-icon"><i class="${tx.icon}"></i></div>
                                <div class="transaction-info">
                                    <h4>${tx.type}</h4>
                                    <p>${tx.from} → ${tx.to}</p>
                                </div>
                            </div>
                            <div class="transaction-amount">
                                <div class="amount">${tx.amount} ${tx.from}</div>
                                <div class="transaction-date">+${tx.result} ${tx.to}</div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Контент для вкладки "Профиль"
        function renderProfile() {
            return `
                <div class="balance-card" style="text-align: center;">
                    <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #00d47e, #00995a); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px;">
                        <i class="fas fa-user" style="font-size: 40px;"></i>
                    </div>
                    <h3>Алексей К.</h3>
                    <p style="color: var(--text-tertiary); margin-top: 4px;">ID: 7421953</p>
                </div>
                
                <div class="transactions-list">
                    <div class="transaction-item" data-action="referral">
                        <div class="transaction-left">
                            <div class="transaction-icon"><i class="fas fa-users"></i></div>
                            <div class="transaction-info">
                                <h4>Реферальная программа</h4>
                                <p>Пригласи друзей и получай бонусы</p>
                            </div>
                        </div>
                        <div><i class="fas fa-chevron-right" style="color: var(--text-tertiary);"></i></div>
                    </div>
                    <div class="transaction-item" data-action="security">
                        <div class="transaction-left">
                            <div class="transaction-icon"><i class="fas fa-shield-alt"></i></div>
                            <div class="transaction-info">
                                <h4>Безопасность</h4>
                                <p>2FA, доверенные устройства</p>
                            </div>
                        </div>
                        <div><i class="fas fa-chevron-right" style="color: var(--text-tertiary);"></i></div>
                    </div>
                    <div class="transaction-item" data-action="language">
                        <div class="transaction-left">
                            <div class="transaction-icon"><i class="fas fa-globe"></i></div>
                            <div class="transaction-info">
                                <h4>Язык</h4>
                                <p>Русский</p>
                            </div>
                        </div>
                        <div><i class="fas fa-chevron-right" style="color: var(--text-tertiary);"></i></div>
                    </div>
                    <div class="transaction-item" data-action="support">
                        <div class="transaction-left">
                            <div class="transaction-icon"><i class="fas fa-headset"></i></div>
                            <div class="transaction-info">
                                <h4>Поддержка</h4>
                                <p>Помощь и обратная связь</p>
                            </div>
                        </div>
                        <div><i class="fas fa-chevron-right" style="color: var(--text-tertiary);"></i></div>
                    </div>
                    <div class="transaction-item" data-action="close">
                        <div class="transaction-left">
                            <div class="transaction-icon"><i class="fas fa-sign-out-alt"></i></div>
                            <div class="transaction-info">
                                <h4>Закрыть приложение</h4>
                                <p>Выйти из Crypto Bot</p>
                            </div>
                        </div>
                        <div><i class="fas fa-chevron-right" style="color: var(--text-tertiary);"></i></div>
                    </div>
                </div>
            `;
        }

        // Основная функция рендеринга
        let currentTab = 'wallet';

        function renderTab(tabName) {
            let html = '';
            switch(tabName) {
                case 'wallet': html = renderWallet(); break;
                case 'charts': html = renderCharts(); break;
                case 'swap': html = renderSwap(); break;
                case 'more': html = renderProfile(); break;
                default: html = renderWallet();
            }
            
            const appDiv = document.getElementById('app');
            appDiv.style.animation = 'none';
            appDiv.offsetHeight; // Trigger reflow
            appDiv.style.animation = 'fadeInUp 0.4s ease-out';
            appDiv.innerHTML = html;
            
            // Обновляем активный класс у навигации
            document.querySelectorAll('.nav-item').forEach(btn => {
                if (btn.getAttribute('data-tab') === tabName) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            // Добавляем обработчики после рендера
            attachEventHandlers(tabName);
            
            // Перерисовываем график если нужно
            if (tabName === 'charts') {
                setTimeout(() => drawChart(), 100);
                window.addEventListener('resize', () => drawChart());
            }
        }

        // Обработчики событий
        function attachEventHandlers(tabName) {
            // Кнопка обмена
            const swapBtn = document.getElementById('swapActionBtn');
            if (swapBtn) {
                swapBtn.onclick = () => {
                    const fromAmount = document.getElementById('fromAmount');
                    const toAmount = document.getElementById('toAmount');
                    const amount = parseFloat(fromAmount?.value || 0);
                    if (amount > 0) {
                        if (tg) tg.showConfirm(`Обменять ${amount} TON на ${(amount * 5.67).toFixed(2)} USDT?`, (confirmed) => {
                            if (confirmed && tg) tg.showAlert('✅ Обмен выполнен успешно!');
                        });
                    } else if (tg) {
                        tg.showAlert('Введите сумму для обмена');
                    }
                };
            }
            
            // Поле ввода для обмена
            const fromInput = document.getElementById('fromAmount');
            const toInput = document.getElementById('toAmount');
            if (fromInput && toInput) {
                fromInput.oninput = () => {
                    const val = parseFloat(fromInput.value) || 0;
                    toInput.value = (val * 5.67).toFixed(2);
                };
            }
            
            // Обработчики для экшн-кнопок
            document.querySelectorAll('.action-btn[data-action]').forEach(btn => {
                btn.onclick = () => {
                    if (tg) tg.showAlert(`Функция "${btn.querySelector('.action-label')?.innerText || btn.dataset.action}" в разработке`);
                };
            });
            
            // Обработчики для пунктов профиля
            document.querySelectorAll('.transaction-item[data-action]').forEach(item => {
                item.onclick = () => {
                    const action = item.dataset.action;
                    if (action === 'close' && tg) {
                        tg.close();
                    } else if (tg) {
                        tg.showAlert(`Раздел "${item.querySelector('h4')?.innerText}" будет доступен в следующем обновлении`);
                    }
                };
            });
        }

        // Навигация
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.getAttribute('data-tab');
                currentTab = tab;
                renderTab(tab);
            });
        });
        
        // Стартовый рендер
        renderTab('wallet');
        
        // Обновление графика при изменении размера
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (currentTab === 'charts') drawChart();
            }, 100);
        });
    </script>
</body>
</html>
