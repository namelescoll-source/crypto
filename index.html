<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto App - Нижнее меню</title>
    
    <!-- ПОДКЛЮЧАЕМ БИБЛИОТЕКУ С ИКОНКАМИ (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* ОБНУЛЯЕМ ОТСТУПЫ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ТЕМНЫЙ ФОН КАК В TELEGRAM */
        body {
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* ОСНОВНОЙ КОНТЕНТ */
        .content {
            color: white;
            padding: 20px;
            text-align: center;
            margin-top: 50px;
        }

        /* ===== НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ ===== */
        .bottom-nav {
            position: fixed;     /* Закрепляем внизу */
            bottom: 0;          /* Прижимаем к низу */
            left: 0;
            width: 100%;
            background-color: #1c1c1e;  /* Тёмно-серый фон панели */
            display: flex;               /* Гибкое расположение */
            justify-content: space-around; /* Равномерно распределяем */
            align-items: center;
            padding: 10px 0 25px 0;      /* 25px снизу — отступ для iPhone */
            border-top: 1px solid #2c2c2e; /* Тонкая линия сверху */
        }

        /* КАЖДАЯ КНОПКА В МЕНЮ */
        .nav-item {
            display: flex;
            flex-direction: column;  /* Иконка сверху, текст снизу */
            align-items: center;
            gap: 5px;               /* Расстояние между иконкой и текстом */
            cursor: pointer;
            color: #8e8e93;         /* Серый цвет (неактивный) */
            font-size: 11px;
            font-weight: 500;
            transition: color 0.2s;
        }

        /* СТИЛЬ ДЛЯ ИКОНОК */
        .nav-item i {
            font-size: 24px;        /* Размер иконки */
        }

        /* АКТИВНАЯ КНОПКА (ЗЕЛЁНАЯ, КАК В CRYPTO BOT) */
        .nav-item.active {
            color: #34c759;         /* Тот самый зелёный цвет */
        }

        /* УБИРАЕМ СЕРЫЙ ФОН ПРИ НАЖАТИИ НА ТЕЛЕФОНЕ */
        .nav-item {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>

    <!-- КОНТЕНТ, КОТОРЫЙ БУДЕТ МЕНЯТЬСЯ -->
    <div class="content" id="mainContent">
        <h1>🏦 Кошелёк</h1>
        <p>Ваш баланс: 0.00 TON</p>
    </div>

    <!-- ===== НИЖНЕЕ МЕНЮ ===== -->
    <div class="bottom-nav">
        <!-- Кнопка 1: Кошелёк -->
        <div class="nav-item active" data-tab="wallet">
            <i class="fas fa-wallet"></i>
            <span>Кошелёк</span>
        </div>
        
        <!-- Кнопка 2: Биржа -->
        <div class="nav-item" data-tab="exchange">
            <i class="fas fa-chart-line"></i>
            <span>Биржа</span>
        </div>
        
        <!-- Кнопка 3: Обмен -->
        <div class="nav-item" data-tab="swap">
            <i class="fas fa-exchange-alt"></i>
            <span>Обмен</span>
        </div>
        
        <!-- Кнопка 4: Ещё -->
        <div class="nav-item" data-tab="more">
            <i class="fas fa-ellipsis-h"></i>
            <span>Ещё</span>
        </div>
    </div>

    <script>
        // ===== ЛОГИКА ПЕРЕКЛЮЧЕНИЯ МЕЖДУ ВКЛАДКАМИ =====
        
        // Находим все кнопки меню
        const navItems = document.querySelectorAll('.nav-item');
        
        // Функция для смены активной вкладки
        function switchTab(selectedItem) {
            // 1. Убираем подсветку со всех кнопок
            navItems.forEach(item => {
                item.classList.remove('active');
            });
            
            // 2. Добавляем подсветку на нажатую кнопку
            selectedItem.classList.add('active');
            
            // 3. Меняем контент в зависимости от того, что нажали
            const tabName = selectedItem.getAttribute('data-tab');
            const contentDiv = document.getElementById('mainContent');
            
            if (tabName === 'wallet') {
                contentDiv.innerHTML = `
                    <h1>💰 Кошелёк</h1>
                    <p>Ваш баланс: 1,234.56 TON</p>
                    <button style="margin-top:20px; padding:10px 20px; background:#34c759; border:none; border-radius:10px; color:white;">Пополнить</button>
                `;
            } else if (tabName === 'exchange') {
                contentDiv.innerHTML = `
                    <h1>📈 Биржа</h1>
                    <p>TON: $5.67</p>
                    <p>BTC: $67,890</p>
                    <p>ETH: $3,456</p>
                `;
            } else if (tabName === 'swap') {
                contentDiv.innerHTML = `
                    <h1>🔄 Обмен</h1>
                    <p>TON → BTC</p>
                    <p>100 TON = 0.0008 BTC</p>
                `;
            } else if (tabName === 'more') {
                contentDiv.innerHTML = `
                    <h1>⚙️ Ещё</h1>
                    <p>Настройки</p>
                    <p>О приложении</p>
                    <p>Выйти</p>
                `;
            }
        }
        
        // Навешиваем обработчик клика на каждую кнопку
        navItems.forEach(item => {
            item.addEventListener('click', () => switchTab(item));
        });
    </script>
</body>
</html>
