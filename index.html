<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Crypto Bot - Админ панель</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-dark: #0a0a0c;
            --bg-card: rgba(19, 21, 26, 0.9);
            --green-primary: #00d47e;
            --green-glow: rgba(0, 212, 126, 0.3);
            --red: #ff4757;
            --blue: #3b82f6;
            --orange: #ff9800;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --border: rgba(28, 31, 38, 0.8);
        }

        body {
            background: var(--bg-dark);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Исправления для iPhone */
        .content {
            padding: 20px;
            padding-bottom: 90px;
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        /* Адаптация для безопасной зоны iPhone */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 17, 21, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 16px constant(safe-area-inset-bottom);
            padding: 8px 16px env(safe-area-inset-bottom);
            border-top: 1px solid var(--border);
            z-index: 1000;
        }

        /* Анимации */
        .fade-enter {
            animation: fadeSlideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Карточки */
        .wallet-header {
            background: linear-gradient(135deg, rgba(0, 212, 126, 0.15), rgba(59, 130, 246, 0.1));
            border-radius: 40px;
            padding: 28px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 212, 126, 0.3);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .wallet-balance {
            font-size: 48px;
            font-weight: 800;
            margin: 12px 0;
            background: linear-gradient(135deg, #fff, var(--green-primary), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
            word-break: break-word;
        }

        @keyframes shine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .assets-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .asset-card {
            background: rgba(19, 21, 26, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 16px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .action-btn {
            background: rgba(19, 21, 26, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn:active {
            transform: scale(0.96);
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(16px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: linear-gradient(135deg, #13151a, #0d0f14);
            border-radius: 48px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(0, 212, 126, 0.3);
            max-height: 85vh;
            overflow-y: auto;
        }

        /* Админ-панель стили */
        .admin-header {
            background: linear-gradient(135deg, var(--orange), #ff5722);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-badge {
            background: rgba(255,255,255,0.2);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
        }

        .pending-card {
            background: rgba(10, 10, 12, 0.8);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
        }

        .pending-card:hover {
            border-color: var(--orange);
            transform: translateX(4px);
        }

        .status-pending {
            background: var(--orange);
            color: #000;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-approved {
            background: var(--green-primary);
            color: #000;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .receipt-image {
            max-width: 100%;
            border-radius: 20px;
            margin: 16px 0;
            border: 1px solid var(--border);
        }

        .modal-btn {
            flex: 1;
            padding: 14px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-btn.confirm {
            background: var(--green-primary);
            color: white;
        }

        .modal-btn.cancel {
            background: rgba(28, 31, 38, 0.8);
            color: var(--text-secondary);
        }

        .modal-btn.danger {
            background: var(--red);
            color: white;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 17, 21, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 16px constant(safe-area-inset-bottom);
            padding: 8px 16px env(safe-area-inset-bottom);
            border-top: 1px solid var(--border);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 10px;
            padding: 8px 16px;
            background: transparent;
            border: none;
        }

        .nav-item.active {
            color: var(--green-primary);
        }

        .nav-item i {
            font-size: 22px;
        }

        .dropzone {
            border: 2px dashed var(--border);
            border-radius: 24px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            margin: 16px 0;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
        }

        .transactions-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .transaction-item {
            background: rgba(19, 21, 26, 0.8);
            border-radius: 20px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <div class="content" id="app"></div>

    <div class="bottom-nav">
        <button class="nav-item active" data-tab="wallet"><i class="fas fa-wallet"></i><span>Кошелёк</span></button>
        <button class="nav-item" data-tab="exchange"><i class="fas fa-chart-line"></i><span>Биржа</span></button>
        <button class="nav-item" data-tab="profile"><i class="fas fa-user"></i><span>Профиль</span></button>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <div class="modal" id="adminModal" style="display:none;">
        <div class="modal-content" id="adminModalContent"></div>
    </div>

    <script>
        // Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();
        tg.ready();

        const user = tg.initDataUnsafe?.user;
        const userName = user ? `${user.first_name} ${user.last_name || ''}` : 'Гость';
        const userId = user ? user.id : Math.floor(Math.random() * 1000000);

        // ========== АДМИНИСТРАТОРЫ ==========
        // ВСТАВЬТЕ СВОЙ TELEGRAM ID СЮДА (узнать у @userinfobot)
        const ADMIN_IDS = [8993992293]; // ЗАМЕНИТЕ НА СВОЙ ID
        
        const isAdmin = ADMIN_IDS.includes(userId);

        // Курсы валют
        const USD_TO_RUB = 90;
        const exchangeRates = { USDT: 1.00, USDC: 0.9939, BTC: 67890, ETH: 3456, TON: 5.67, RUB: 0.0111 };
        
        const currencyIcons = {
            USDT: '<i class="fab fa-tether" style="color:#26A17B; font-size:28px;"></i>',
            USDC: '<i class="fas fa-dollar-sign" style="color:#2775CA; font-size:28px;"></i>',
            BTC: '<i class="fab fa-bitcoin" style="color:#F7931A; font-size:28px;"></i>',
            ETH: '<i class="fab fa-ethereum" style="color:#627EEA; font-size:28px;"></i>',
            TON: '<i class="fab fa-telegram" style="color:#0098EA; font-size:28px;"></i>',
            RUB: '<i class="fas fa-ruble-sign" style="color:#00d47e; font-size:28px;"></i>'
        };

        // Данные пользователя
        let userData = {
            balance: { USDT: 1250.50, USDC: 0, BTC: 0.0015, ETH: 0.05, TON: 100, RUB: 0 },
            displayCurrency: 'USD',
            transactions: [],
            pendingPayments: [],
            totalDepositsUSD: 1250.50,
            successfulDeposits: 3,
            failedDeposits: 0
        };

        // Загрузка сохранённых данных
        const savedData = localStorage.getItem('cryptoUserData');
        if (savedData) {
            const parsed = JSON.parse(savedData);
            userData = { ...userData, ...parsed };
        }

        let currentTab = 'wallet';
        let currentPrice = 0.9939;

        function saveData() {
            localStorage.setItem('cryptoUserData', JSON.stringify(userData));
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('adminModal').style.display = 'none';
        }

        function getTotalBalanceInDisplayCurrency() {
            let totalUSD = 0;
            for (const [cur, val] of Object.entries(userData.balance)) {
                totalUSD += val * (exchangeRates[cur] || 0);
            }
            if (userData.displayCurrency === 'RUB') {
                return totalUSD * USD_TO_RUB;
            }
            return totalUSD;
        }

        function formatDisplayBalance() {
            const total = getTotalBalanceInDisplayCurrency();
            if (userData.displayCurrency === 'RUB') {
                return `${total.toFixed(2)} ₽`;
            }
            return `$${total.toFixed(2)}`;
        }

        function addTransaction(type, title, amount, currency, status = 'success', details = '') {
            userData.transactions.unshift({
                id: Date.now(), type, title, amount, currency, status, details,
                date: new Date().toLocaleString()
            });
            if (userData.transactions.length > 50) userData.transactions.pop();
            saveData();
        }

        function toggleDisplayCurrency() {
            userData.displayCurrency = userData.displayCurrency === 'USD' ? 'RUB' : 'USD';
            saveData();
            renderWallet();
        }

        // ========== АДМИН-ПАНЕЛЬ ==========
        function showAdminPanel() {
            const pending = userData.pendingPayments.filter(p => p.status === 'pending');
            
            document.getElementById('adminModalContent').innerHTML = `
                <div class="admin-header">
                    <span><i class="fas fa-crown"></i> <strong>Админ-панель</strong></span>
                    <span class="admin-badge"><i class="fas fa-shield-alt"></i> ONLINE</span>
                </div>
                
                <div class="section-header">
                    <div class="section-title"><i class="fas fa-clock"></i> Ожидают проверки (${pending.length})</div>
                </div>
                
                <div id="pendingList">
                    ${pending.length > 0 ? pending.map(p => `
                        <div class="pending-card" onclick="viewPayment(${p.id})">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <div>
                                    <div><strong><i class="fas fa-user"></i> ${p.userName}</strong></div>
                                    <div style="font-size:13px; margin-top:4px;">
                                        <i class="fas fa-coins"></i> ${p.amount} ${p.currency} 
                                        <i class="fas fa-credit-card"></i> ${p.method}
                                    </div>
                                    <div style="font-size:11px; color:var(--text-secondary); margin-top:4px;">
                                        <i class="fas fa-calendar"></i> ${p.date}
                                    </div>
                                </div>
                                <div><span class="status-pending"><i class="fas fa-hourglass-half"></i> Ожидает</span></div>
                            </div>
                        </div>
                    `).join('') : '<div style="text-align:center; padding:30px; color:var(--text-secondary);"><i class="fas fa-check-circle"></i> Нет заявок на проверку</div>'}
                </div>
                
                <div class="section-header" style="margin-top:20px;">
                    <div class="section-title"><i class="fas fa-check-circle"></i> Подтверждённые</div>
                </div>
                <div>
                    ${userData.pendingPayments.filter(p => p.status === 'approved').slice(0,5).map(p => `
                        <div class="pending-card" style="opacity:0.7;">
                            <div style="display:flex; justify-content:space-between;">
                                <div><strong>${p.userName}</strong><br>${p.amount} ${p.currency}</div>
                                <div><span class="status-approved"><i class="fas fa-check"></i> Одобрено</span></div>
                            </div>
                        </div>
                    `).join('')}
                </div>
                
                <div class="modal-buttons" style="margin-top:20px;">
                    <button class="modal-btn cancel" onclick="closeModal()">Закрыть</button>
                </div>
            `;
            
            document.getElementById('adminModal').style.display = 'flex';
        }

        // Просмотр деталей платежа
        window.viewPayment = function(paymentId) {
            const payment = userData.pendingPayments.find(p => p.id === paymentId);
            if (!payment) return;
            
            document.getElementById('adminModalContent').innerHTML = `
                <div class="admin-header">
                    <span><i class="fas fa-receipt"></i> <strong>Заявка #${payment.id}</strong></span>
                    <span class="admin-badge">${payment.status === 'pending' ? '⏳ На проверке' : (payment.status === 'approved' ? '✅ Одобрено' : '❌ Отклонено')}</span>
                </div>
                
                <div style="background:rgba(10,10,12,0.6); border-radius:24px; padding:16px; margin-bottom:16px;">
                    <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
                        <div style="width:50px; height:50px; background:linear-gradient(135deg,var(--green-primary),#00995a); border-radius:50%; display:flex; align-items:center; justify-content:center;">
                            <i class="fas fa-user" style="font-size:24px;"></i>
                        </div>
                        <div>
                            <div><strong>${payment.userName}</strong></div>
                            <div style="font-size:12px; color:var(--text-secondary);">ID: ${payment.userId}</div>
                        </div>
                    </div>
                    
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px;">
                        <div><i class="fas fa-coins"></i> Валюта: <strong>${payment.currency}</strong></div>
                        <div><i class="fas fa-dollar-sign"></i> Сумма: <strong>${payment.amount} USD</strong></div>
                        <div><i class="fas fa-credit-card"></i> Способ: <strong>${payment.method}</strong></div>
                        <div><i class="fas fa-calendar"></i> Дата: <strong>${payment.date}</strong></div>
                    </div>
                    
                    ${payment.screenshot ? `
                        <div style="margin-top:16px;">
                            <div style="margin-bottom:8px;"><i class="fas fa-image"></i> Чек перевода:</div>
                            <img src="${payment.screenshot}" class="receipt-image" style="max-width:100%; border-radius:16px;">
                        </div>
                    ` : '<div style="margin-top:16px; padding:12px; background:rgba(255,71,87,0.1); border-radius:16px;"><i class="fas fa-exclamation-triangle"></i> Чек не загружен</div>'}
                </div>
                
                ${payment.status === 'pending' ? `
                    <div class="modal-buttons" style="gap:12px;">
                        <button class="modal-btn confirm" onclick="approvePayment(${payment.id})">
                            <i class="fas fa-check"></i> Подтвердить пополнение
                        </button>
                        <button class="modal-btn danger" onclick="rejectPayment(${payment.id})">
                            <i class="fas fa-times"></i> Отклонить
                        </button>
                    </div>
                ` : ''}
                
                <button class="modal-btn cancel" onclick="showAdminPanel()" style="margin-top:12px;">
                    <i class="fas fa-arrow-left"></i> Назад
                </button>
            `;
        };

        // Подтверждение платежа
        window.approvePayment = function(paymentId) {
            const payment = userData.pendingPayments.find(p => p.id === paymentId);
            if (payment && payment.status === 'pending') {
                payment.status = 'approved';
                
                // Зачисляем средства
                let amountInCurrency = payment.amount;
                if (payment.currency === 'RUB') {
                    amountInCurrency = payment.amount * USD_TO_RUB;
                }
                userData.balance[payment.currency] = (userData.balance[payment.currency] || 0) + amountInCurrency;
                userData.totalDepositsUSD += payment.amount;
                userData.successfulDeposits++;
                
                addTransaction('deposit', `Пополнение ${payment.currency}`, amountInCurrency, payment.currency, 'success', `Чек одобрен администратором (сумма: ${payment.amount} USD)`);
                saveData();
                
                tg.showAlert(`✅ Пополнение подтверждено! Начислено ${amountInCurrency} ${payment.currency}`);
                showAdminPanel();
                renderWallet();
                renderProfile();
            }
        };

        // Отклонение платежа
        window.rejectPayment = function(paymentId) {
            const payment = userData.pendingPayments.find(p => p.id === paymentId);
            if (payment && payment.status === 'pending') {
                payment.status = 'rejected';
                userData.failedDeposits++;
                addTransaction('deposit', `Пополнение ${payment.currency}`, payment.amount, payment.currency, 'failed', `Чек отклонён администратором`);
                saveData();
                tg.showAlert(`❌ Пополнение отклонено!`);
                showAdminPanel();
                renderProfile();
            }
        };

        // ========== ПОПОЛНЕНИЕ ==========
        let screenshotDataUrl = null;
        let selectedMethod = null;
        let depositAmount = 0;

        function showDepositModal() {
            selectedMethod = null;
            depositAmount = 0;
            screenshotDataUrl = null;
            
            document.getElementById('modalContent').innerHTML = `
                <h3 style="text-align:center;"><i class="fas fa-plus-circle"></i> Пополнение</h3>
                <select id="depositCurrency" class="modal-input" style="width:100%; padding:14px; background:#0a0a0c; border:1px solid #1c1f26; border-radius:20px; color:white; margin-bottom:16px;">
                    <option value="USDT">USDT</option>
                    <option value="USDC">USDC</option>
                    <option value="BTC">BTC</option>
                    <option value="ETH">ETH</option>
                    <option value="TON">TON</option>
                    <option value="RUB">RUB (Рубли)</option>
                </select>
                <input type="number" id="depositAmount" class="modal-input" placeholder="Сумма в USD" style="width:100%; padding:14px; background:#0a0a0c; border:1px solid #1c1f26; border-radius:20px; color:white; margin-bottom:16px;">
                
                <div style="margin:16px 0;">
                    <div style="margin-bottom:12px;">Способ оплаты:</div>
                    <div id="paymentMethodsList"></div>
                </div>
                
                <div id="paymentDetails"></div>
                
                <div id="screenshotSection" style="display:none;">
                    <div class="dropzone" id="dropzone">
                        <i class="fas fa-cloud-upload-alt" style="font-size:40px;"></i>
                        <p>Нажмите для загрузки чека</p>
                        <p style="font-size:11px; color:var(--text-secondary);">PNG, JPG до 5MB</p>
                        <input type="file" id="screenshotInput" accept="image/*" style="display:none;">
                    </div>
                    <div id="screenshotPreview"></div>
                </div>
                
                <div class="modal-buttons" style="display:flex; gap:12px; margin-top:20px;">
                    <button class="modal-btn cancel" onclick="closeModal()">Отмена</button>
                    <button class="modal-btn confirm" onclick="submitDeposit()">Отправить на проверку</button>
                </div>
            `;
            
            const paymentMethods = [
                { id: 'card', name: 'Банковская карта', icon: '💳' },
                { id: 'sbp', name: 'СБП', icon: '🏦' },
                { id: 'ton', name: 'TON', icon: '💎' }
            ];
            
            document.getElementById('paymentMethodsList').innerHTML = paymentMethods.map(m => `
                <div class="payment-method" data-method="${m.id}" style="display:flex; align-items:center; gap:12px; padding:12px; background:#0a0a0c; border:1px solid #1c1f26; border-radius:16px; margin-bottom:8px; cursor:pointer;">
                    <div style="font-size:24px;">${m.icon}</div>
                    <div><strong>${m.name}</strong></div>
                </div>
            `).join('');
            
            document.querySelectorAll('.payment-method').forEach(method => {
                method.onclick = () => {
                    document.querySelectorAll('.payment-method').forEach(m => m.style.borderColor = '#1c1f26');
                    method.style.borderColor = '#00d47e';
                    selectedMethod = method.getAttribute('data-method');
                    document.getElementById('screenshotSection').style.display = 'block';
                    
                    const amount = parseFloat(document.getElementById('depositAmount').value) || 0;
                    document.getElementById('paymentDetails').innerHTML = `<div class="address-text" style="background:#0a0a0c; padding:12px; border-radius:16px; margin-top:12px;"><strong>💰 Реквизиты для перевода:</strong><br>Сумма: ${amount} USD<br>После оплаты приложите чек</div>`;
                };
            });
            
            const amountInput = document.getElementById('depositAmount');
            amountInput.oninput = (e) => {
                depositAmount = parseFloat(e.target.value) || 0;
                if (selectedMethod) {
                    document.getElementById('paymentDetails').innerHTML = `<div class="address-text" style="background:#0a0a0c; padding:12px; border-radius:16px; margin-top:12px;"><strong>💰 Реквизиты для перевода:</strong><br>Сумма: ${depositAmount} USD<br>После оплаты приложите чек</div>`;
                }
            };
            
            const dropzone = document.getElementById('dropzone');
            const fileInput = document.getElementById('screenshotInput');
            dropzone.onclick = () => fileInput.click();
            fileInput.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        screenshotDataUrl = ev.target.result;
                        document.getElementById('screenshotPreview').innerHTML = `<div style="margin-top:12px; text-align:center;"><img src="${screenshotDataUrl}" style="max-width:100%; border-radius:16px;"><p style="color:var(--green-primary); margin-top:8px;">✅ Чек загружен</p></div>`;
                        dropzone.style.display = 'none';
                    };
                    reader.readAsDataURL(file);
                }
            };
            
            document.getElementById('modal').classList.add('active');
        }

        function submitDeposit() {
            const currency = document.getElementById('depositCurrency').value;
            const amount = parseFloat(document.getElementById('depositAmount').value);
            
            if (!amount || amount < 10) {
                tg.showAlert('❌ Введите сумму от 10 USD');
                return;
            }
            if (!selectedMethod) {
                tg.showAlert('❌ Выберите способ оплаты');
                return;
            }
            if (!screenshotDataUrl) {
                tg.showAlert('📸 Приложите чек перевода');
                return;
            }
            
            const pending = {
                id: Date.now(),
                userId: userId,
                userName: userName,
                amount: amount,
                currency: currency,
                method: selectedMethod,
                screenshot: screenshotDataUrl,
                date: new Date().toLocaleString(),
                status: 'pending'
            };
            
            userData.pendingPayments.unshift(pending);
            saveData();
            
            tg.showAlert(`✅ Заявка #${pending.id} отправлена на проверку администратору!`);
            closeModal();
            renderWallet();
        }

        // ========== ОТПРАВКА ==========
        function showSendModal() {
            document.getElementById('modalContent').innerHTML = `
                <h3 style="text-align:center;"><i class="fas fa-paper-plane"></i> Отправить</h3>
                <select id="sendCurrency" class="modal-input" style="width:100%; padding:14px; background:#0a0a0c; border:1px solid #1c1f26; border-radius:20px; color:white; margin-bottom:16px;">
                    ${Object.keys(userData.balance).map(c => `<option value="${c}">${c} (${userData.balance[c].toFixed(4)})</option>`).join('')}
                </select>
                <input type="text" id="sendToUser" class="modal-input" placeholder="👤 ID получателя или @username" style="width:100%; padding:14px; background:#0a0a0c; border:1px solid #1c1f26; border-radius:20px; color:white; margin-bottom:16px;">
                <input type="number" id="sendAmount" class="modal-input" placeholder="💸 Сумма" style="width:100%; padding:14px; background:#0a0a0c; border:1px solid #1c1f26; border-radius:20px; color:white; margin-bottom:16px;">
                <div class="modal-buttons" style="display:flex; gap:12px;">
                    <button class="modal-btn cancel" onclick="closeModal()">Отмена</button>
                    <button class="modal-btn confirm" onclick="sendToUser()">Отправить</button>
                </div>
            `;
            document.getElementById('modal').classList.add('active');
        }

        function sendToUser() {
            const currency = document.getElementById('sendCurrency').value;
            const toUser = document.getElementById('sendToUser').value;
            const amount = parseFloat(document.getElementById('sendAmount').value);
            
            if (!toUser || !amount || amount <= 0) {
                tg.showAlert('❌ Введите данные');
                return;
            }
            if (amount > userData.balance[currency]) {
                tg.showAlert(`❌ Недостаточно ${currency}!`);
                return;
            }
            
            tg.showConfirm(`Отправить ${amount} ${currency} пользователю ${toUser}?`, (confirmed) => {
                if (confirmed) {
                    userData.balance[currency] -= amount;
                    addTransaction('send', `Отправка ${currency}`, amount, currency, 'success', `Пользователю: ${toUser}`);
                    saveData();
                    tg.showAlert(`✅ Отправлено ${amount} ${currency}`);
                    closeModal();
                    renderWallet();
                    renderProfile();
                }
            });
        }

        // ========== ОБМЕН ==========
        function showSwapModal() {
            document.getElementById('modalContent').innerHTML = `
                <h3 style="text-align:center;"><i class="fas fa-exchange-alt"></i> Обмен валют</h3>
                <select id="swapFrom" class="modal-input" style="width:100%; padding:14px; background:#0a0a0c; border:1px solid #1c1f26; border-radius:20px; color:white; margin-bottom:16px;">
                    ${Object.keys(userData.balance).map(c => `<option value="${c}">${c} (${userData.balance[c].toFixed(4)})</option>`).join('')}
                </select>
                <input type="number" id="swapAmount" class="modal-input" placeholder="Сумма" style="width:100%; padding:14px; background:#0a0a0c; border:1px solid #1c1f26; border-radius:20px; color:white; margin-bottom:16px;">
                <select id="swapTo" class="modal-input" style="width:100%; padding:14px; background:#0a0a0c; border:1px solid #1c1f26; border-radius:20px; color:white; margin-bottom:16px;">
                    <option value="USDT">USDT</option>
                    <option value="USDC">USDC</option>
                    <option value="BTC">BTC</option>
                    <option value="ETH">ETH</option>
                    <option value="TON">TON</option>
                    <option value="RUB">RUB</option>
                </select>
                <div id="swapInfo" style="background:rgba(10,10,12,0.6); border-radius:20px; padding:16px; margin:12px 0;"></div>
                <div class="modal-buttons" style="display:flex; gap:12px;">
                    <button class="modal-btn cancel" onclick="closeModal()">Отмена</button>
                    <button class="modal-btn confirm" onclick="executeSwap()">Обменять</button>
                </div>
            `;
            
            function updateSwap() {
                const from = document.getElementById('swapFrom').value;
                const to = document.getElementById('swapTo').value;
                const amount = parseFloat(document.getElementById('swapAmount').value) || 0;
                const rate = exchangeRates[to] / exchangeRates[from];
                const result = amount * rate;
                const commission = result * 0.002;
                document.getElementById('swapInfo').innerHTML = `
                    <div style="display:flex; justify-content:space-between;"><span>Курс</span><span>1 ${from} = ${rate.toFixed(4)} ${to}</span></div>
                    <div style="display:flex; justify-content:space-between; margin-top:8px;"><span>Вы получите</span><span style="color:var(--green-primary);">${(result - commission).toFixed(6)} ${to}</span></div>
                    <div style="display:flex; justify-content:space-between;"><span>Комиссия (0.2%)</span><span>${commission.toFixed(6)} ${to}</span></div>
                `;
            }
            
            document.getElementById('swapFrom').onchange = updateSwap;
            document.getElementById('swapTo').onchange = updateSwap;
            document.getElementById('swapAmount').oninput = updateSwap;
            updateSwap();
            document.getElementById('modal').classList.add('active');
        }

        function executeSwap() {
            const from = document.getElementById('swapFrom').value;
            const to = document.getElementById('swapTo').value;
            const amount = parseFloat(document.getElementById('swapAmount').value);
            
            if (!amount || amount <= 0) {
                tg.showAlert('Введите сумму');
                return;
            }
            if (amount > userData.balance[from]) {
                tg.showAlert(`Недостаточно ${from}!`);
                return;
            }
            
            const rate = exchangeRates[to] / exchangeRates[from];
            const result = amount * rate;
            const commission = result * 0.002;
            const finalAmount = result - commission;
            
            tg.showConfirm(`Обменять ${amount} ${from} на ${finalAmount.toFixed(6)} ${to}?`, (confirmed) => {
                if (confirmed) {
                    userData.balance[from] -= amount;
                    userData.balance[to] = (userData.balance[to] || 0) + finalAmount;
                    addTransaction('swap', `Обмен ${from}→${to}`, amount, from, 'success', `Получено ${finalAmount.toFixed(6)} ${to}`);
                    saveData();
                    tg.showAlert(`✅ Обмен выполнен! Получено ${finalAmount.toFixed(6)} ${to}`);
                    closeModal();
                    renderWallet();
                    renderProfile();
                }
            });
        }

        function showHistoryModal() {
            document.getElementById('modalContent').innerHTML = `
                <h3 style="text-align:center;"><i class="fas fa-history"></i> История операций</h3>
                <div style="max-height:400px; overflow-y:auto;">
                    ${userData.transactions.map(tx => `
                        <div style="display:flex; justify-content:space-between; padding:12px; border-bottom:1px solid var(--border);">
                            <div><strong>${tx.title}</strong><br><small>${tx.date}</small><br><small>${tx.details || ''}</small></div>
                            <div><span class="status-badge ${tx.status === 'success' ? 'status-approved' : 'status-pending'}">${tx.status === 'success' ? '✅' : '⏳'}</span></div>
                        </div>
                    `).join('')}
                </div>
                <button class="modal-btn cancel" onclick="closeModal()">Закрыть</button>
            `;
            document.getElementById('modal').classList.add('active');
        }

        // ========== БИРЖА ==========
        function renderExchange() {
            const change = ((currentPrice - 0.99) / 0.99 * 100).toFixed(2);
            document.getElementById('app').innerHTML = `
                <div class="fade-enter">
                    <div class="wallet-header">
                        <div class="price-header" style="display:flex; justify-content:space-between;">
                            <span class="price-pair" style="font-size:20px; font-weight:700;">USDC / USDT</span>
                            <span class="price-change ${change >= 0 ? 'up' : 'down'}" style="padding:4px 12px; border-radius:20px; background:${change >= 0 ? 'rgba(0,212,126,0.15)' : 'rgba(255,71,87,0.15)'};">${change >= 0 ? `+${change}%` : `${change}%`}</span>
                        </div>
                        <div class="price-main" style="font-size:42px; font-weight:800; margin:16px 0;">${currentPrice.toFixed(4)}</div>
                        <div style="display:flex; gap:20px;"><div><div style="font-size:11px; color:var(--text-secondary);">Объём 24ч</div><div>22,051 USDT</div></div></div>
                    </div>
                    
                    <div class="trade-buttons" style="display:flex; gap:12px; margin-bottom:20px;">
                        <button class="trade-btn buy" data-mode="buy" style="flex:1; padding:16px; border-radius:28px; background:linear-gradient(135deg, #00d47e, #00995a); border:none; color:white; font-weight:700;">📈 Купить</button>
                        <button class="trade-btn sell" data-mode="sell" style="flex:1; padding:16px; border-radius:28px; background:linear-gradient(135deg, #ff4757, #cc3b4a); border:none; color:white; font-weight:700;">📉 Продать</button>
                    </div>
                    
                    <div class="wallet-header" style="padding:20px;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:12px;"><span>Цена</span><span>${currentPrice.toFixed(4)} USDT</span></div>
                        <input type="number" id="tradeAmount" class="modal-input" placeholder="Сумма в USDC" style="width:100%; padding:14px; background:#0a0a0c; border:1px solid #1c1f26; border-radius:20px; color:white; margin-bottom:12px;">
                        <div class="percentage-buttons" style="display:flex; gap:8px; margin-bottom:16px;">
                            <button class="perc-btn" data-percent="0.25" style="flex:1; padding:10px; background:#0a0a0c; border:1px solid #1c1f26; border-radius:16px;">25%</button>
                            <button class="perc-btn" data-percent="0.5" style="flex:1; padding:10px; background:#0a0a0c; border:1px solid #1c1f26; border-radius:16px;">50%</button>
                            <button class="perc-btn" data-percent="0.75" style="flex:1; padding:10px; background:#0a0a0c; border:1px solid #1c1f26; border-radius:16px;">75%</button>
                            <button class="perc-btn" data-percent="1" style="flex:1; padding:10px; background:#0a0a0c; border:1px solid #1c1f26; border-radius:16px;">100%</button>
                        </div>
                        <div style="background:#0a0a0c; border-radius:16px; padding:12px; margin-bottom:12px; display:flex; justify-content:space-between;"><span>Всего</span><span id="totalValue">0 USDT</span></div>
                        <div style="background:#0a0a0c; border-radius:16px; padding:12px; display:flex; justify-content:space-between;"><span>Комиссия (0.1%)</span><span id="commission">0 USDT</span></div>
                        <button id="executeTradeBtn" class="trade-btn buy" style="margin-top:20px; width:100%; padding:16px; border-radius:28px; background:linear-gradient(135deg, #00d47e, #00995a); border:none; color:white; font-weight:700;">Купить USDC</button>
                    </div>
                </div>
            `;
            
            let mode = 'buy';
            function updateTotal() {
                const amount = parseFloat(document.getElementById('tradeAmount')?.value) || 0;
                const total = amount * currentPrice;
                document.getElementById('totalValue').innerHTML = `${total.toFixed(2)} USDT`;
                document.getElementById('commission').innerHTML = `${(total * 0.001).toFixed(4)} USDT`;
            }
            document.getElementById('tradeAmount').oninput = updateTotal;
            document.querySelectorAll('.perc-btn').forEach(btn => {
                btn.onclick = () => {
                    const percent = parseFloat(btn.getAttribute('data-percent'));
                    const available = mode === 'buy' ? userData.balance.USDT / currentPrice : userData.balance.USDC;
                    document.getElementById('tradeAmount').value = (available * percent).toFixed(4);
                    updateTotal();
                };
            });
            document.querySelectorAll('.trade-btn').forEach(btn => {
                btn.onclick = () => {
                    mode = btn.getAttribute('data-mode');
                    const execBtn = document.getElementById('executeTradeBtn');
                    execBtn.textContent = mode === 'buy' ? `Купить USDC` : `Продать USDC`;
                    execBtn.className = `trade-btn ${mode}`;
                };
            });
            document.getElementById('executeTradeBtn').onclick = () => {
                const amount = parseFloat(document.getElementById('tradeAmount').value) || 0;
                if (amount <= 0) { tg.showAlert('Введите сумму'); return; }
                const total = amount * currentPrice;
                const commission = total * 0.001;
                if (mode === 'buy') {
                    if (userData.balance.USDT >= total + commission) {
                        userData.balance.USDT -= total + commission;
                        userData.balance.USDC += amount;
                        addTransaction('buy', 'Покупка USDC', amount, 'USDC', 'success', `Цена ${currentPrice} USDT`);
                        tg.showAlert(`✅ Куплено ${amount.toFixed(4)} USDC`);
                    } else { tg.showAlert(`❌ Недостаточно USDT!`); return; }
                } else {
                    if (userData.balance.USDC >= amount) {
                        userData.balance.USDC -= amount;
                        userData.balance.USDT += total - commission;
                        addTransaction('sell', 'Продажа USDC', amount, 'USDC', 'success', `Цена ${currentPrice} USDT`);
                        tg.showAlert(`✅ Продано ${amount.toFixed(4)} USDC`);
                    } else { tg.showAlert(`❌ Недостаточно USDC!`); return; }
                }
                saveData();
                renderWallet();
                renderExchange();
            };
        }

        // ========== КОШЕЛЕК ==========
        function renderWallet() {
            const totalDisplay = formatDisplayBalance();
            
            document.getElementById('app').innerHTML = `
                <div class="wallet-header fade-enter">
                    <div class="wallet-balance-label">Общий баланс</div>
                    <div class="wallet-balance">${totalDisplay}</div>
                    <div class="currency-selector" id="displayCurrencySelector" style="background:rgba(10,10,12,0.8); border:1px solid rgba(0,212,126,0.3); border-radius:50px; padding:10px 20px; display:inline-flex; align-items:center; gap:10px; cursor:pointer; margin-top:12px;">
                        <i class="fas fa-exchange-alt"></i>
                        <span>Показать в ${userData.displayCurrency === 'USD' ? 'RUB' : 'USD'}</span>
                    </div>
                </div>
                <div class="assets-grid">
                    ${Object.entries(userData.balance).map(([cur, val], i) => {
                        let iconHtml = currencyIcons[cur] || '💰';
                        let usdValue = val * (exchangeRates[cur] || 0);
                        let displayValue = userData.displayCurrency === 'RUB' ? usdValue * USD_TO_RUB : usdValue;
                        let displaySymbol = userData.displayCurrency === 'RUB' ? '₽' : '$';
                        let formattedAmount = cur === 'BTC' ? val.toFixed(6) : (cur === 'ETH' ? val.toFixed(4) : val.toFixed(2));
                        return `
                            <div class="asset-card" style="animation-delay: ${i * 0.05}s">
                                <div class="asset-icon">${iconHtml}</div>
                                <div class="asset-name">${cur}</div>
                                <div class="asset-amount">${formattedAmount}</div>
                                <div style="font-size:11px; color:var(--text-secondary);">≈ ${displaySymbol}${displayValue.toFixed(2)}</div>
                            </div>
                        `;
                    }).join('')}
                </div>
                <div class="actions-grid">
                    <div class="action-btn" data-action="send"><div class="action-icon"><i class="fas fa-paper-plane"></i></div><div class="action-label">Отправить</div></div>
                    <div class="action-btn" data-action="deposit"><div class="action-icon"><i class="fas fa-plus-circle"></i></div><div class="action-label">Пополнить</div></div>
                    <div class="action-btn" data-action="swap"><div class="action-icon"><i class="fas fa-exchange-alt"></i></div><div class="action-label">Обменять</div></div>
                    <div class="action-btn" data-action="history"><div class="action-icon"><i class="fas fa-history"></i></div><div class="action-label">История</div></div>
                </div>
                ${isAdmin ? `
                    <div class="action-btn" id="adminPanelBtn" style="background:linear-gradient(135deg, #ff9800, #ff5722); margin-bottom:16px;">
                        <i class="fas fa-crown"></i> Админ-панель
                    </div>
                ` : ''}
                <div class="section-header"><div class="section-title">Последние операции</div></div>
                <div class="transactions-list">
                    ${userData.transactions.slice(0,5).map(tx => `
                        <div class="transaction-item">
                            <div class="transaction-left" style="display:flex; align-items:center; gap:12px;">
                                <div class="transaction-icon" style="width:44px; height:44px; background:#0a0a0c; border-radius:50%; display:flex; align-items:center; justify-content:center;"><i class="fas ${tx.type === 'deposit' ? 'fa-arrow-down' : (tx.type === 'send' ? 'fa-arrow-up' : 'fa-exchange-alt')}"></i></div>
                                <div class="transaction-info"><h4>${tx.title}</h4><p>${tx.date}</p></div>
                            </div>
                            <div><span class="status-approved" style="background:var(--green-primary); padding:4px 10px; border-radius:20px;">✅</span></div>
                        </div>
                    `).join('')}
                </div>
            `;
            
            document.getElementById('displayCurrencySelector').onclick = toggleDisplayCurrency;
            document.querySelectorAll('.action-btn').forEach(btn => {
                const action = btn.getAttribute('data-action');
                if (action === 'send') btn.onclick = showSendModal;
                else if (action === 'deposit') btn.onclick = showDepositModal;
                else if (action === 'swap') btn.onclick = showSwapModal;
                else if (action === 'history') btn.onclick = showHistoryModal;
            });
            if (isAdmin) {
                document.getElementById('adminPanelBtn').onclick = showAdminPanel;
            }
        }

        // ========== ПРОФИЛЬ ==========
        function renderProfile() {
            const totalDepositsDisplay = userData.displayCurrency === 'RUB' 
                ? (userData.totalDepositsUSD * USD_TO_RUB).toFixed(2) 
                : userData.totalDepositsUSD.toFixed(2);
            const depositSymbol = userData.displayCurrency === 'RUB' ? '₽' : '$';
            
            document.getElementById('app').innerHTML = `
                <div class="wallet-header fade-enter" style="text-align:center;">
                    <div style="width:80px;height:80px;background:linear-gradient(135deg,var(--green-primary),#00995a);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;"><i class="fas fa-user-circle" style="font-size:44px; color:white;"></i></div>
                    <h3><i class="fas fa-user"></i> ${userName}</h3>
                    <p style="color:var(--text-secondary); margin-top:4px;"><i class="fas fa-id-card"></i> ID: ${userId}</p>
                </div>
                <div class="assets-grid" style="grid-template-columns:repeat(2,1fr);">
                    <div class="asset-card"><div class="asset-icon"><i class="fas fa-chart-line" style="font-size:28px; color:var(--green-primary);"></i></div><div class="asset-name">Всего пополнений</div><div class="asset-amount">${depositSymbol}${totalDepositsDisplay}</div></div>
                    <div class="asset-card"><div class="asset-icon"><i class="fas fa-check-circle" style="font-size:28px; color:var(--green-primary);"></i></div><div class="asset-name">Успешных</div><div class="asset-amount">${userData.successfulDeposits}</div></div>
                    <div class="asset-card"><div class="asset-icon"><i class="fas fa-times-circle" style="font-size:28px; color:var(--red);"></i></div><div class="asset-name">Неуспешных</div><div class="asset-amount">${userData.failedDeposits}</div></div>
                    <div class="asset-card"><div class="asset-icon"><i class="fas fa-exchange-alt" style="font-size:28px; color:var(--blue);"></i></div><div class="asset-name">Операций</div><div class="asset-amount">${userData.transactions.length}</div></div>
                </div>
                <div class="section-header"><div class="section-title"><i class="fas fa-clock"></i> Мои заявки</div></div>
                <div class="transactions-list">
                    ${userData.pendingPayments.slice(0,5).map(p => `
                        <div class="transaction-item">
                            <div class="transaction-left" style="display:flex; align-items:center; gap:12px;">
                                <div class="transaction-icon"><i class="fas fa-clock"></i></div>
                                <div class="transaction-info">
                                    <h4>Заявка #${p.id}</h4>
                                    <p>${p.amount} USD | ${p.date}</p>
                                </div>
                            </div>
                            <div><span class="${p.status === 'approved' ? 'status-approved' : 'status-pending'}">${p.status === 'approved' ? '✅ Одобрено' : '⏳ Ожидает'}</span></div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Навигация
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', () => {
                currentTab = btn.getAttribute('data-tab');
                document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if (currentTab === 'wallet') renderWallet();
                else if (currentTab === 'exchange') renderExchange();
                else if (currentTab === 'profile') renderProfile();
            });
        });

        renderWallet();

        // Обновление цены
        setInterval(() => {
            currentPrice += (Math.random() - 0.5) * 0.0005;
            currentPrice = Math.max(0.98, Math.min(1.01, currentPrice));
            if (currentTab === 'exchange') renderExchange();
        }, 4000);
    </script>
</body>
</html>
