<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Crypto Bot - Премиум интерфейс</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-dark: #0a0a0c;
            --bg-card: rgba(19, 21, 26, 0.8);
            --green-primary: #00d47e;
            --green-glow: rgba(0, 212, 126, 0.3);
            --blue: #3b82f6;
            --blue-glow: rgba(59, 130, 246, 0.3);
            --purple: #9c27b0;
            --purple-glow: rgba(156, 39, 176, 0.3);
            --red: #ff4757;
            --orange: #ff9800;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --border: rgba(28, 31, 38, 0.5);
        }

        body {
            background: var(--bg-dark);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Анимированные частицы фона */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, var(--green-primary), transparent);
            border-radius: 50%;
            opacity: 0;
            animation: floatParticle 8s infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100vh) scale(1);
                opacity: 0;
            }
        }

        .content {
            padding: 20px;
            padding-bottom: 85px;
            animation: fadeInUp 0.4s ease-out;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Крутая карточка баланса */
        .balance-card {
            background: linear-gradient(135deg, rgba(19, 21, 26, 0.9) 0%, rgba(13, 15, 20, 0.95) 100%);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 28px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 212, 126, 0.2);
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .balance-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, var(--green-glow) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .balance-card:hover::before {
            opacity: 0.1;
        }

        .balance-glow {
            position: absolute;
            top: -20px;
            right: -20px;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, var(--green-glow), transparent);
            border-radius: 50%;
            opacity: 0.3;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.2); opacity: 0.5; }
        }

        .balance-label {
            font-size: 14px;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }

        .balance-amount {
            font-size: 52px;
            font-weight: 800;
            margin: 12px 0;
            background: linear-gradient(135deg, #fff 0%, var(--green-primary) 40%, #fff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* Крутой селектор валюты */
        .currency-selector {
            background: rgba(10, 10, 12, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 126, 0.3);
            border-radius: 50px;
            padding: 10px 20px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .currency-selector:hover {
            border-color: var(--green-primary);
            transform: scale(1.02);
            box-shadow: 0 0 20px var(--green-glow);
        }

        .currency-selector span {
            font-weight: 600;
        }

        /* Анимированный грид валют */
        .currency-grid-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeInUp 0.3s ease;
        }

        .currency-grid-modal.active {
            display: flex;
        }

        .currency-grid-container {
            background: linear-gradient(135deg, #13151a, #0d0f14);
            border-radius: 48px;
            padding: 24px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(0, 212, 126, 0.3);
            position: relative;
        }

        .currency-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 20px;
        }

        .currency-card {
            background: rgba(10, 10, 12, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .currency-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 126, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .currency-card:hover::before {
            left: 100%;
        }

        .currency-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: var(--green-primary);
            box-shadow: 0 10px 30px rgba(0, 212, 126, 0.2);
        }

        .currency-card.selected {
            border-color: var(--green-primary);
            background: linear-gradient(135deg, rgba(0, 212, 126, 0.15), rgba(0, 212, 126, 0.05));
            box-shadow: 0 0 20px var(--green-glow);
        }

        .currency-symbol {
            font-size: 40px;
            margin-bottom: 8px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        .currency-card:hover .currency-symbol {
            animation: bounce 0.5s ease;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .currency-name {
            font-size: 16px;
            font-weight: 600;
            margin: 4px 0;
        }

        .currency-price {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* Кнопка загрузки чека */
        .upload-receipt-btn {
            background: linear-gradient(135deg, var(--purple), #7c1d99);
            border: none;
            border-radius: 30px;
            padding: 14px 24px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .upload-receipt-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .upload-receipt-btn:active::before {
            width: 300px;
            height: 300px;
        }

        .upload-receipt-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(156, 39, 176, 0.4);
        }

        /* 3D график */
        .chart-3d {
            background: linear-gradient(135deg, #0a0a0c, #13151a);
            border-radius: 32px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .chart-3d:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 40px rgba(0, 212, 126, 0.15);
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .chart-title {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .chart-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--green-primary);
        }

        canvas {
            width: 100%;
            height: 180px;
            border-radius: 16px;
        }

        .chart-stats {
            display: flex;
            gap: 20px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .chart-stat {
            flex: 1;
            text-align: center;
        }

        .chart-stat-label {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .chart-stat-value {
            font-size: 14px;
            font-weight: 600;
            margin-top: 4px;
        }

        .chart-stat-value.up { color: var(--green-primary); }
        .chart-stat-value.down { color: var(--red); }

        /* Остальные стили */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .action-btn {
            background: rgba(19, 21, 26, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-icon {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .stats-row {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            flex: 1;
            background: rgba(19, 21, 26, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 16px;
            border: 1px solid var(--border);
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            margin-top: 8px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
        }

        .transactions-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .transaction-item {
            background: rgba(19, 21, 26, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .transaction-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .transaction-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #1a1d24, #0d0f14);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 17, 21, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 16px calc(12px + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid var(--border);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 10px;
            transition: all 0.2s ease;
            padding: 8px 16px;
            border-radius: 30px;
            background: transparent;
            border: none;
        }

        .nav-item i {
            font-size: 22px;
        }

        .nav-item.active {
            color: var(--green-primary);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(12px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #13151a, #0d0f14);
            border-radius: 40px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(0, 212, 126, 0.3);
            max-height: 90vh;
            overflow-y: auto;
        }

        .receipt-preview {
            background: rgba(10, 10, 12, 0.8);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin: 16px 0;
        }

        .receipt-preview img {
            max-width: 100%;
            border-radius: 16px;
        }

        .dropzone {
            border: 2px dashed var(--border);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 16px 0;
        }

        .dropzone:hover {
            border-color: var(--green-primary);
            background: rgba(0, 212, 126, 0.05);
        }

        .close-grid-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            color: white;
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="content" id="app"></div>

    <div class="bottom-nav">
        <button class="nav-item active" data-tab="wallet"><i class="fas fa-wallet"></i><span>Кошелёк</span></button>
        <button class="nav-item" data-tab="charts"><i class="fas fa-chart-line"></i><span>Графики</span></button>
        <button class="nav-item" data-tab="swap"><i class="fas fa-exchange-alt"></i><span>Обмен</span></button>
        <button class="nav-item" data-tab="more"><i class="fas fa-user"></i><span>Профиль</span></button>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <div class="currency-grid-modal" id="currencyGridModal">
        <div class="currency-grid-container">
            <button class="close-grid-btn" onclick="closeCurrencyGrid()"><i class="fas fa-times"></i></button>
            <h3 style="text-align:center;"><i class="fas fa-coins"></i> Выберите валюту</h3>
            <div class="currency-grid" id="currencyGrid"></div>
        </div>
    </div>

    <script>
        // Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();
        tg.ready();

        // Частицы
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.width = particle.style.height = Math.random() * 4 + 2 + 'px';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.animationDuration = Math.random() * 5 + 5 + 's';
                container.appendChild(particle);
            }
        }
        createParticles();

        const user = tg.initDataUnsafe?.user;
        const userName = user ? `${user.first_name} ${user.last_name || ''}` : 'Гость';
        const userId = user ? user.id : Math.floor(Math.random() * 1000000);

        // Курсы
        const USD_TO_RUB = 90;
        const exchangeRates = {
            TON: 5.67, BTC: 67890, ETH: 3456, USDT: 1.00, BNB: 580,
            SOL: 140, TRX: 0.11, LTC: 82, DOGE: 0.12, XRP: 0.62, RUB: 1.00
        };

        const currencyIcons = {
            TON: '💎', BTC: '₿', ETH: 'Ξ', USDT: '💰', BNB: '🔶',
            SOL: '◎', TRX: 'TRX', LTC: 'Ł', DOGE: 'Ð', XRP: 'XRP', RUB: '₽'
        };

        let userData = {
            balance: 1284.50,
            currency: 'TON',
            staking: 350,
            totalEarned: 42.5,
            transactions: [
                { id: Date.now() - 3600000, type: "send", title: "Отправлено", address: "0x742...3ef", amount: -50.25, date: new Date(Date.now() - 3600000).toLocaleString(), coin: "TON" },
                { id: Date.now() - 86400000, type: "receive", title: "Получено", address: "Биржа Bybit", amount: 125.00, date: new Date(Date.now() - 86400000).toLocaleString(), coin: "TON" }
            ],
            pendingPayments: [],
            swaps: [],
            referralCode: `CRYPTO${userId}`
        };

        let currentTab = 'wallet';

        // Генерация данных для 3D графика
        function generateChartData() {
            const data = [];
            let base = 5.5;
            for (let i = 0; i < 50; i++) {
                base += (Math.random() - 0.5) * 0.15;
                data.push(base);
            }
            return data;
        }

        let chartData = generateChartData();

        // Функции
        function getBalanceInUSD() {
            if (userData.currency === 'RUB') return userData.balance / USD_TO_RUB;
            return userData.balance * exchangeRates[userData.currency];
        }

        function formatBalance() {
            if (userData.currency === 'RUB') return `${userData.balance.toFixed(2)} ₽`;
            return `${userData.balance.toFixed(4)} ${userData.currency}`;
        }

        function addTransaction(type, title, address, amount, coin = null) {
            userData.transactions.unshift({
                id: Date.now(),
                type: type,
                title: title,
                address: address,
                amount: amount,
                date: new Date().toLocaleString(),
                coin: coin || userData.currency
            });
            if (userData.transactions.length > 20) userData.transactions.pop();
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function closeCurrencyGrid() {
            document.getElementById('currencyGridModal').classList.remove('active');
        }

        function showCurrencyGrid() {
            const grid = document.getElementById('currencyGrid');
            const currencies = Object.keys(exchangeRates);
            grid.innerHTML = currencies.map(curr => `
                <div class="currency-card ${userData.currency === curr ? 'selected' : ''}" data-currency="${curr}">
                    <div class="currency-symbol">${currencyIcons[curr]}</div>
                    <div class="currency-name">${curr}</div>
                    <div class="currency-price">${curr === 'RUB' ? `${USD_TO_RUB} ₽` : `$${exchangeRates[curr]}`}</div>
                </div>
            `).join('');
            
            document.querySelectorAll('.currency-card').forEach(card => {
                card.onclick = () => {
                    const newCurrency = card.getAttribute('data-currency');
                    const oldBalanceUSD = getBalanceInUSD();
                    userData.currency = newCurrency;
                    userData.balance = newCurrency === 'RUB' ? oldBalanceUSD * USD_TO_RUB : oldBalanceUSD / exchangeRates[newCurrency];
                    updateBalanceDisplay();
                    if (currentTab === 'wallet') renderWallet();
                    closeCurrencyGrid();
                    tg.showAlert(`Валюта изменена на ${newCurrency}`);
                };
            });
            
            document.getElementById('currencyGridModal').classList.add('active');
        }

        // Новый 3D график
        function draw3DChart() {
            const canvas = document.getElementById('cryptoChart');
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            canvas.width = width;
            canvas.height = height;
            
            const padding = { top: 20, right: 20, bottom: 30, left: 40 };
            const chartWidth = width - padding.left - padding.right;
            const chartHeight = height - padding.top - padding.bottom;
            
            const maxValue = Math.max(...chartData);
            const minValue = Math.min(...chartData);
            const range = maxValue - minValue;
            
            ctx.clearRect(0, 0, width, height);
            
            // Градиентный фон
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, 'rgba(0, 212, 126, 0.15)');
            gradient.addColorStop(1, 'rgba(0, 212, 126, 0)');
            
            // Рисуем заполнение под графиком
            ctx.beginPath();
            let first = true;
            chartData.forEach((value, index) => {
                const x = padding.left + (chartWidth / (chartData.length - 1)) * index;
                const y = padding.top + chartHeight - ((value - minValue) / range) * chartHeight;
                if (first) {
                    ctx.moveTo(x, y);
                    first = false;
                } else {
                    ctx.lineTo(x, y);
                }
            });
            ctx.lineTo(padding.left + chartWidth, padding.top + chartHeight);
            ctx.lineTo(padding.left, padding.top + chartHeight);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Рисуем линию графика
            ctx.beginPath();
            first = true;
            chartData.forEach((value, index) => {
                const x = padding.left + (chartWidth / (chartData.length - 1)) * index;
                const y = padding.top + chartHeight - ((value - minValue) / range) * chartHeight;
                if (first) {
                    ctx.moveTo(x, y);
                    first = false;
                } else {
                    ctx.lineTo(x, y);
                }
            });
            ctx.strokeStyle = '#00d47e';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // Рисуем точки на графике
            chartData.forEach((value, index) => {
                const x = padding.left + (chartWidth / (chartData.length - 1)) * index;
                const y = padding.top + chartHeight - ((value - minValue) / range) * chartHeight;
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, 2 * Math.PI);
                ctx.fillStyle = '#00d47e';
                ctx.fill();
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00d47e';
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, 2 * Math.PI);
                ctx.fillStyle = 'rgba(0, 212, 126, 0.3)';
                ctx.fill();
                ctx.shadowBlur = 0;
            });
            
            // Рисуем сетку
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= 4; i++) {
                const y = padding.top + (chartHeight / 4) * i;
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(padding.left + chartWidth, y);
                ctx.stroke();
            }
            
            // Подписи значений
            ctx.fillStyle = '#8e8e93';
            ctx.font = '10px system-ui';
            for (let i = 0; i <= 4; i++) {
                const value = maxValue - (range / 4) * i;
                const y = padding.top + (chartHeight / 4) * i;
                ctx.fillText(value.toFixed(2), 5, y + 3);
            }
            
            // Последнее значение
            const lastValue = chartData[chartData.length - 1];
            const change = ((lastValue - chartData[0]) / chartData[0] * 100).toFixed(2);
            document.getElementById('currentPrice')?.setAttribute('data-value', lastValue.toFixed(2));
            document.getElementById('priceChange')?.setAttribute('data-value', change);
        }

        // Кнопка загрузки чека
        let screenshotDataUrl = null;
        let selectedPaymentMethod = null;
        let depositAmount = 0;

        function showDepositModal() {
            selectedPaymentMethod = null;
            depositAmount = 0;
            screenshotDataUrl = null;
            
            document.getElementById('modalContent').innerHTML = `
                <h3><i class="fas fa-plus-circle"></i> Пополнение баланса</h3>
                <input type="number" id="depositAmount" class="modal-input" placeholder="Сумма в USD" style="width:100%; padding:14px; background:#0a0a0c; border:1px solid #1c1f26; border-radius:16px; color:white; margin-bottom:16px;">
                <div style="margin:16px 0;">
                    <div style="margin-bottom:12px;">Способ оплаты:</div>
                    <div id="paymentMethodsList"></div>
                </div>
                <div id="paymentDetails"></div>
                <div id="screenshotSection" style="display:none;">
                    <div class="dropzone" id="dropzone">
                        <i class="fas fa-cloud-upload-alt" style="font-size:40px; margin-bottom:10px;"></i>
                        <p>Нажмите или перетащите чек сюда</p>
                        <p style="font-size:11px; color:var(--text-secondary);">PNG, JPG до 5MB</p>
                        <input type="file" id="screenshotInput" accept="image/*" style="display:none;">
                    </div>
                    <div id="screenshotPreview"></div>
                </div>
                <div class="modal-buttons" style="display:flex; gap:12px; margin-top:20px;">
                    <button class="modal-btn cancel" onclick="closeModal()" style="flex:1; padding:14px; background:#1c1f26; border:none; border-radius:16px;">Отмена</button>
                    <button class="modal-btn confirm" onclick="submitPayment()" style="flex:1; padding:14px; background:linear-gradient(135deg, #00d47e, #00995a); border:none; border-radius:16px; color:white; font-weight:600;">Отправить</button>
                </div>
            `;
            
            const paymentMethods = [
                { id: 'card', name: 'Банковская карта', icon: '💳' },
                { id: 'sbp', name: 'СБП', icon: '🏦' },
                { id: 'ton', name: 'TON', icon: '💎' },
                { id: 'usdt', name: 'USDT', icon: '💰' }
            ];
            
            document.getElementById('paymentMethodsList').innerHTML = paymentMethods.map(m => `
                <div class="payment-method" data-method="${m.id}" style="display:flex; align-items:center; gap:12px; padding:12px; background:#0a0a0c; border:1px solid #1c1f26; border-radius:16px; margin-bottom:8px; cursor:pointer;">
                    <div style="font-size:24px;">${m.icon}</div>
                    <div><strong>${m.name}</strong></div>
                </div>
            `).join('');
            
            document.querySelectorAll('.payment-method').forEach(method => {
                method.onclick = () => {
                    document.querySelectorAll('.payment-method').forEach(m => m.style.borderColor = '#1c1f26');
                    method.style.borderColor = '#00d47e';
                    selectedPaymentMethod = method.getAttribute('data-method');
                    document.getElementById('screenshotSection').style.display = 'block';
                    showPaymentDetails();
                };
            });
            
            const amountInput = document.getElementById('depositAmount');
            amountInput.oninput = (e) => { depositAmount = parseFloat(e.target.value) || 0; if (selectedPaymentMethod) showPaymentDetails(); };
            
            const dropzone = document.getElementById('dropzone');
            const fileInput = document.getElementById('screenshotInput');
            
            dropzone.onclick = () => fileInput.click();
            dropzone.ondragover = (e) => { e.preventDefault(); dropzone.style.borderColor = '#00d47e'; };
            dropzone.ondragleave = () => dropzone.style.borderColor = '#1c1f26';
            dropzone.ondrop = (e) => {
                e.preventDefault();
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) handleReceiptFile(file);
                dropzone.style.borderColor = '#1c1f26';
            };
            
            fileInput.onchange = (e) => {
                if (e.target.files[0]) handleReceiptFile(e.target.files[0]);
            };
            
            document.getElementById('modal').classList.add('active');
        }
        
        function handleReceiptFile(file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                screenshotDataUrl = event.target.result;
                const preview = document.getElementById('screenshotPreview');
                preview.innerHTML = `<div class="receipt-preview"><img src="${screenshotDataUrl}"><p style="margin-top:8px; color:var(--green-primary);">✅ Чек загружен</p></div>`;
                document.getElementById('dropzone').style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
        
        function showPaymentDetails() {
            const amount = depositAmount;
            const detailsDiv = document.getElementById('paymentDetails');
            if (!amount || amount < 10) {
                detailsDiv.innerHTML = '<div style="color:var(--red);">Минимальная сумма: 10 USD</div>';
                return;
            }
            detailsDiv.innerHTML = `<div class="address-text" style="background:#0a0a0c; padding:12px; border-radius:12px; margin-top:12px;"><strong>💰 Реквизиты для перевода:</strong><br>Сумма: ${amount} USD<br>После оплаты приложите чек</div>`;
        }
        
        function submitPayment() {
            if (!depositAmount || depositAmount < 10) { tg.showAlert('❌ Введите сумму'); return; }
            if (!selectedPaymentMethod) { tg.showAlert('❌ Выберите способ оплаты'); return; }
            if (!screenshotDataUrl) { tg.showAlert('📸 Приложите чек'); return; }
            
            const cryptoAmount = depositAmount / exchangeRates[userData.currency];
            userData.balance += cryptoAmount;
            addTransaction('receive', 'Пополнение', selectedPaymentMethod.toUpperCase(), cryptoAmount);
            updateBalanceDisplay();
            if (currentTab === 'wallet') renderWallet();
            tg.showAlert(`✅ Баланс пополнен на ${cryptoAmount.toFixed(4)} ${userData.currency}!`);
            closeModal();
        }
        
        function updateBalanceDisplay() {
            const balanceEl = document.querySelector('.balance-amount');
            if (balanceEl) balanceEl.innerHTML = formatBalance();
        }
        
        // Рендер
        function renderWallet() {
            document.getElementById('app').innerHTML = `
                <div class="balance-card">
                    <div class="balance-glow"></div>
                    <div class="balance-label">Общий баланс</div>
                    <div class="balance-amount">${formatBalance()}</div>
                    <div class="currency-selector" id="currencySelector">
                        <i class="fas fa-exchange-alt"></i>
                        <span>${userData.currency}</span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
                <div class="actions-grid">
                    <div class="action-btn" data-action="send"><div class="action-icon"><i class="fas fa-paper-plane"></i></div><div class="action-label">Отправить</div></div>
                    <div class="action-btn" data-action="receive"><div class="action-icon"><i class="fas fa-qrcode"></i></div><div class="action-label">Получить</div></div>
                    <div class="action-btn" data-action="deposit"><div class="action-icon"><i class="fas fa-plus-circle"></i></div><div class="action-label">Пополнить</div></div>
                    <div class="action-btn" data-action="history"><div class="action-icon"><i class="fas fa-history"></i></div><div class="action-label">История</div></div>
                </div>
                <div class="stats-row">
                    <div class="stat-card"><div><i class="fas fa-chart-simple"></i> В стейкинге</div><div class="stat-value">${userData.staking} TON</div></div>
                    <div class="stat-card"><div><i class="fas fa-coins"></i> Доход</div><div class="stat-value">+${userData.totalEarned} TON</div></div>
                </div>
                <div class="section-header"><div class="section-title">Последние транзакции</div></div>
                <div class="transactions-list">
                    ${userData.transactions.slice(0,5).map(tx => `
                        <div class="transaction-item">
                            <div class="transaction-left">
                                <div class="transaction-icon"><i class="fas ${tx.type==='send'?'fa-arrow-up':'fa-arrow-down'}"></i></div>
                                <div class="transaction-info"><h4>${tx.title}</h4><p>${tx.address}</p></div>
                            </div>
                            <div class="transaction-amount"><div class="amount ${tx.amount>0?'positive':'negative'}">${tx.amount>0?'+':''}${tx.amount.toFixed(4)} ${tx.coin}</div><div class="transaction-date">${tx.date}</div></div>
                        </div>
                    `).join('')}
                </div>
            `;
            document.getElementById('currencySelector').onclick = showCurrencyGrid;
            document.querySelectorAll('.action-btn').forEach(btn => {
                const action = btn.getAttribute('data-action');
                btn.onclick = () => {
                    if (action === 'send') showSendModal();
                    else if (action === 'receive') showReceiveModal();
                    else if (action === 'deposit') showDepositModal();
                    else if (action === 'history') showHistoryModal();
                };
            });
            updateBalanceDisplay();
        }
        
        function renderCharts() {
            document.getElementById('app').innerHTML = `
                <div class="chart-3d">
                    <div class="chart-header">
                        <div class="chart-title">${userData.currency} / USD</div>
                        <div class="chart-value" id="currentPrice">$${userData.currency === 'RUB' ? USD_TO_RUB : exchangeRates[userData.currency]}</div>
                    </div>
                    <canvas id="cryptoChart"></canvas>
                    <div class="chart-stats">
                        <div class="chart-stat"><div class="chart-stat-label">24h объем</div><div class="chart-stat-value">$1.2M</div></div>
                        <div class="chart-stat"><div class="chart-stat-label">24h изменение</div><div class="chart-stat-value up" id="priceChange">+12.5%</div></div>
                        <div class="chart-stat"><div class="chart-stat-label">ATH</div><div class="chart-stat-value">$7.82</div></div>
                    </div>
                </div>
                <div class="stats-row">
                    <div class="stat-card"><div>Рыночная капитализация</div><div class="stat-value">$${(exchangeRates[userData.currency] * 3500000000).toLocaleString()}</div></div>
                    <div class="stat-card"><div>Объем 24ч</div><div class="stat-value">$${(exchangeRates[userData.currency] * 15000000).toLocaleString()}</div></div>
                </div>
            `;
            setTimeout(() => draw3DChart(), 100);
            window.addEventListener('resize', () => draw3DChart());
        }
        
        function renderSwap() { /* упрощённо */ document.getElementById('app').innerHTML = `<div class="balance-card"><h3>Обмен валют</h3><p>Функция в разработке</p></div>`; }
        function renderProfile() { /* упрощённо */ document.getElementById('app').innerHTML = `<div class="balance-card"><h3>Профиль</h3><p>${userName}</p><p>ID: ${userId}</p></div>`; }
        function showSendModal() { tg.showAlert('Функция отправки'); }
        function showReceiveModal() { tg.showAlert('Функция получения'); }
        function showHistoryModal() { tg.showAlert('История транзакций'); }
        
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', () => {
                currentTab = btn.getAttribute('data-tab');
                document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if (currentTab === 'wallet') renderWallet();
                else if (currentTab === 'charts') renderCharts();
                else if (currentTab === 'swap') renderSwap();
                else if (currentTab === 'more') renderProfile();
            });
        });
        
        renderWallet();
        
        // Обновление графика каждые 5 секунд
        setInterval(() => {
            if (currentTab === 'charts') {
                chartData = generateChartData();
                draw3DChart();
            }
        }, 5000);
    </script>
</body>
</html>
