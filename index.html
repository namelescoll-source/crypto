<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Crypto Bot - Анимированный интерфейс</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-dark: #0a0a0c;
            --bg-card: #13151a;
            --green-primary: #00d47e;
            --blue: #3b82f6;
            --red: #ff4757;
            --orange: #ff9800;
            --purple: #9c27b0;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --border: #1c1f26;
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-medium: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background: var(--bg-dark);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Анимированный градиентный фон */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(0, 212, 126, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: -1;
            animation: gradientShift 10s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .content {
            padding: 20px;
            padding-bottom: 85px;
            animation: fadeInUp 0.4s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes ripple {
            0% { transform: scale(0); opacity: 0.5; }
            100% { transform: scale(4); opacity: 0; }
        }

        /* Анимированная карточка баланса */
        .balance-card {
            background: linear-gradient(135deg, var(--bg-card) 0%, #0d0f14 100%);
            border-radius: 32px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            transition: all var(--transition-medium);
            animation: fadeInScale 0.5s ease-out;
        }

        .balance-card:hover {
            transform: translateY(-3px);
            border-color: var(--green-primary);
            box-shadow: 0 10px 30px rgba(0, 212, 126, 0.15);
        }

        .balance-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 126, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .balance-card:hover::before {
            left: 100%;
        }

        .balance-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--green-primary), var(--blue), var(--green-primary));
            animation: shimmer 3s infinite;
            background-size: 200% 100%;
        }

        .balance-label {
            font-size: 14px;
            color: var(--text-secondary);
            animation: slideInLeft 0.4s ease-out;
        }

        .balance-amount {
            font-size: 48px;
            font-weight: 700;
            margin: 8px 0;
            background: linear-gradient(135deg, #fff 0%, var(--green-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInScale 0.5s ease-out 0.1s both;
        }

        /* Анимированные кнопки действий */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .action-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition-fast);
            position: relative;
            overflow: hidden;
            animation: fadeInScale 0.4s ease-out backwards;
        }

        .action-btn:nth-child(1) { animation-delay: 0.05s; }
        .action-btn:nth-child(2) { animation-delay: 0.1s; }
        .action-btn:nth-child(3) { animation-delay: 0.15s; }
        .action-btn:nth-child(4) { animation-delay: 0.2s; }

        .action-btn:hover {
            transform: translateY(-3px);
            border-color: var(--green-primary);
            box-shadow: 0 5px 20px rgba(0, 212, 126, 0.2);
        }

        .action-btn:active {
            transform: translateY(0) scale(0.96);
        }

        .action-btn .action-icon {
            font-size: 24px;
            margin-bottom: 6px;
            display: inline-block;
            transition: all var(--transition-fast);
        }

        .action-btn:hover .action-icon {
            transform: scale(1.1) translateY(-2px);
            animation: bounce 0.5s ease;
        }

        /* Анимированные стат-карточки */
        .stats-row {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .stat-card {
            flex: 1;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 16px;
            border: 1px solid var(--border);
            min-width: 100px;
            transition: all var(--transition-fast);
            animation: slideInRight 0.4s ease-out backwards;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.15s; }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: var(--green-primary);
        }

        .stat-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--green-primary), transparent);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .stat-card:hover::after {
            transform: scaleX(1);
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            margin-top: 8px;
            transition: all var(--transition-fast);
        }

        .stat-card:hover .stat-value {
            transform: scale(1.05);
            color: var(--green-primary);
        }

        /* Анимированные транзакции */
        .transactions-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .transaction-item {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all var(--transition-fast);
            animation: slideInLeft 0.4s ease-out backwards;
            position: relative;
            overflow: hidden;
        }

        .transaction-item:hover {
            transform: translateX(5px);
            border-color: var(--green-primary);
            background: rgba(0, 212, 126, 0.05);
        }

        .transaction-item:active {
            transform: scale(0.98);
        }

        .transaction-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1d24 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all var(--transition-fast);
        }

        .transaction-item:hover .transaction-icon {
            transform: scale(1.1) rotate(5deg);
            background: linear-gradient(135deg, var(--green-primary), var(--blue));
        }

        .transaction-item:hover .transaction-icon i {
            animation: bounce 0.5s ease;
        }

        /* Анимированная нижняя панель */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 17, 21, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 16px calc(12px + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid var(--border);
            z-index: 1000;
            animation: fadeInUp 0.5s ease-out;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 10px;
            transition: all var(--transition-fast);
            padding: 8px 16px;
            border-radius: 30px;
            background: transparent;
            border: none;
            position: relative;
            overflow: hidden;
        }

        .nav-item i {
            font-size: 22px;
            transition: all var(--transition-fast);
        }

        .nav-item span {
            transition: all var(--transition-fast);
        }

        .nav-item:hover {
            transform: translateY(-2px);
        }

        .nav-item:hover i {
            transform: translateY(-3px) scale(1.1);
            animation: bounce 0.6s ease;
        }

        .nav-item.active {
            color: var(--green-primary);
        }

        .nav-item.active i {
            transform: translateY(-2px);
            text-shadow: 0 0 10px rgba(0, 212, 126, 0.5);
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            background: var(--green-primary);
            border-radius: 2px;
            animation: slideInLeft 0.3s ease;
        }

        .nav-item:active {
            transform: scale(0.92);
        }

        /* Админ-панель анимация */
        .admin-btn {
            background: linear-gradient(135deg, var(--orange), #ff5722);
            border: none;
            border-radius: 20px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 16px;
            transition: all var(--transition-fast);
            position: relative;
            overflow: hidden;
            animation: pulse 2s infinite;
        }

        .admin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 87, 34, 0.4);
        }

        .admin-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .admin-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .admin-btn:active::after {
            width: 300px;
            height: 300px;
        }

        /* Модальное окно анимация */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
            animation: fadeInUp 0.3s ease;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 32px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border);
            max-height: 90vh;
            overflow-y: auto;
            animation: fadeInScale 0.3s ease;
        }

        /* Анимированный селектор валюты */
        .currency-selector {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 8px 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            margin-top: 12px;
            transition: all var(--transition-fast);
        }

        .currency-selector:hover {
            border-color: var(--green-primary);
            transform: scale(1.02);
        }

        .currency-selector:active {
            transform: scale(0.98);
        }

        .currency-selector i:last-child {
            transition: transform var(--transition-fast);
        }

        .currency-selector:hover i:last-child {
            transform: rotate(180deg);
        }

        /* Анимированные элементы в модалке */
        .payment-method {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all var(--transition-fast);
            animation: slideInLeft 0.3s ease backwards;
        }

        .payment-method:hover {
            transform: translateX(5px);
            border-color: var(--green-primary);
            background: rgba(0, 212, 126, 0.1);
        }

        .payment-method.selected {
            border-color: var(--green-primary);
            background: rgba(0, 212, 126, 0.15);
            transform: scale(1.01);
        }

        .payment-icon {
            transition: all var(--transition-fast);
        }

        .payment-method:hover .payment-icon {
            transform: scale(1.1) rotate(5deg);
        }

        /* Анимированные кнопки в модалке */
        .modal-btn {
            transition: all var(--transition-fast);
            position: relative;
            overflow: hidden;
        }

        .modal-btn:hover {
            transform: translateY(-2px);
        }

        .modal-btn:active {
            transform: translateY(0) scale(0.96);
        }

        /* Анимация загрузки */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--green-primary);
            border-radius: 50%;
            animation: rotate 0.6s linear infinite;
        }

        /* Анимация для графика */
        canvas {
            width: 100%;
            height: 120px;
            transition: all var(--transition-medium);
        }

        canvas:hover {
            transform: scale(1.01);
        }

        /* Анимация для статус-бейджей */
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 10px;
            transition: all var(--transition-fast);
            animation: fadeInScale 0.3s ease;
        }

        .status-pending { background: var(--orange); color: #000; animation: pulse 1.5s infinite; }
        .status-approved { background: var(--green-primary); color: #000; }
        .status-rejected { background: var(--red); color: #fff; }

        /* Анимация для скриншотов */
        .screenshot-preview img {
            transition: all var(--transition-fast);
        }

        .screenshot-preview img:hover {
            transform: scale(1.02);
        }

        /* Анимация для заголовков */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 16px;
            animation: slideInRight 0.4s ease-out;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--green-primary);
            transition: width 0.3s ease;
        }

        .section-title:hover::after {
            width: 100%;
        }

        /* Анимация для поля ввода */
        .modal-input, .modal-textarea {
            transition: all var(--transition-fast);
        }

        .modal-input:focus, .modal-textarea:focus {
            outline: none;
            border-color: var(--green-primary);
            transform: scale(1.01);
            box-shadow: 0 0 10px rgba(0, 212, 126, 0.2);
        }

        /* Адаптивность */
        @media (max-width: 480px) {
            .balance-amount { font-size: 36px; }
            .action-btn { padding: 10px 6px; }
            .nav-item { padding: 6px 12px; }
        }

        /* Скрытие скроллбара но сохранение функционала */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--green-primary);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="content" id="app"></div>

    <div class="bottom-nav">
        <button class="nav-item active" data-tab="wallet"><i class="fas fa-wallet"></i><span>Кошелёк</span></button>
        <button class="nav-item" data-tab="charts"><i class="fas fa-chart-line"></i><span>Графики</span></button>
        <button class="nav-item" data-tab="swap"><i class="fas fa-exchange-alt"></i><span>Обмен</span></button>
        <button class="nav-item" data-tab="more"><i class="fas fa-user"></i><span>Профиль</span></button>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <script>
        // ========== TELEGRAM WEBAPP ==========
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();
        tg.ready();
        tg.setBottomBarColor('#0f1115');

        const user = tg.initDataUnsafe?.user;
        const userName = user ? `${user.first_name} ${user.last_name || ''}` : 'Гость';
        const userId = user ? user.id : Math.floor(Math.random() * 1000000);
        
        // Администраторы
        const ADMIN_IDS = [8993992293];
        const isAdmin = ADMIN_IDS.includes(userId) || localStorage.getItem('isAdminMode') === 'true';
        
        // Настройки админа
        let adminSettings = {
            cardNumber: '5536 9138 1234 5678',
            cardHolder: 'IVAN IVANOV',
            sbpBank: 'Т-Банк',
            sbpPhone: '+7 999 123-45-67',
            tonWallet: 'UQD0xKj3...',
            btcWallet: 'bc1qxyz...',
            usdtWallet: 'TXYZ...',
            yoomoneyWallet: '410011234567890'
        };
        
        const savedSettings = localStorage.getItem('adminSettings');
        if (savedSettings) adminSettings = JSON.parse(savedSettings);
        
        // Курсы валют
        const USD_TO_RUB = 90;
        const exchangeRates = { TON: 5.67, BTC: 67890, ETH: 3456, USDT: 1.00, BNB: 580, SOL: 140, TRX: 0.11, LTC: 82, DOGE: 0.12, XRP: 0.62, RUB: 1.00 };
        
        // Данные пользователя
        let userData = {
            balance: 1284.50,
            currency: 'TON',
            staking: 350,
            totalEarned: 42.5,
            transactions: [
                { id: Date.now() - 3600000, type: "send", title: "Отправлено", address: "0x742...3ef", amount: -50.25, date: new Date(Date.now() - 3600000).toLocaleString(), coin: "TON" },
                { id: Date.now() - 86400000, type: "receive", title: "Получено", address: "Биржа Bybit", amount: 125.00, date: new Date(Date.now() - 86400000).toLocaleString(), coin: "TON" }
            ],
            pendingPayments: [],
            swaps: [],
            referralCode: `CRYPTO${userId}`,
            referrals: 2,
            referralEarned: 12.50
        };
        
        const savedPending = localStorage.getItem('pendingPayments');
        if (savedPending) userData.pendingPayments = JSON.parse(savedPending);
        
        let currentTab = 'wallet';
        let chartData = [42, 38, 45, 52, 48, 55, 60, 58, 62, 68, 65, 70, 75, 72, 78, 82, 80, 85, 88, 92, 95, 90, 88, 85];
        
        // Функции
        function getBalanceInUSD() {
            if (userData.currency === 'RUB') return userData.balance / USD_TO_RUB;
            return userData.balance * exchangeRates[userData.currency];
        }
        
        function formatBalance() {
            if (userData.currency === 'RUB') return `${userData.balance.toFixed(2)} ₽`;
            return `${userData.balance.toFixed(4)} ${userData.currency}`;
        }
        
        function addTransaction(type, title, address, amount, coin = null) {
            userData.transactions.unshift({
                id: Date.now(),
                type: type,
                title: title,
                address: address,
                amount: amount,
                date: new Date().toLocaleString(),
                coin: coin || userData.currency,
                status: 'completed'
            });
            if (userData.transactions.length > 20) userData.transactions.pop();
            localStorage.setItem('userData', JSON.stringify(userData));
        }
        
        function addPendingPayment(amount, method, screenshot) {
            const pending = {
                id: Date.now(),
                userId: userId,
                userName: userName,
                amount: amount,
                method: method,
                screenshot: screenshot,
                date: new Date().toLocaleString(),
                status: 'pending',
                currency: userData.currency
            };
            userData.pendingPayments.unshift(pending);
            localStorage.setItem('pendingPayments', JSON.stringify(userData.pendingPayments));
            return pending;
        }
        
        function approvePayment(paymentId) {
            const payment = userData.pendingPayments.find(p => p.id === paymentId);
            if (payment && payment.status === 'pending') {
                payment.status = 'approved';
                let cryptoAmount;
                if (payment.currency === 'RUB') cryptoAmount = payment.amount;
                else cryptoAmount = payment.amount / exchangeRates[payment.currency];
                userData.balance += cryptoAmount;
                addTransaction('receive', 'Пополнение', `${payment.method.toUpperCase()} перевод`, cryptoAmount);
                localStorage.setItem('pendingPayments', JSON.stringify(userData.pendingPayments));
                localStorage.setItem('userData', JSON.stringify(userData));
                return true;
            }
            return false;
        }
        
        function rejectPayment(paymentId) {
            const payment = userData.pendingPayments.find(p => p.id === paymentId);

            setTimeout(() => {
                const canvas = document.getElementById('priceChart');
                if (canvas) {
                    const ctx = canvas.getContext('2d');
                    const w = canvas.clientWidth, h = canvas.clientHeight;
                    canvas.width = w; canvas.height = h;
                    const pad = 20, cw = w - pad*2, ch = h - pad*2;
                    const max = Math.max(...chartData), min = Math.min(...chartData);
                    ctx.clearRect(0,0,w,h);
                    ctx.strokeStyle = '#1c1f26';
                    for(let i=0;i<=4;i++){ const y = pad + (ch/4)*i; ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(w-pad,y); ctx.stroke(); }
                    ctx.beginPath();
                    let first=true;
                    chartData.forEach((v,i)=>{ const x = pad + (cw/(chartData.length-1))*i; const y = pad + ch - ((v-min)/(max-min))*ch; if(first){ ctx.moveTo(x,y); first=false; }else{ ctx.lineTo(x,y); } });
                    ctx.strokeStyle = '#00d47e';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                }
            }, 100);
        }
        
        function renderSwap() {
            document.getElementById('app').innerHTML = `
                <div class="balance-card"><div style="margin-bottom:20px;"><div style="display:flex; justify-content:space-between;"><span>Отправляете</span><span>Баланс: ${userData.balance.toFixed(4)} ${userData.currency}</span></div><div style="background:#0a0a0c; border-radius:20px; padding:16px;"><div style="display:flex; justify-content:space-between;"><input type="number" id="fromAmount" placeholder="0" style="background:transparent; border:none; font-size:28px; color:white; width:60%;"><div>${userData.currency}</div></div></div></div><div style="text-align:center;"><div style="background:var(--green-primary); width:40px; height:40px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;"><i class="fas fa-arrow-down"></i></div></div><div><div style="background:#0a0a0c; border-radius:20px; padding:16px;"><div style="display:flex; justify-content:space-between;"><input type="text" id="toAmount" placeholder="0" readonly style="background:transparent; border:none; font-size:28px; width:60%;"><div>USDT</div></div></div></div></div>
                <button id="swapBtn" style="width:100%; padding:16px; background:var(--green-primary); border:none; border-radius:20px; color:white; font-weight:600;">Обменять</button>
            `;
            const fromInput = document.getElementById('fromAmount');
            const toInput = document.getElementById('toAmount');
            if(fromInput && toInput) fromInput.oninput = () => { const val = parseFloat(fromInput.value)||0; let usd = userData.currency === 'RUB' ? val/USD_TO_RUB : val * exchangeRates[userData.currency]; toInput.value = usd.toFixed(4); };
            document.getElementById('swapBtn').onclick = () => { const amt = parseFloat(fromInput.value)||0; if(amt<=0) tg.showAlert('Введите сумму'); else if(amt>userData.balance) tg.showAlert('Недостаточно средств'); else tg.showConfirm(`Обменять ${amt} ${userData.currency} на ${toInput.value} USDT?`, c=>{ if(c){ userData.balance -= amt; addTransaction('swap','Обмен',`${userData.currency}→USDT`,-amt); updateBalanceDisplay(); renderWallet(); tg.showAlert('✅ Обмен выполнен'); } }); };
        }
        
        function renderProfile() {
            document.getElementById('app').innerHTML = `
                <div class="balance-card" style="text-align:center;"><div style="width:80px;height:80px;background:linear-gradient(135deg,#00d47e,#00995a);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;"><i class="fas fa-user" style="font-size:40px;"></i></div><h3>${userName}</h3><p style="color:var(--text-secondary);">ID: ${userId}</p></div>
                <div class="transactions-list"><div class="transaction-item" data-action="referral"><div class="transaction-left"><div class="transaction-icon"><i class="fas fa-users"></i></div><div class="transaction-info"><h4>Реферальная программа</h4><p>Пригласи друзей</p></div></div><div><i class="fas fa-chevron-right"></i></div></div><div class="transaction-item" data-action="support"><div class="transaction-left"><div class="transaction-icon"><i class="fas fa-headset"></i></div><div class="transaction-info"><h4>Поддержка</h4><p>Помощь</p></div></div><div><i class="fas fa-chevron-right"></i></div></div><div class="transaction-item" data-action="close"><div class="transaction-left"><div class="transaction-icon"><i class="fas fa-sign-out-alt"></i></div><div class="transaction-info"><h4>Закрыть</h4><p>Выйти</p></div></div><div><i class="fas fa-chevron-right"></i></div></div></div>
            `;
            document.querySelectorAll('.transaction-item[data-action]').forEach(item => { const action = item.dataset.action; item.onclick = () => { if(action === 'referral'){ navigator.clipboard.writeText(`t.me/crypto_bot?start=${userData.referralCode}`); tg.showAlert('✅ Ссылка скопирована'); } else if(action === 'support') tg.openTelegramLink('https://t.me/durov'); else if(action === 'close') tg.close(); }; });
        }
        
        document.querySelectorAll('.nav-item').forEach(btn => { btn.addEventListener('click', () => { currentTab = btn.getAttribute('data-tab'); document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); if(currentTab === 'wallet') renderWallet(); else if(currentTab === 'charts') renderCharts(); else if(currentTab === 'swap') renderSwap(); else if(currentTab === 'more') renderProfile(); }); });
        
        renderWallet();
    </script>
</body>
</html>
